<style>
  :root{
    --navy:#0D1B2A; --steel:#1B4F72; --accent:#2E86AB;
    --niebla:#7C93A6; --light:#E8F4F8; --white:#FFFFFF;
    --ink:#1B2733; --mute:#5C6B78; --line:#E1E8ED;
    --card:#F5F8FB; --ok:#27AE60; --okbg:#E5F6EC; --warn:#C0392B; --tint2:#DCEBF2;
    --repBrand:#2E86AB; --repBrandDk:#1B4F72; --repTint:#E8F4F8; --repTint2:#DCEBF2; --repInk:#0D1B2A; --repTintDk:#132738;
  }
  /* Tema rosa/bordó (alumnas): mismo look "tablero TaFit" del tema azul, en la paleta de marca
     bordó/rosa (antes era lila, se alinea ahora con la estética de marca de TaFit). */
  #app.theme-f{ --navy:#241023; --steel:#6E2A52; --accent:#C04D86; --niebla:#B08AA0; --light:#FBEEF4; --card:#FAF3F7; --tint2:#F6DCEA;
    --repBrand:#B8285A; --repBrandDk:#7A1638; --repTint:#FBEAEF; --repTint2:#F3D3DE; --repInk:#2D0B1B; --repTintDk:#241019; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--navy);color:var(--ink);min-height:100vh}
  a{color:var(--accent)}
  #app{max-width:600px;margin:0 auto;min-height:100vh;background:var(--light);display:flex;flex-direction:column}
  header{background:var(--navy);color:#fff;padding:14px 16px 12px}
  .topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .wm{font-weight:800;font-size:22px;letter-spacing:3px}
  .wm b{color:var(--accent)}
  .topright{display:flex;gap:8px;align-items:center}
  .lockbtn{background:var(--steel);border:none;color:#fff;border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer}
  .bellbtn{position:relative;font-size:15px;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 9px;color:var(--mute)}
  .bell-badge{position:absolute;top:-5px;right:-5px;background:#e74c3c;color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 3px}
  .bell-badge.show{display:flex}
  .notif-ov{position:fixed;inset:0;background:rgba(13,27,42,.55);display:none;align-items:flex-start;justify-content:center;z-index:80;padding:14px}
  .notif-ov.show{display:flex}
  .notif-box{background:#fff;border-radius:14px;max-width:420px;width:100%;max-height:80vh;overflow:auto;padding:16px}
  #app.dark .notif-box{background:#182838;color:#e0e6ed}
  .notif-box h3{font-size:15px;color:var(--navy);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  #app.dark .notif-box h3{color:#e0e6ed}
  .notif-row{padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  #app.dark .notif-row{border-color:#253545}
  .notif-row b{color:var(--navy);display:block;font-size:13px}
  #app.dark .notif-row b{color:#e0e6ed}
  .notif-row span{color:var(--mute)}
  .notif-close{width:100%;margin-top:12px;padding:10px;border:none;border-radius:9px;background:var(--steel);color:#fff;font-weight:700;cursor:pointer}
  .cloud{font-size:11px;letter-spacing:.3px;color:var(--niebla);display:flex;align-items:center;gap:5px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--niebla)}
  .dot.on{background:var(--ok)}
  .dot.pend{background:#E6A23C;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .pickrow{display:flex;gap:8px;margin-top:12px}
  select.alumno{flex:1;padding:11px 12px;border-radius:11px;border:none;font-size:15px;font-weight:700;color:var(--navy);background:#fff}
  .namestatic{flex:1;padding:11px 12px;border-radius:11px;background:#fff;color:var(--navy);font-size:15px;font-weight:700}
  .iconbtn{background:var(--steel);border:none;color:#fff;border-radius:11px;padding:0 14px;font-size:18px;font-weight:700;cursor:pointer}
  .iconbtn:hover{background:var(--accent)}
  nav{display:flex;background:var(--steel)}
  nav button{flex:1;padding:12px 3px;border:none;background:transparent;color:#cfe0ea;font-size:12px;font-weight:700;letter-spacing:.2px;cursor:pointer;border-bottom:3px solid transparent}
  nav button.active{color:#fff;border-bottom-color:var(--accent);background:rgba(255,255,255,.06)}
  main{flex:1;padding:16px 14px 40px}
  .focus{font-size:13px;color:var(--mute);margin-bottom:12px;text-align:center}
  .focus b{color:var(--steel)}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);margin-bottom:8px}

  .seg{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .seg button{flex:1;min-width:84px;padding:10px 4px;border:2px solid var(--line);background:#fff;border-radius:11px;font-size:13px;font-weight:700;color:var(--mute);cursor:pointer}
  .seg button.sel{border-color:var(--accent);color:var(--navy);background:var(--light)}
  .daytag{font-size:11px;margin-left:3px;vertical-align:middle}
  .mseg{margin-top:-4px}
  .mseg button{border-radius:999px;padding:11px 4px}
  .mseg button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
  .weeks{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .weeks button.wlock{opacity:.45;filter:grayscale(.5)}
  .weeks button{flex:1;min-width:54px;padding:9px 2px;border:2px solid var(--line);background:#fff;border-radius:10px;font-size:12px;font-weight:700;color:var(--mute);cursor:pointer;line-height:1.2}
  .weeks button small{display:block;font-weight:600;font-size:9px;color:var(--niebla)}
  .weeks button.sel{border-color:var(--steel);color:#fff;background:var(--steel)}
  .weeks button.sel small{color:#cfe0ea}
  .weekdesc{font-size:12px;color:var(--mute);background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:16px}

  .medbanner{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 13px;margin-bottom:14px;font-size:12.5px;color:var(--steel);font-weight:700}
  .rules .rule{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--light)}
  .rules .rule:last-child{border-bottom:none}
  .rules .rule .ico{font-size:16px;flex:none;line-height:1.4}
  .rules .rule b{font-size:13px;color:var(--navy)}
  .rules .rule p{margin:1px 0 0;font-size:12px;color:var(--mute)}
  .legcard .opts{display:flex;gap:8px;margin-bottom:8px}
  .legcard .opts button{flex:1;padding:10px 0;border:2px solid var(--line);border-radius:11px;background:#fff;font-weight:700;font-size:13px;color:var(--mute);cursor:pointer}
  .legcard .opts button.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .legcard .opts button.warn.on{background:#cf8a23;border-color:#cf8a23;color:#fff}
  .alarmas{display:flex;flex-wrap:wrap;gap:7px}
  .alarmas button{padding:7px 11px;border:2px solid var(--line);border-radius:20px;background:#fff;font-size:12px;font-weight:600;color:var(--mute);cursor:pointer}
  .alarmas button.on{background:#fbeaea;border-color:var(--warn);color:var(--warn)}
  .legwarn{font-size:12px;color:var(--warn);background:#fbeaea;border-radius:9px;padding:9px 11px;margin-top:9px;line-height:1.4;font-weight:600}
  .legnote{font-size:11.5px;color:var(--mute);margin-top:8px;line-height:1.4}

  .progwrap{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:16px;border:1px solid var(--line)}
  .progbar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:7px}
  .progbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
  .proglbl{font-size:12px;color:var(--mute);font-weight:600}

  .ex{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--line);box-shadow:0 2px 8px rgba(13,27,42,.04)}
  .ex h3{font-size:15px;color:var(--navy);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ex h3 .num,.ex-hdr .num{background:var(--steel);color:#fff;width:22px;height:22px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
  .ex .meta{font-size:12px;color:var(--mute);margin:4px 0 2px 30px}
  .ex .alt{font-size:12px;color:var(--niebla);margin:0 0 0 30px}
  .ex .alt b{color:var(--mute);font-weight:700}
  .alt-tap{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
  .chips{margin:9px 0 0 30px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .rest{font-size:12px;font-weight:700;color:var(--steel);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
  .rest:hover{border-color:var(--accent)}
  .vid{font-size:12px;font-weight:700;text-decoration:none;color:var(--accent);background:none;border:none;padding:0;font-family:inherit;cursor:pointer}
  /* Modal de video: se abre adentro de la app en vez de salir a YouTube, cuando el ejercicio tiene un video puntual cargado */
  .vid-modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px}
  .vid-modal-ov.show{display:flex}
  .vid-modal{background:#000;border-radius:14px;overflow:hidden;width:100%;max-width:520px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .vid-modal-top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#161616;color:#fff}
  .vid-modal-top span{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vid-modal-top button{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:4px 8px;flex:none}
  .vid-modal-body{position:relative;width:100%;aspect-ratio:16/9}
  .vid-modal-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .tip{font-size:12px;color:var(--steel);background:var(--light);border-radius:9px;padding:9px 11px;margin:9px 0 0 30px;line-height:1.45}
  /* ---- Técnica en acordeón: cerrado por defecto para no alargar la tarjeta ---- */
  .tipacc{border:1.5px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card);margin:9px 0 0 30px}
  .tipacc summary{list-style:none;display:flex;align-items:center;gap:8px;padding:8px 11px;cursor:pointer;font-size:12px;font-weight:700;color:var(--steel);-webkit-user-select:none;user-select:none}
  .tc-gen{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--niebla);background:var(--light);border-radius:6px;padding:1px 6px}
  #app.dark .tc-gen{background:#111d2b;color:#7a8a9a}
  .tipacc summary::-webkit-details-marker{display:none}
  .tipacc .chev{margin-left:auto;font-size:10px;color:var(--niebla);transition:.15s}
  .tipacc[open] .chev{transform:rotate(180deg)}
  .tipacc[open] summary{border-bottom:1px solid var(--line)}
  .tipacc .tc-body{background:#fff;padding:8px 11px 10px}
  .tipacc .tc-pt{display:flex;gap:8px;align-items:flex-start;padding:5px 0}
  .tipacc .tc-dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:5px;flex-shrink:0}
  .tipacc .tc-pt p{font-size:12px;line-height:1.5;color:var(--ink)}
  #app.dark .tipacc{background:#182838;border-color:#253545}
  #app.dark .tipacc summary{color:#5da4e6}
  #app.dark .tipacc .tc-body{background:#111d2b}
  #app.dark .tipacc .tc-pt p{color:#c0cdd8}

  /* ---- Bloque / circuito: cartel de sección, no un ejercicio con peso y series ---- */
  .block-banner-wrap{margin-bottom:12px}
  .block-banner{background:linear-gradient(135deg,var(--steel),var(--accent));color:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 4px 14px rgba(27,79,114,.25)}
  .block-banner .bb-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .block-banner .bb-ico{font-size:20px;flex:none}
  .block-banner .bb-title{font-size:15px;font-weight:800;letter-spacing:.3px}
  .block-banner .bb-desc{font-size:12.5px;opacity:.92;line-height:1.5;margin:2px 0 12px}
  .block-banner .bb-btn{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.5);color:#fff;font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
  .block-banner .bb-btn:hover{background:rgba(255,255,255,.28)}
  .lastw{font-size:11.5px;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:9px;padding:8px 11px;margin:9px 0 0 0;line-height:1.5}
  .lastw b{color:var(--steel)}
  .member-h{font-size:13px;font-weight:800;color:var(--steel);margin:14px 0 2px;display:flex;align-items:center;gap:7px;padding-top:11px;border-top:1px dashed var(--line)}
  .member-h::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
  .member-h .mo{font-size:11px;font-weight:600;color:var(--niebla)}
  table.sets{width:100%;border-collapse:collapse;margin-top:8px}
  table.sets th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--niebla);font-weight:700;padding:4px;text-align:center}
  table.sets th.s{width:34px;text-align:left}
  table.sets td{padding:3px;text-align:center}
  table.sets td.s{font-size:12px;color:var(--mute);font-weight:700;text-align:left;padding-left:2px}
  .cell{width:100%;padding:9px 4px;border:2px solid var(--line);border-radius:9px;font-size:15px;text-align:center;outline:none}
  .cell:focus{border-color:var(--accent)}
  select.cell{padding:9px 2px;-webkit-appearance:none;appearance:none;background:#fff}
  .chk{width:30px;height:30px;border:2px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-size:15px;color:transparent;line-height:1}
  .chk.on{background:var(--ok);border-color:var(--ok);color:#fff}

  details.rm{margin-top:9px;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
  details.rm summary{list-style:none;cursor:pointer;padding:9px 12px;font-size:12px;font-weight:700;color:var(--steel);display:flex;justify-content:space-between;align-items:center}
  details.rm summary::-webkit-details-marker{display:none}
  details.rm summary .best{font-size:11px;color:var(--mute);font-weight:600}
  .rmgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 12px 12px}
  .rmgrid div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 2px;text-align:center}
  .rmgrid div b{display:block;font-size:14px;color:var(--navy)}
  .rmgrid div span{font-size:10px;color:var(--niebla);text-transform:uppercase;letter-spacing:.5px}
  .rmempty{padding:0 12px 12px;font-size:12px;color:var(--mute)}

  .obs-card textarea{width:100%;min-height:72px;padding:10px;border:2px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;outline:none;resize:vertical}
  .obs-card textarea:focus{border-color:var(--accent)}
  .session-close{width:100%;margin-top:6px;padding:13px;border:none;border-radius:12px;background:var(--steel);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  .motiv-banner{background:linear-gradient(135deg,var(--accent),#6c5ce7);color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;text-align:center;line-height:1.5;margin-bottom:8px}
  .warmup-banner{background:#fff3e0;border:1.5px solid #ffb74d;border-radius:10px;padding:10px 14px;font-size:12px;color:#e65100;margin-bottom:8px;text-align:center;line-height:1.4}
  .cooldown-banner{background:#e8f5e9;border:1.5px solid #81c784;border-radius:10px;padding:10px 14px;font-size:12px;color:#2e7d32;margin-top:12px;text-align:center;line-height:1.4}
  .priv-notes{background:#fef9e7;border:1.5px solid #f9e79f;border-radius:12px;padding:12px;margin-top:12px}
  .pn-title{font-size:12px;font-weight:700;color:#7d6608;margin-bottom:6px}
  .record-banner{background:linear-gradient(135deg,#f39c12,#e67e22);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:700;text-align:center;margin-bottom:8px;animation:pulse 1s ease-in-out 2}
  .quick-edit{background:var(--light);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
  .qe-title{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
  .mini-dash{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--navy);text-align:center;margin-bottom:8px;line-height:1.6}
  .sync-btn{background:none;border:none;color:#fff;font-size:16px;cursor:pointer;margin-left:6px;opacity:.7;font-weight:700}.sync-btn:active{opacity:1;transform:rotate(180deg)}
  .prog-bar2{background:var(--light);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;color:var(--accent);text-align:center;margin-bottom:8px}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
  .install-banner{border-radius:14px;padding:16px;margin-bottom:12px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#1976d2,#1565c0)}
  .theme-f .install-banner{background:linear-gradient(135deg,#d4619a,#a8245e)}
  .install-banner::after{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;background:rgba(255,255,255,.08);border-radius:50%}
  .install-banner .ib-icon{font-size:32px;margin-bottom:8px}
  .install-banner .ib-title{font-size:15px;font-weight:800;margin-bottom:4px}
  .install-banner .ib-text{font-size:12px;opacity:.9;line-height:1.5;margin-bottom:12px}
  .install-banner .ib-btn{background:#fff;color:#1565c0;border:none;border-radius:10px;padding:11px 20px;font-size:13px;font-weight:700;cursor:pointer;width:100%;text-align:center}
  .theme-f .install-banner .ib-btn{color:#a8245e}

  .drop-row{display:flex;gap:3px}.dcell{flex:1;min-width:0;padding:7px 3px!important;text-align:center;font-size:11px!important}
  .move-btns{display:flex;flex-direction:column;gap:2px;margin-right:4px}.mbtn{background:var(--light);border:1px solid var(--line);border-radius:4px;font-size:10px;padding:1px 6px;cursor:pointer;color:var(--steel);line-height:1.2}.mbtn:disabled{opacity:.25;cursor:default}.mbtn:hover:not(:disabled){background:var(--accent);color:#fff}
  .session-close:hover{background:var(--navy)}

  .tcard{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;border:1px solid var(--line)}
  /* Bloque grande que agrupa TODA una Transcripta (rutina + progresión + sesiones) para
     poder plegarla entera — así el ciclo viejo no obliga a scrollear kilómetros para
     llegar al ciclo actual. */
  details.tcycle{margin-bottom:18px;border-radius:16px;border:1.5px solid var(--line);background:var(--card)}
  details.tcycle summary.tcycle-sum{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px}
  details.tcycle summary.tcycle-sum::-webkit-details-marker{display:none}
  details.tcycle summary.tcycle-sum b{font-size:14px;color:var(--navy)}
  details.tcycle summary.tcycle-sum small{display:block;font-weight:600;color:var(--mute);font-size:11.5px;margin-top:2px}
  details.tcycle .tchev{color:var(--niebla);font-size:14px;transition:transform .2s;flex:none}
  details.tcycle[open] .tchev{transform:rotate(180deg)}
  details.tcycle .tcycle-body{padding:0 12px 14px}
  details.tacc{padding:0}
  details.tacc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
  details.tacc summary::-webkit-details-marker{display:none}
  details.tacc summary h2{margin:0;padding:0;border:none}
  details.tacc .tchev{color:var(--niebla);font-size:14px;transition:transform .2s}
  details.tacc[open] .tchev{transform:rotate(180deg)}
  details.tacc .tacc-body{padding:0 16px 14px}
  .tcard h2{font-size:16px;color:var(--navy);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--light)}

  .trow .tv{color:var(--steel);font-weight:700;white-space:nowrap;text-align:right;font-size:12px}

  .log-body{padding:6px 14px 12px}

  /* ---- Editar: interruptor de tipo de fila (bloque/circuito vs ejercicio normal) ---- */
  .type-toggle{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:10px}
  .type-toggle .tt-lbl{font-size:12.5px;font-weight:700;color:var(--navy)}
  .type-toggle .tt-sub{font-size:10.5px;color:var(--mute);margin-top:1px}
  .switch{position:relative;width:38px;height:22px;flex:none;display:block}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .switch .slider{position:absolute;inset:0;background:#c7d2da;border-radius:22px;transition:.2s;pointer-events:none}
  .switch .slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked+.slider{background:var(--ok)}
  .switch input:checked+.slider::before{transform:translateX(16px)}
  .new-fields.hidden,.old-fields.hidden{display:none}
  #app.dark .type-toggle{background:#182838;border-color:#253545}
  #app.dark .type-toggle .tt-lbl{color:#e0e6ed}

  .asis-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

  .asis-cell{aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
  .asis-cell.today{border-color:var(--accent);border-width:2px}
  .asis-cell.p{background:var(--okbg);color:#1b7a43;border-color:var(--ok)}
  .asis-cell.a{background:#fdecea;color:#96281f;border-color:var(--warn)}
  .asis-cell small{font-size:9px}
  .asis-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .asis-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
  .asis-row.p{background:var(--okbg);border-color:var(--ok)}
  .asis-row.a{background:#fdecea;border-color:var(--warn)}
  .asis-rn{font-weight:700;font-size:14px;color:var(--ink)}
  .asis-rchip{font-size:12px;font-weight:700;color:var(--mute)}
  .asis-row.p .asis-rchip{color:#1b7a43}
  .asis-row.a .asis-rchip{color:#96281f}
  .asis-drill{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:6px}
  .asis-drill label{display:block;font-size:11px;font-weight:700;color:var(--mute);margin-bottom:6px}
  .asis-drill select{padding:8px;border-radius:8px;border:1px solid var(--line)}
  .asis-drill button{border:none;background:var(--accent);color:#fff;border-radius:8px;padding:0 14px;font-weight:700;font-size:12px;cursor:pointer}

  .rep-card{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line)}
  .rep-card .rh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .rep-card .rh .rn{font-size:16px;font-weight:800;color:var(--navy)}
  .rep-card .rh .rw{font-size:11px;font-weight:700;color:var(--steel)}
  .rep-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
  .rep-stats div{background:var(--card);border-radius:9px;padding:8px 4px;text-align:center}
  .rep-stats div b{display:block;font-size:18px;color:var(--navy)}
  .rep-stats div span{font-size:10px;color:var(--niebla);text-transform:uppercase;letter-spacing:.4px}
  .rep-last{font-size:12px;color:var(--mute)}
  .rep-flag{font-size:12px;color:var(--warn);font-weight:700;margin-top:6px;background:#fbeaea;border-radius:8px;padding:8px 10px}
  .rep-adh{height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:8px}
  .rep-adh i{display:block;height:100%;background:var(--ok)}

  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .pcard img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover;background:var(--card);cursor:pointer}
  .pcard .pm{padding:8px 10px;font-size:12px;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
  .pcard .pm button{background:none;border:none;color:var(--warn);font-size:11px;font-weight:700;cursor:pointer}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{background:#1e7a45}
  .toast.warn{background:var(--warn)}
  #rest{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:14px;padding:12px 16px;display:none;align-items:center;gap:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  #rest.show{display:flex}
  #rest b{font-size:22px;font-variant-numeric:tabular-nums;min-width:54px;text-align:center}
  #rest button{background:var(--accent);border:none;color:#fff;border-radius:9px;padding:7px 12px;font-weight:700;cursor:pointer}
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:70;padding:18px}
  #lb.show{display:flex}
  #lb img{max-width:100%;max-height:100%;border-radius:10px}
  #modal{position:fixed;inset:0;background:rgba(13,27,42,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:22px}
  #modal.show{display:flex}
  #modal .mbox{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:360px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
  #modal .mtitle{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:13px;line-height:1.4}
  #modal .minput{width:100%;padding:11px;border:2px solid var(--line);border-radius:10px;font-size:16px;outline:none;margin-bottom:14px}
  #modal .minput:focus{border-color:var(--accent)}
  #modal .minput.hide{display:none}
  #modal .mbtns{display:flex;gap:8px}
  #modal .mbtns button{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
  #modal #mcancel{background:var(--card);color:var(--mute);border:2px solid var(--line)}
  #modal #mok{background:var(--accent);color:#fff}
  /* Forms */
  .form-sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
  .form-sec-hdr{padding:12px 16px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;align-items:center}
  .form-sec-hdr.acuerdo{background:var(--light);color:var(--accent)}
  .form-sec-hdr.anamnesis{background:var(--light);color:var(--accent)}
  .theme-f .form-sec-hdr.acuerdo{background:#ede5f8;color:#5e3d8f}
  .theme-f .form-sec-hdr.anamnesis{background:#e3f0e8;color:#1a5c35}
  .form-body{padding:16px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:540px){.form-grid{grid-template-columns:1fr}}
  .form-field{display:flex;flex-direction:column;gap:4px}
  .form-field.full{grid-column:1/-1}
  .form-lbl{font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
  .form-lbl .req{color:#c44}
  .form-inp{background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;color:var(--navy);width:100%;outline:none;font-family:inherit}
  .form-inp:focus{border-color:var(--accent)}
  textarea.form-inp{resize:vertical;min-height:60px}
  select.form-inp{appearance:auto}
  .form-checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .form-chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--navy);cursor:pointer;padding:7px 12px;border-radius:8px;border:1.5px solid var(--line)}
  .form-chk input{accent-color:var(--accent);width:15px;height:15px}
  .form-radios{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .form-rad{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--navy);cursor:pointer;padding:7px 12px;border-radius:8px;border:1.5px solid var(--line)}
  .form-rad input{accent-color:var(--accent)}
  .form-reveal{margin-top:8px;padding:12px;background:var(--bg);border-radius:10px;border:1.5px solid var(--line);display:none}
  .form-reveal.show{display:block}
  .form-clause{font-size:13px;color:var(--navy);line-height:1.7;margin-bottom:12px}
  .form-clause b{color:var(--accent)}
  .form-status{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600}
  .form-status.done{background:#e0f5e6;color:#1a5c35}
  .form-status.pending{background:#fff3e0;color:#b36b00}
  .form-view-val{font-size:14px;color:var(--navy);padding:6px 0;border-bottom:1px solid var(--line)}
  /* Accordion */
  .ex-hdr{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent;border-bottom:1px solid var(--line)}
  .ex-hdr-info{flex:1;min-width:0}
  .ex-hdr-name{font-weight:700;font-size:14px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ex-hdr-meta{font-size:11.5px;color:var(--mute);margin-top:2px}
  .ex-hdr-prog{display:flex;gap:3px;margin-top:4px}
  .ex-hdr-prog i{width:18px;height:4px;border-radius:2px;background:var(--line)}
  .ex-hdr-prog i.done{background:var(--ok)}
  .ex-thumb{flex:none;width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--steel);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
  .ex-thumb svg{width:26px;height:26px}
  .ex-thumb img{width:100%;height:100%;object-fit:cover}
  #lb .lb-icon{background:#fff;border-radius:16px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:220px;margin:0 auto}
  #lb .lb-icon svg{width:120px;height:120px;color:var(--steel)}
  #lb .lb-icon-lbl{font-size:13px;font-weight:700;color:var(--navy);text-align:center}
  .ex-chev{font-size:18px;color:var(--mute);transition:transform .2s;flex:0 0 auto}
  .ex-chev.open{transform:rotate(180deg)}
  .ex-body{display:none;padding:12px 16px 16px}
  .ex-body.open{display:block}
  .ex.open-ex{border-left:3px solid var(--accent)}
  .session-saved{text-align:center;padding:16px;background:var(--ok);color:#fff;border-radius:12px;margin-top:12px;font-weight:600;font-size:14px}
  .max-w{font-size:10px;color:var(--ok);font-weight:700}
  .inact{font-size:11px;color:#c44;font-weight:700;margin-top:4px}
  .wa-btn{display:none}
  .wa-float{position:fixed;bottom:18px;right:18px;width:50px;height:50px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:50;text-decoration:none;font-size:26px}
  .wa-ex{font-size:11px;color:#25d366;text-decoration:none;font-weight:600;padding:4px 8px;border:1px solid #25d366;border-radius:8px;display:inline-flex;align-items:center;gap:3px}
  .welcome-overlay{position:fixed;inset:0;background:rgba(13,27,42,.6);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px}
  .welcome-box{background:#fff;border-radius:20px;padding:28px 24px;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .welcome-box h2{font-size:20px;margin-bottom:8px;color:var(--navy)}
  .welcome-box p{font-size:14px;color:var(--mute);line-height:1.6;margin-bottom:16px}
  .welcome-box button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 24px;font-size:14px;font-weight:700;cursor:pointer}
  .dark-toggle{font-size:11px;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 10px;color:var(--mute)}
  /* Dark mode */
  /* --ink es el color de texto "principal" en TODA la app (nombres, títulos de tarjeta, valores).
     Antes solo se redefinían acá los demás tokens del tema oscuro y --ink se quedaba con su
     valor casi negro de siempre — por eso varios textos quedaban invisibles en modo oscuro
     (texto oscuro sobre tarjeta oscura): nombres en Asistencia, títulos del Informe, etc.
     Los pocos lugares que ya tenían su propio color fijo para modo oscuro (con selector más
     específico, ej. #app.dark .plan-date-inp) siguen ganando por especificidad, así que este
     cambio no les toca nada. */
  #app.dark{--navy:#e0e6ed;--steel:#8a9ab0;--accent:#5da4e6;--ok:#4caf93;--warn:#e05555;--ink:#e0e6ed;--mute:#7a8a9a;--line:#253545;--bg:#111d2b;--light:#182838;--card:#182838;--niebla:#253545}
  #app.dark .ex{background:#182838;border-color:#253545}
  #app.dark .form-inp{background:#111d2b;border-color:#253545;color:#e0e6ed}
  #app.dark .form-sec{border-color:#253545}
  #app.dark .form-chk,#app.dark .form-rad{border-color:#253545;color:#c0cdd8}
  #app.dark header{background:#0f1a28}
  #app.dark .seg button{background:#182838;border-color:#253545;color:#8a9ab0}
  #app.dark .seg button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
  #app.dark .weeks button{background:#182838;border-color:#253545}
  #app.dark .weeks button.sel{border-color:var(--accent);background:#1e3048}
  #app.dark .edit-section{background:#182838;border-color:#253545}
  #app.dark .tcard{background:#182838;border-color:#253545}
  #app.dark .rep-card{background:#182838;border-color:#253545}
  #app.dark .asis-row{background:#182838;border-color:#253545}
  #app.dark .asis-cell{background:#182838;border-color:#253545;color:#e0e6ed}
  #app.dark .asis-drill{background:#182838;border-color:#253545}
  #app.dark .pago-block.vencido{background:#2a1616;border-color:#5a2a2a}
  #app.dark .pago-block.porvencer{background:#2a2416;border-color:#5a4a2a}
  #app.dark .pago-block.aldia{background:#16281f;border-color:#2a5a3f}
  #app.dark .pago-block.sinreg{background:#182838;border-color:#253545}
  #app.dark input,#app.dark select,#app.dark textarea{background:#111d2b;border-color:#253545;color:#e0e6ed}
  #app.dark .welcome-box{background:#182838}
  #app.dark .welcome-box h2{color:#e0e6ed}
  #app.dark .welcome-box p{color:#8a9ab0}
  #app.dark #modal .mbox{background:#182838}
  #app.dark .weekdesc{background:#182838;border-color:#253545;color:#e0e6ed}
  #app.dark .progwrap{background:#182838;border-color:#253545}
  /* Dark mode + tema femenino */
  #app.dark.theme-f{--accent:#d4619a;--ok:#4caf93;--warn:#e05555}
  #app.dark.theme-f .seg button.sel{background:#d4619a;border-color:#d4619a}
  #app.dark.theme-f .weeks button.sel{border-color:#d4619a;background:#2a1a2a}
  #app.dark.theme-f .ex.open-ex{border-left-color:#d4619a}
  #app.dark.theme-f header{background:#1a1020}
  /* Tabata */
  .tabata-overlay{position:fixed;inset:0;background:rgba(13,27,42,.9);display:none;align-items:center;justify-content:center;z-index:75;padding:20px}
  .tabata-overlay.show{display:flex}
  .tabata-box{text-align:center;width:100%;max-width:340px}
  .tabata-title{font-size:14px;letter-spacing:3px;color:#5da4e6;font-weight:800;margin-bottom:8px}
  .tabata-modes{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
  .tabata-modes button{padding:7px 14px;border:1.5px solid #2a3a4a;border-radius:20px;background:transparent;color:#99a8b8;font-size:12px;font-weight:700;cursor:pointer}
  .tabata-modes button.sel{background:#5da4e6;border-color:#5da4e6;color:#fff}
  .tabata-modehelp{font-size:11px;color:#7a8a9a;margin-top:10px;line-height:1.5;max-width:280px;margin-left:auto;margin-right:auto}
  .tabata-time{font-size:80px;font-weight:900;color:#fff;font-family:'system-ui';line-height:1}
  .tabata-phase{font-size:22px;font-weight:700;color:#fff;margin:12px 0;padding:8px 20px;border-radius:12px;display:inline-block}
  .tabata-phase.work{background:#e74c3c;color:#fff}
  .tabata-phase.rest-phase{background:#2ecc71;color:#fff}
  .tabata-phase.done{background:#f39c12;color:#fff}
  .tabata-round{font-size:14px;color:#99a8b8;margin:8px 0 16px}
  .tabata-controls{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
  .tabata-controls button{padding:10px 18px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;color:#fff}
  .tabata-controls button:first-child{background:#2ecc71}
  .tabata-controls button:nth-child(2){background:#e74c3c}
  .tabata-controls button:last-child{background:#34495e}
  .tabata-config{display:flex;gap:8px;justify-content:center}
  .tabata-config .fld{text-align:center}
  .tabata-config label{font-size:10px;color:#7a8a9a;display:block;margin-bottom:4px}
  .tabata-config input{width:60px;text-align:center;padding:8px;border:1.5px solid #2a3a4a;border-radius:8px;background:#0d1b2a;color:#fff;font-size:16px;font-weight:700}
  .tabata-btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;margin-top:8px}
  @media print{ header,nav,.seg,.weeks,.session-close,.edit-actions,.iconbtn,.lockbtn,.rest,.no-print{display:none!important} body,#app,main{background:#fff!important} #resumenCard{box-shadow:none!important;border-radius:0!important;max-width:100%!important} .icard{break-inside:avoid} }

  /* Informe de Progreso · formato "tablero" (tarjetas con estadísticas, récords, ejercicios y gráficos) */
  #resumenCard{max-width:420px;margin:0 auto}
  .irep-head{background:linear-gradient(135deg,var(--repInk),var(--repBrand));color:#fff;border-radius:16px;padding:20px 20px 18px;margin-bottom:14px}
  .rword{font-size:22px;font-weight:900;letter-spacing:-1px}
  .rword span{font-weight:400}
  .icard{background:#fff;border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  #app.dark .icard{background:#182838}
  .icard h3{font-size:13px;font-weight:800;color:var(--ink);margin:0 0 12px}
  .istats{display:flex;gap:8px}
  .istat{flex:1;border-radius:10px;padding:10px 6px;text-align:center}
  .istat b{display:block;font-size:21px;font-weight:900}
  .istat span{font-size:9.5px;font-weight:700}
  .irec{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--light)}
  .irec:last-child{border:none}
  .irec .medal{font-size:22px}
  .irec .name{font-weight:700;font-size:13px;color:var(--ink)}
  .irec .chg{font-size:12px;color:var(--mute)}
  .irec .chg b{color:var(--ok)}
  .irec .diff{background:var(--okbg);color:var(--ok);font-weight:800;font-size:12px;padding:4px 10px;border-radius:8px;white-space:nowrap}
  .iex{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--light)}
  .iex:last-child{border:none}
  .iex .tr{font-size:15px;width:20px;text-align:center;flex-shrink:0}
  .iex b{display:block;font-weight:600;font-size:12.5px;color:var(--ink)}
  .iex small{color:var(--mute);font-size:10.5px}
  .iex .w{font-weight:700;font-size:12.5px;padding:4px 9px;border-radius:8px;white-space:nowrap}
  .iex .w.up{background:var(--okbg);color:var(--ok)}
  .iex .w.down{background:#ffebee;color:#c62828}
  .iex .w.same, .iex .w.none{background:var(--card);color:var(--mute)}
  .prbadge{display:inline-block;font-size:9.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,#f5a623,#e8580c);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
  .iex-acc{border-bottom:1px solid var(--light)}
  .iex-acc:last-child{border-bottom:none}
  .iex-acc summary{padding:10px 0!important;font-size:13px;font-weight:700;color:var(--ink)}
  .iex-acc .tacc-body{padding:0 0 8px!important}
  .iex-acc .iex:first-child{padding-top:2px}
  .ichart-label{font-size:11px;color:var(--mute);font-weight:700;margin:12px 0 6px}
  .ichart-label:first-of-type{margin-top:0}
  .ichart{display:flex;align-items:flex-end;gap:4px;height:66px;margin-bottom:6px}
  .ichart .bar{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
  .ichart .bar .v{font-size:8.5px;color:var(--mute);margin-bottom:2px;white-space:nowrap}
  .ichart .bar .b{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--repBrand),var(--repBrandDk))}
  .ichart .bar .wk{font-size:8.5px;color:var(--niebla);margin-top:2px}

  /* ===== Marca TaFit para el Informe de Progreso: tipografía serif para los títulos + tarjetas
     "tablero", como la referencia visual que mandó Tami. Los colores siguen viniendo de las
     variables --rep* de siempre (azul para tema por defecto, bordó/rosa para #app.theme-f más
     arriba) para que cada alumno mantenga SU color — esto solo cambia la tipografía y la forma
     de las tarjetas, no fuerza un color único para todos. Todo escapado a esta sola pantalla
     — #resumenCard/.icard/etc siguen siendo los mismos, así el resto de la app no se toca. */
  .tafit-report .rword{ font-family:'Playfair Display',Georgia,serif; font-weight:900; }

   TaFit · multi-alumno · v8 (Firebase sync + offline + dúos por pestaña + timer manual)
   ==================================================================== */
let fireSync=()=>{},fireDel=()=>{};
let _fromRemote=false;
const DEVICE_ID=(()=>{ try{ let id=localStorage.getItem('tafit:devid'); if(!id){ id='d_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); localStorage.setItem('tafit:devid',id); } return id; }catch(e){ return 'd_'+Math.random().toString(36).slice(2,10); } })();

const Store=(()=>{
  const cloud=(typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function');
  let ls=false; try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); ls=true; }catch(e){ ls=false; }
  const mem={};
  async function get(k){ if(cloud){ try{ const r=await window.storage.get(k,false); return r?r.value:null; }catch(e){ return null; } } if(ls){ try{ return localStorage.getItem(k); }catch(e){ return (k in mem)?mem[k]:null; } } return (k in mem)?mem[k]:null; }
  async function set(k,v){ if(cloud){ try{ await window.storage.set(k,v,false); fireSync(k,v); return true; }catch(e){ return false; } } if(ls){ try{ localStorage.setItem(k,v); fireSync(k,v); return true; }catch(e){ return false; } } mem[k]=v; fireSync(k,v); return true; }
  async function del(k){ if(cloud){ try{ await window.storage.delete(k,false); fireDel(k); return; }catch(e){} } if(ls){ try{ localStorage.removeItem(k); fireDel(k); return; }catch(e){} } delete mem[k]; fireDel(k); }
  return { get,set,del, where:cloud?'nube':(ls?'dispositivo':'memoria'), cloud, ls };
})();

function ex(n,s,r,w,alt,tip,rest){ return { n, s, r, w, alt:alt||"", tip:tip||"", rest:rest||"", vid:YT(n) }; }
function exD(n,s,r,wA,wB,alt,tip,rest){ const e=ex(n,s,r,wA,alt,tip,rest); e.w2=wB; return e; }
function YT(n){ return "https://www.youtube.com/results?search_query="+encodeURIComponent((n||"ejercicio")+" técnica ejercicio"); }
/* ==== Ver técnica sin salir de la app ====
   YouTube no permite embeber su página de resultados de búsqueda (solo videos puntuales vía /embed/ID),
   así que: si el link es un video puntual (watch?v=, youtu.be/, shorts/) lo mostramos en un modal adentro
   de la app; si es un link de búsqueda genérico (el que se arma solo con YT(nombre)), no hay forma de
   embeberlo y se abre YouTube afuera, como hasta ahora. Cuando cargás un video puntual (en la Biblioteca
   o en el ejercicio de la rutina) queda todo adentro de la app. */
function extractYouTubeId(url){
  if(!url) return null;
  let m=String(url).match(/[?&]v=([A-Za-z0-9_-]{6,})/); if(m) return m[1];
  m=String(url).match(/youtu\.be\/([A-Za-z0-9_-]{6,})/); if(m) return m[1];
  m=String(url).match(/youtube\.com\/shorts\/([A-Za-z0-9_-]{6,})/); if(m) return m[1];
  m=String(url).match(/youtube\.com\/embed\/([A-Za-z0-9_-]{6,})/); if(m) return m[1];
  return null;
}
function playVideo(url,name){
  const id=extractYouTubeId(url);
  if(id) openVideoModal(id,name);
  else window.open(url,'_blank','noopener');
}
function openVideoModal(id,name){

}

}
const BK=l=>"🔗 Bloque "+l+" · apareado";

/* ==== Bloque / circuito: cartel de sección, no un "ejercicio" con peso y series ====
   Formato nuevo: ex.blk=true + ex.blkWork/ex.blkRest/ex.blkRounds (segundos/vueltas explícitos).
   Formato viejo (ya cargado en algunas rutinas, ej "── BLOQUE 1 (45s/15s) ──"): se detecta por
   el patrón de guiones en el nombre y se interpreta al vuelo, sin tocar los datos guardados. */
/* Tipo de día (opcional): permite diferenciar por ejemplo días de Gimnasio de días de Funcional
   dentro de la misma rutina, útil para alumnos que alternan entre lugares/rutinas (ej: viajan sin gym). */
const DAYTYPE_OPTS=[{v:'',l:'General (sin tipo)'},{v:'gym',l:'🏋️ Gimnasio'},{v:'funcional',l:'🎒 Funcional'}];
function dayTypeTag(d){ if(!d||!d.type) return ''; const o=DAYTYPE_OPTS.find(x=>x.v===d.type); return o?o.l:''; }
function isBlockRow(ex){ return !!(ex&&(ex.blk||/^──.*──\s*$/.test((ex.n||'').trim()))); }
function blockTitleClean(ex){ return (ex.n||'').replace(/^──\s*/,'').replace(/\s*──$/,'').trim()||'Bloque'; }
function getBlockCfg(ex){
  if(ex.blk){ return { title:blockTitleClean(ex), desc:ex.tip||'', work:+ex.blkWork||0, rest:+ex.blkRest||0, rounds:Math.max(1,+ex.blkRounds||+ex.s||3) }; }
  /* legado: intenta sacar "(45s/15s)" del nombre; si no hay patrón, queda sin temporizador de trabajo/descanso (solo el chip de descanso) */
  const m=(ex.n||'').match(/\((\d+)\s*s\s*\/\s*(\d+)\s*s\)/i);
  return { title:blockTitleClean(ex), desc:ex.tip||'', work:m?+m[1]:0, rest:m?+m[2]:(restSec(ex.rest)||0), rounds:Math.max(1,+ex.s||3) };
}

/* Técnica en acordeón: cerrada por defecto para no alargar la tarjeta (nativo <details>,
   funciona sin JavaScript también). Si escribís cada punto en una línea nueva en "Técnica",
   se muestran como puntos separados; si no, se muestra como un solo párrafo. */
function tipAccordionHTML(tip,isGeneric){
  const pts=(tip||'').split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const body=(pts.length>1?pts:[tip]).map(p=>`<div class="tc-pt"><span class="tc-dot"></span><p>${esc(p)}</p></div>`).join('');
  const lbl=isGeneric?'💡 Técnica <span class="tc-gen">general</span>':'💡 Técnica';
  return `<details class="tipacc"><summary>${lbl} <span class="chev">▾</span></summary><div class="tc-body">${body}</div></details>`;
}

/* ==== Cumpleaños: se leen de "Fecha de nacimiento" (Anamnesis o Acuerdo), sin pedir carga aparte ==== */
function parseFechaNac(str){
  if(!str) return null;
  const m=String(str).match(/^(\d{4})-(\d{2})-(\d{2})/); /* formato <input type=date> */
  if(!m) return null;
  const mo=+m[2],d=+m[3];
  if(mo<1||mo>12||d<1||d>31) return null;
  return {m:mo,d:d};
}
function daysUntilBirthday(mo,d){
  const now=new Date(); now.setHours(0,0,0,0);
  let next=new Date(now.getFullYear(),mo-1,d);
  if(next<now) next=new Date(now.getFullYear()+1,mo-1,d);
  return Math.round((next-now)/86400000);
}

/* ==== Vencimiento de plan: opcional, se calcula a partir de la fecha del último pago cargada
   a mano en Editar. El plan dura 30 días desde esa fecha. Si no hay fecha cargada, no se
   muestra ninguna alerta (no se asume nada sobre alumnos sin el dato). ==== */
const PLAN_DAYS=30;
function todayISO(){ return new Date().toISOString().slice(0,10); }
function planDueInfo(planPaidISO){
  if(!planPaidISO) return null;
  const paid=new Date(planPaidISO+'T00:00:00');
  if(isNaN(paid.getTime())) return null;
  const now=new Date(); now.setHours(0,0,0,0);
  const due=new Date(paid.getTime()); due.setDate(due.getDate()+PLAN_DAYS);
  const daysLeft=Math.round((due-now)/86400000);
  const status=daysLeft<0?'bad':(daysLeft<=5?'warn':'ok');
  const dueStr=due.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});
  return { daysLeft, dueStr, status };
}

function lolaAntoWeekOverrides(){
  const prog={1:{s:4,r:"1×12 + 3×10"},2:{s:4,r:"2×10 + 2×8"},3:{s:4,r:"8"},4:{s:4,r:"2×12 + 2×8"},5:{s:4,r:"12"}};

  const out={_wMigrated:true};
  nMainByDay.forEach(function(nMain,di){
    Object.keys(prog).forEach(function(wi){
      for(let ei=nAbs; ei<nAbs+nMain; ei++){ out['wo_w'+wi+'_'+di+'_'+ei]=Object.assign({},prog[wi]); }
    });
  });
  return out;
}

async function saveDB(force){
  /* Protección contra pisadas — historia completa:
     v1 (sin chequeo): el último dispositivo que guardaba pisaba TODO el objeto DB entero
     (todos los alumnos juntos en un solo documento), sin importar si su copia era vieja.
     Eso pisó "Hip thrust cerrado" de Sofi/Marti y borró a Lola/Anto.
     v2 (chequeo global + force): antes de guardar se comparaba un _ts general contra el
     servidor, y si el servidor era "más nuevo" se descartaba TODO el guardado local. Pero
     como cualquier guardado de CUALQUIER alumno actualiza ese mismo _ts general, esto
     rechazaba guardados legítimos de un alumno solo porque OTRO alumno se había guardado
     después en otro lado — eso fue lo que hizo que importar un backup se autodescartara
     ("lo subo y desaparece"), y se parchó con 'force' para las importaciones.
     v3 (esta versión — merge por alumno): en vez de aceptar o rechazar TODO el documento
     en bloque, se compara alumno por alumno contra el servidor. Si ESTE dispositivo no
     tocó a un alumno desde la última vez que sincronizó (sigue exactamente igual a como lo
     cargó), se respeta lo que haya en el servidor para ese alumno — puede ser más nuevo,
     por ejemplo un cambio hecho desde otro celular. Solo se escribe la versión local del
     alumno que realmente se editó en este dispositivo. Así, guardar un cambio en un alumno
     nunca puede volver a pisar el trabajo reciente de otro — ni siquiera con un dispositivo
     que tenía la app abierta desde hace rato con datos desactualizados. Esto reemplaza al
     chequeo global de v2, así que ya no hace falta rechazar ni descartar guardados enteros;
     'force' se mantiene solo por compatibilidad con quien la llama, pero ya no cambia el
     comportamiento: el merge por alumno es siempre seguro, incluso al importar un backup
     (los alumnos que trae el backup se guardan tal cual se importaron; los que el backup no
     conoce —por ejemplo si se sumó un alumno nuevo después de exportarlo— se conservan). */
  let _mergedFromServer=false;
  if(fsDB){
    try{
      const snap=await fsDB.collection('kv').doc('tafit:students').get({source:'server'});
      if(snap.exists){
        const remote=safeParse(snap.data().v,null);
        if(remote&&remote.students){
          const base=safeParse(_syncBaseline,null);
          const baseStudents=(base&&base.students)||{};
          const mergedStudents={};
          const ids=new Set(Object.keys(DB.students||{}).concat(Object.keys(remote.students||{})));
          ids.forEach(id=>{
            const localHas=DB.students&&Object.prototype.hasOwnProperty.call(DB.students,id);
            const remoteHas=Object.prototype.hasOwnProperty.call(remote.students,id);
            if(localHas&&!remoteHas){ mergedStudents[id]=DB.students[id]; return; }
            if(!localHas&&remoteHas){ mergedStudents[id]=remote.students[id]; return; }
            /* está en los dos lados. Si este dispositivo ni siquiera tenía a este alumno
               en su última sincronización conocida (por ejemplo: recién abre la app y su
               caché local venía incompleta, y runSeeds() lo volvió a crear de cero con la
               rutina "de fábrica" del código), NO podemos asumir que el valor local es un
               cambio real — es casi seguro una recreación desde el molde original, y el
               servidor ya tenía una versión real (con ediciones hechas desde otro
               dispositivo). En ese caso, el servidor manda siempre. Recién si este
               dispositivo YA conocía a este alumno y su copia cambió de verdad respecto a
               eso, confiamos en que es una edición real y priorizamos lo local. */
            const hadInBaseline=Object.prototype.hasOwnProperty.call(baseStudents,id);
            if(!hadInBaseline){ mergedStudents[id]=remote.students[id]; return; }
            const unchanged=JSON.stringify(DB.students[id])===JSON.stringify(baseStudents[id]);
            mergedStudents[id]=unchanged?remote.students[id]:DB.students[id];
          });
          const mergedOrder=(DB.order||[]).filter(id=>mergedStudents[id]);
          (remote.order||[]).forEach(id=>{ if(mergedStudents[id]&&mergedOrder.indexOf(id)===-1) mergedOrder.push(id); });
          Object.keys(mergedStudents).forEach(id=>{ if(mergedOrder.indexOf(id)===-1) mergedOrder.push(id); });
          const settingsUnchanged=JSON.stringify(DB.settings)===JSON.stringify(base&&base.settings);
          const seedKeys=new Set(Object.keys(remote._seed||{}).concat(Object.keys(DB._seed||{})));
          const mergedSeed={};
          seedKeys.forEach(k=>{ mergedSeed[k]=!!(remote._seed&&remote._seed[k])||!!(DB._seed&&DB._seed[k]); });
          DB={
            order:mergedOrder,
            students:mergedStudents,
            settings:(settingsUnchanged&&remote.settings)?remote.settings:DB.settings,
            _seed:mergedSeed,
          };
          _mergedFromServer=true;
        }
      }
    }catch(e){ /* sin señal u otro error: seguimos con el guardado normal (offline-first) */ }
  }
  DB._ts=Date.now();
  await Store.set('tafit:students', JSON.stringify(DB));
  /* SEGUNDA CAUSA (25/09/2026) de "se ve bien un instante y después vuelve a lo malo":
     acá siempre se adelantaba _syncBaseline, incluso cuando este guardado NO se pudo
     comparar contra el servidor (fsDB todavía null, sin señal, etc. — el caso típico es el
     primer guardado del arranque, justo el que hace runSeeds() al forzar una corrección).
     Eso hacía que, un rato después, cuando SÍ había señal y pushAllLocal() volvía a llamar
     a saveDB() para comparar de verdad, este alumno ya figurara como "sin cambios desde el
     baseline" — porque el baseline se había adelantado de más, a upa de un guardado que
     nunca miró al servidor — y el merge terminaba prefiriendo la versión vieja del servidor
     por sobre la corrección recién aplicada. Ahora _syncBaseline solo avanza cuando este
     guardado realmente se comparó contra el servidor: así, la próxima vez que haya señal,
     el merge todavía puede ver que el alumno cambió de verdad desde la última comparación
     real, y la corrección gana en vez de perderse. */
  if(_mergedFromServer||_syncBaseline===null) setSyncBaseline();
}

/* Protección: al recibir LOGS de Firebase, solo AGREGAR sesiones nuevas, nunca borrar existentes */
function mergeLogs(localLogs, remoteLogs){
  if(!remoteLogs||!remoteLogs.length) return localLogs;
  if(!localLogs||!localLogs.length) return remoteLogs;
  const localDates=new Set(localLogs.map(l=>l.date));
  const merged=localLogs.slice();
  remoteLogs.forEach(function(rl){
    if(!localDates.has(rl.date)) merged.push(rl);
  });
  merged.sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
  return merged;
}

function formKey(type){ const mm=membersOf(); return 'tafit:form:'+type+':'+active+(mm.length>1?':'+member:''); }
function mediaKey(prefix){ const mm=membersOf(); return prefix+active+(mm.length>1?':'+member:''); }
async function loadForm(type){ return safeParse(await Store.get(formKey(type))||'{}',{}); }
async function saveForm(type,data){ data._ts=new Date().toISOString(); await Store.set(formKey(type), JSON.stringify(data)); }

function renderFormHTML(schema,data,type,editable){
  let h='';
  schema.forEach((sec,si)=>{
    const secOpen=!sec.accordion||data._ts;
    h+=`<div class="form-sec"><div class="form-sec-hdr ${type}" data-act="formAccordion" data-si="${si}" style="cursor:pointer;display:flex;align-items:center">${esc(sec.title)}${sec.accordion?'<span class="ex-chev" style="margin-left:auto;font-size:14px">▾</span>':''}</div><div class="form-body form-acc-body" data-secidx="${si}"${sec.accordion&&!secOpen?' style="display:none"':''}><div class="form-grid">`;
    sec.fields.forEach(f=>{
      const val=data[f.k]||'';
      const cls='form-field'+(f.full?' full':'');
      const req=f.req?'<span class="req"> *</span>':'';
      if(f.type==='fixed'){
        h+=`<div class="${cls}"><div class="form-lbl">${esc(f.l)}</div><div class="form-view-val" style="font-weight:600">${esc(f.value)}</div></div>`;
      } else if(!editable){
        let display=val;
        if(f.type==='check') display=val?'✓ Sí':'✗ No';
        if(f.type==='yesno') display=val==='si'?'Sí':(val==='no'?'No':'—');
        if(f.type==='checks'&&Array.isArray(val)) display=val.join(', ')||'—';
        if(!display&&display!==0) display='—';
        h+=`<div class="${cls}"><div class="form-lbl">${esc(f.l)}</div><div class="form-view-val">${esc(String(display))}</div></div>`;
      } else if(f.type==='textarea'){
        const show=f.reveal?(' data-reveal="'+f.reveal+'"'):'';
        h+=`<div class="${cls}"${show}${f.reveal&&data[f.reveal]!=='si'?' style="display:none"':''}><div class="form-lbl">${esc(f.l)}${req}</div><textarea class="form-inp" data-fk="${f.k}">${esc(val)}</textarea></div>`;
      } else if(f.type==='select'){
        h+=`<div class="${cls}"><div class="form-lbl">${esc(f.l)}${req}</div><select class="form-inp" data-fk="${f.k}"><option value="">Seleccioná...</option>`;
        (f.opts||[]).forEach(o=>{ h+=`<option value="${esc(o)}"${val===o?' selected':''}>${esc(o)}</option>`; });
        h+=`</select></div>`;
      } else if(f.type==='check'){
        h+=`<div class="${cls}"><label class="form-chk"><input type="checkbox" data-fk="${f.k}" data-ftype="check"${val?' checked':''}> ${esc(f.l)}${req}</label></div>`;
      } else if(f.type==='checks'){
        const arr=Array.isArray(val)?val:[];
        h+=`<div class="${cls}"><div class="form-lbl">${esc(f.l)}${req}</div><div class="form-checks">`;
        (f.opts||[]).forEach(o=>{ h+=`<label class="form-chk"><input type="checkbox" data-fk="${f.k}" data-ftype="checks" value="${esc(o)}"${arr.includes(o)?' checked':''}> ${esc(o)}</label>`; });
        h+=`</div></div>`;
      } else if(f.type==='yesno'){
        h+=`<div class="${cls}"><div class="form-lbl">${esc(f.l)}${req}</div><div class="form-radios"><label class="form-rad"><input type="radio" name="f_${f.k}" data-fk="${f.k}" data-ftype="yesno" value="no"${val==='no'?' checked':''}> No</label><label class="form-rad"><input type="radio" name="f_${f.k}" data-fk="${f.k}" data-ftype="yesno" value="si"${val==='si'?' checked':''}> Sí</label></div></div>`;
      } else {
        const show=f.reveal?(' data-reveal="'+f.reveal+'"'):'';
        h+=`<div class="${cls}"${show}${f.reveal&&data[f.reveal]!=='si'?' style="display:none"':''}><div class="form-lbl">${esc(f.l)}${req}</div><input class="form-inp" type="${f.type||'text'}" data-fk="${f.k}" value="${esc(val)}"></div>`;
      }
    });
    h+=`</div></div></div>`;
  });
  return h;
}

function collectFormData(container){
  const data={};
  container.querySelectorAll('[data-fk]').forEach(el=>{
    const k=el.getAttribute('data-fk'), ft=el.getAttribute('data-ftype')||'';
    if(ft==='check'){ data[k]=el.checked; }
    else if(ft==='checks'){
      if(!data[k]) data[k]=[];
      if(el.checked) data[k].push(el.value);
    }
    else if(ft==='yesno'){ if(el.checked) data[k]=el.value; }
    else { data[k]=el.value; }
  });
  return data;
}

async function renderFormTab(type){
  const schema=type==='acuerdo'?FORM_ACUERDO:FORM_ANAMNESIS;
  const title=type==='acuerdo'?'Acuerdo de Clases':'Anamnesis';
  const members=membersOf();
  const data=await loadForm(type);
  const filled=!!data._ts;
  let h='';
  /* Pestañas por integrante para dúos/grupos */
  if(members.length>1){
    h+=`<div class="seg" style="margin-bottom:8px">${members.map((mn,i)=>`<button data-act="formMember" data-m="${i}" data-ft="${type}" class="${i===member?'sel':''}">${esc(mn)}</button>`).join('')}</div>`;
  }
  const memberName=members.length>1?members[member]:DB.students[active].name;
  h+=`<div class="day-title">${esc(title)} · ${esc(memberName)}</div>`;
  if(filled) h+=`<div style="margin-bottom:12px"><span class="form-status done">✓ Completado · ${data._ts?new Date(data._ts).toLocaleDateString('es-AR'):''}</span></div>`;
  else h+=`<div style="margin-bottom:12px"><span class="form-status pending">⏳ Pendiente de completar</span></div>`;
  h+=`<div id="formContainer">`;
  h+=renderFormHTML(schema,data,type,!locked||true);
  h+=`</div>`;
  h+=`<button class="btn" data-act="saveForm" data-ftype="${type}" style="margin-top:12px;width:100%;padding:14px;font-size:15px;font-weight:600;">💾 Guardar ${esc(title)}</button>`;
  $('main').innerHTML=h;
}

async function handleSaveForm(type){
  const container=$('formContainer');
  if(!container) return;
  const data=collectFormData(container);
  await saveForm(type,data);
  await autoBackup('form:'+type);
  toast(type==='acuerdo'?'Acuerdo guardado ✓':'Anamnesis guardada ✓','ok');
  renderFormTab(type);
}

function renderFormView(type){
  /* Vista para profe (solo lectura) */
  const schema=type==='acuerdo'?FORM_ACUERDO:FORM_ANAMNESIS;
  const title=type==='acuerdo'?'Acuerdo de Clases':'Anamnesis';
  return new Promise(async(res)=>{
    const data=await loadForm(type);
    const filled=!!data._ts;
    let h=`<div style="margin:12px 0"><b>${esc(title)}</b> `;
    h+=filled?`<span class="form-status done">✓ ${new Date(data._ts).toLocaleDateString('es-AR')}</span>`:`<span class="form-status pending">⏳ Pendiente</span>`;
    h+=`</div>`;
    if(filled) h+=renderFormHTML(schema,data,type,false);
    res(h);
  });
}

let PENDING=safeParse((()=>{try{return localStorage.getItem('tafit:pending')}catch(e){return null}})()||'[]',[]);
function _savePending(){ try{ localStorage.setItem('tafit:pending',JSON.stringify(PENDING)); }catch(e){} }
function markPending(k){ if(PENDING.indexOf(k)<0){ PENDING.push(k); _savePending(); } syncBadge(); }
function clearPending(k){ const i=PENDING.indexOf(k); if(i>=0){ PENDING.splice(i,1); _savePending(); } syncBadge(); }
function syncBadge(){ if(!fsDB) return; if(PENDING.length){ $('clouddot').className='dot pend'; $('cloudlbl').textContent='⏳ Pendiente ('+PENDING.length+')'; } else updateSyncUI(true); }
function _pushRaw(k,v){ return new Promise(res=>{ let done=false; const t=setTimeout(()=>{ if(!done){ done=true; res(false); } },8000);
  fsDB.collection('kv').doc(k).set({v:v,ts:firebase.firestore.FieldValue.serverTimestamp(),dev:DEVICE_ID})
    .then(()=>{ if(!done){ done=true; clearTimeout(t); res(true); } })
    .catch(()=>{ if(!done){ done=true; clearTimeout(t); res(false); } });
}); }
async function cloudPush(k,v){ if(!fsDB||_fromRemote) return; const ok=await _pushRaw(k,v); if(ok) clearPending(k); else markPending(k); }
async function flushPending(){ if(!fsDB||!PENDING.length) return; const list=PENDING.slice();
  for(const k of list){ let v=null; try{ v=localStorage.getItem(k); }catch(e){} if(v==null){ clearPending(k); continue; }
    const ok=await _pushRaw(k,v); if(ok) clearPending(k); else break; }
}
window.addEventListener('online',()=>setTimeout(flushPending,800));
setInterval(()=>{ if(navigator.onLine) flushPending(); },30000);

async function pushAllLocal(){ if(!fsDB) return; let keys;

  else { keys=['tafit:students']; DB.order.forEach(id=>{ keys.push('tafit:data:'+id,'tafit:logs:'+id,'tafit:form:acuerdo:'+id,'tafit:form:anamnesis:'+id); const s=DB.students[id]; if(s&&s.members&&s.members.length>1){ for(let mi=0;mi<s.members.length;mi++){ keys.push('tafit:form:acuerdo:'+id+':'+mi,'tafit:form:anamnesis:'+id+':'+mi); } } }); }
  for(const k of keys){
    try{
      if(k==='tafit:students'){
        /* CAUSA RAÍZ (25/09/2026) de las pérdidas de rutinas: acá se empujaba el documento
           COMPLETO de alumnos a la nube "tal cual estaba en este celular" — un cloudPush
           crudo, sin el merge alumno por alumno de saveDB(). El problema es el momento en
           que se llama a pushAllLocal(): es la primera vez en todo el arranque de la app
           que Firebase YA está conectado. Pero el primer guardado de la sesión (el de
           runSeeds(), más arriba en init()) pasa ANTES de que Firebase esté listo — en ese
           momento fsDB todavía es null, así que saveDB() no tiene con qué comparar y guarda
           el DB local tal cual, sin protección. Si este dispositivo abrió la app con la
           caché local incompleta (versión de código vieja recién subida, celular que no
           sincronizaba hace rato, etc.) y runSeeds() recreó a algún alumno con su rutina de
           fábrica, esa recreación quedaba guardada localmente sin haberse comparado nunca
           contra el servidor — y este pushAllLocal() la subía igual, pisando en la nube el
           trabajo real de TODOS los alumnos, no solo el recreado. Ahora, en vez de empujar
           el valor crudo, volvemos a correr saveDB() acá — con fsDB ya conectado — para que

/* ===== Backup automático diario ===== */
/* Guarda una foto completa de TODOS los alumnos (rutinas + cargas + sesiones) en la nube,
   una vez por día, en una clave propia ('tafit:autobackup:AAAA-MM-DD') separada del
   documento en vivo ('tafit:students'). No participa del merge alumno por alumno ni de la
   sincronización entre celulares (ver shouldSync) — es solo una caja fuerte con los últimos
   7 días, para poder volver atrás en minutos si algo se corrompe, sin depender de que
   alguien se acuerde de tocar "Exportar backup" a mano. Usa el mismo formato que ese
   backup manual, así que un backup automático se puede reimportar con el mismo botón. */
async function dailyBackupIfNeeded(){
  if(!fsDB) return;
  try{
    const today=new Date().toISOString().slice(0,10);
    if(localStorage.getItem('tafit:lastAutoBackup')===today) return;
    const payload={ _app:'TaFit', _v:6, exported:new Date().toISOString(), auto:true, db:DB, data:{}, logs:{} };
    for(const id of DB.order){
      payload.data[id]=safeParse(await Store.get('tafit:data:'+id)||'{}',{});
      payload.logs[id]=safeParse(await Store.get('tafit:logs:'+id)||'[]',[]);
    }
    const ok=await _pushRaw('tafit:autobackup:'+today, JSON.stringify(payload));
    if(!ok) return; /* sin señal: probamos de nuevo la próxima vez que abra la app */
    localStorage.setItem('tafit:lastAutoBackup', today);
    const idx=safeParse(localStorage.getItem('tafit:autobackupIndex')||'[]',[]);
    if(idx.indexOf(today)<0) idx.push(today);
    idx.sort();
    while(idx.length>7){ const old=idx.shift(); try{ fsDB.collection('kv').doc('tafit:autobackup:'+old).delete(); }catch(e){} }
    localStorage.setItem('tafit:autobackupIndex', JSON.stringify(idx));
  }catch(e){ console.warn('AutoBackup:',e); }
}
/* Lista los backups automáticos de los últimos 10 días que realmente existen en la nube
   (no confía solo en el índice local, por si se está mirando desde otro celular). */
async function listAutoBackups(){
  if(!fsDB) return [];
  const out=[];
  const d=new Date();
  for(let i=0;i<10;i++){
    const dISO=d.toISOString().slice(0,10);
    try{
      const snap=await fsDB.collection('kv').doc('tafit:autobackup:'+dISO).get();
      if(snap.exists){ const v=safeParse(snap.data().v,null); if(v&&v.db) out.push({date:dISO, exported:v.exported, students:(v.db.order||[]).length}); }
    }catch(e){}
    d.setDate(d.getDate()-1);
  }
  return out;
}

   reemplaza rutinas/cargas/sesiones por lo que había ese día, y lo vuelve a guardar pasando
   por saveDB() (con el merge alumno por alumno) para que quede bien propagado. */
async function restoreAutoBackup(dateISO){
  if(!fsDB) return false;

    setSyncBaseline(); /* este restore ES un cambio real: que el merge lo trate como edición local */
    await saveDB(true);
    for(const id of DB.order){
      if(p.data&&p.data[id]) await Store.set('tafit:data:'+id,JSON.stringify(p.data[id]));
      if(p.logs&&p.logs[id]) await Store.set('tafit:logs:'+id,JSON.stringify(p.logs[id]));
    }
    if(!DB.students[active]) active=DB.order[0];

async function initFirebase(){
  if(typeof firebase==='undefined'||!firebase.initializeApp){ updateSyncUI(false); return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fsDB=firebase.firestore();
    /* caché offline de Firestore: la app abre y lee aunque no haya señal */
    try{ await fsDB.enablePersistence({synchronizeTabs:true}); }catch(e){}
    /* test de escritura (sin bloquear el arranque si no hay señal) */
    _pushRaw('tafit:ping','ok').then(ok=>{ if(ok){ updateSyncUI(true); flushPending(); } });
    /* pull: cloud → local (solo si local no tiene).
       Ojo: esto solo actualizaba localStorage, pero el objeto DB en memoria (con el que
       la app ya venía trabajando y renderizando desde el arranque) se quedaba con la
       versión vieja. Si más tarde pasaba CUALQUIER guardado (aunque fuera de otro alumno),
       se volvía a escribir esa versión vieja de DB encima de la nube, ya con fireSync
       activo. Por eso también hay que actualizar DB acá, con la misma regla de "solo si
       es igual o más nuevo" que usa reloadFromRemote(), antes de que fireSync se active. */
    try{ const snap=await kvQuery().get(); let _studentsMerged=false; snap.forEach(function(doc){ var k=doc.id,v=doc.data().v; if(shouldSync(k)&&v!=null){ try{ if(localStorage.getItem(k)!==v){ localStorage.setItem(k,v); if(k==='tafit:students'){ var p=safeParse(v,null); if(p&&p.order&&p.order.length&&(!DB._ts||!p._ts||p._ts>=DB._ts)){ DB=p; setSyncBaseline(); _studentsMerged=true; } } } }catch(e){} } }); if(_studentsMerged){ try{ if(urlLockPending) await tryResolveLockedLink(); else render(); }catch(e){} } else if(urlLockPending){ try{ await tryResolveLockedLink(); }catch(e){} } }catch(e){ console.warn('Pull:',e); }
    /* push: local → cloud */
    await pushAllLocal();
    /* backup automático diario — solo desde el celular de la profe (modo bloqueado de un
       alumno solo tiene sus propios datos cargados, no serviría como backup completo) */
    if(!locked) dailyBackupIfNeeded();
    /* FORZADO ÚNICO (25/09/2026): el merge alumno por alumno de arriba es correcto y seguro
       para el uso de todos los días, pero por diseño SIEMPRE prefiere al servidor cuando
       este dispositivo "no conocía" al alumno en su último punto de comparación real — y
       eso incluye a un alumno que ACABA de corregir el código (el parche de Joni/Sofi-Marti
       de más arriba), si el servidor todavía tiene la versión vieja porque ningún celular
       había logrado subir la corrección todavía. Resultado: se veía bien un instante y
       volvía a la versión mala en cuanto sincronizaba. Para cortar ese círculo, una sola
       vez — con clave propia, para que corra sin importar si esta app ya se abrió antes —
       empujamos la rutina corregida de Joni y Sofi/Marti DIRECTO al servidor, pisando solo
       esos dos alumnos en el documento de la nube (a todos los demás no se los toca). */
    if(!locked&&!DB._seed.forcePush20260925){
      try{
        const snap=await fsDB.collection('kv').doc('tafit:students').get({source:'server'});
        const remote=snap.exists?safeParse(snap.data().v,null):null;
        const base=(remote&&remote.students)?remote:{order:DB.order,students:DB.students,settings:DB.settings,_seed:DB._seed};
        const forced=Object.assign({},base);
        forced.students=Object.assign({},base.students);
        /* Los valores correctos salen SIEMPRE de estas dos funciones (fresco, calculado
           acá mismo) — nunca de DB.students, que para este momento ya pudo haber sido
           pisado por el merge de pushAllLocal() de arriba si el servidor todavía tenía la
           versión vieja. Se mezclan sobre lo que ya haya (del servidor si existe, si no de
           lo local) para no perder otros campos del alumno (theme, forms, etc.). */
        const baseJoni=(base.students&&base.students['joni-puebla'])||DB.students['joni-puebla']||{name:'Joni Puebla',theme:'m'};
        const jnFix=urgentFixJoni20260925();
        if(jnFix) forced.students['joni-puebla']=Object.assign({},baseJoni,jnFix);
        const baseSofiMarti=(base.students&&base.students['sofi-marti'])||DB.students['sofi-marti']||{name:'Sofi / Marti',theme:'f'};
        forced.students['sofi-marti']=Object.assign({},baseSofiMarti,urgentFixSofiMarti20260925());
        forced.order=Array.from(new Set((base.order||[]).concat(DB.order)));
        forced._seed=Object.assign({},base._seed,DB._seed,{forcePush20260925:true});
        forced._ts=Date.now();
        const pushedOk=await _pushRaw('tafit:students', JSON.stringify(forced));
        if(pushedOk){
          DB=forced;
          await Store.set('tafit:students', JSON.stringify(DB));
          setSyncBaseline();
          render();
        }
      }catch(e){ console.warn('ForcePush:',e); }
    }
    /* real-time listener */
    kvQuery().onSnapshot(function(snap){
      var changed=false;
      snap.docChanges().forEach(function(ch){
        var k=ch.doc.id,data=ch.doc.data();
        if(!shouldSync(k)) return;
        try{
          if(ch.type==='removed') localStorage.removeItem(k);
          else if(data&&data.v!=null){
            var local=localStorage.getItem(k);
            if(local!==data.v){ localStorage.setItem(k,data.v); changed=true; }
          }
        }catch(e){}
      });
      if(changed&&!_fromRemote){ _fromRemote=true; reloadFromRemote().then(function(){ _fromRemote=false; }); }
    });
    /* activar hooks */
    fireSync=function(k,v){ if(!_fromRemote&&shouldSync(k)) cloudPush(k,v); };
    fireDel=function(k){ if(!_fromRemote&&shouldSync(k)) cloudDel(k); };
    if(navigator.onLine){ updateSyncUI(true); syncBadge(); toast('Sync activado ✓','ok'); }
    else { $('clouddot').className='dot pend'; $('cloudlbl').textContent='Sin señal · guardando acá'; }
  }catch(e){ console.error('Firebase:',e); $('cloudlbl').textContent='Error: '+(e.message||e); updateSyncUI(false); }
}

  $('main').innerHTML='<div class="focus" style="text-align:center;padding:30px 16px">No encontramos esta rutina.<br><br>Puede ser que tu Profe todavía no haya terminado de configurarla, o que este enlace ya no sea válido. Escribile para confirmarlo.</div>';
}
/* Reintenta ubicar al alumno del link bloqueado apenas llegan datos reales de la nube
   (pull inicial de Firestore o el listener en tiempo real). Si lo encuentra, recién ahí
   entra al modo alumno bloqueado; si de verdad no existe, avisa — nunca cae al modo Profe. */
async function tryResolveLockedLink(){
  if(!urlLockPending) return;
  let found=DB.order.find(id=>id===urlLockA);
  if(!found) found=DB.order.find(id=>DB.students[id].name.toLowerCase().includes(urlLockA.toLowerCase()));
  if(found){ active=found; locked=true; trainer=false; urlLockPending=false; await loadStudent(); render(); }
}
/* Pantalla de bloqueo (pausada a mano, o plan vencido) para CUALQUIER pestaña que vea
   una alumna — no solo la pestaña App. Antes esto vivía solo dentro de renderApp(), así
   que una alumna pausada/suspendida podía seguir viendo su rutina completa entrando por
   Transcripta, Fotos o Informe con solo tocar esas pestañas. Ahora se chequea acá, antes
   de despachar a CUALQUIER renderer de pestaña, así que queda bloqueada en todas. */
function renderBlockedIfNeeded(){
  const st=DB.students[active]; if(!st) return false;
  const planDue=planDueInfo(st.planPaid);
  const planExpired=!!(planDue&&planDue.status==='bad');
  if(!(st.paused||planExpired)) return false;
  const icon=planExpired&&!st.paused?'🔒':'⏸';
  const title=planExpired&&!st.paused?'Tu plan venció':'Tu rutina está pausada por el momento';
  const detail=planExpired&&!st.paused?`Venció hace ${Math.abs(planDue.daysLeft)} día${Math.abs(planDue.daysLeft)===1?'':'s'}. Contactá a tu profe para renovarlo y seguir entrenando.`:'Contactá a tu profe para más información.';
  const m=$('main'); m.innerHTML=`<div style="text-align:center;padding:40px 20px"><div style="font-size:48px;margin-bottom:16px">${icon}</div><div style="font-size:18px;font-weight:700;color:var(--navy);margin-bottom:12px">${esc(title)}</div><div style="font-size:14px;color:var(--mute);line-height:1.6">${esc(detail)}</div>${renderWhatsAppBtn()}</div>`;
  return true;
}
function render(){
  if(urlLockPending){ renderLinkPending(); return; }
  if(urlLockFailed){ renderLinkFailed(); return; }
  if(!trainer){
    if(tab==='edit'||tab==='rep'||tab==='asis'||tab==='pagos') tab='app';
    else if(tab==='resumen'&&!informeEnabledForStudent()) tab='app';
  }
  renderChrome();
  if(!trainer && renderBlockedIfNeeded()) return;
  if(tab==='app') renderApp();
  else if(tab==='trans') renderTrans();
  else if(tab==='fotos') renderPhotos();
  else if(tab==='asis') renderAsistencia();
  else if(tab==='pagos') renderPagos();
  else if(tab==='edit') renderEdit();
  else if(tab==='resumen') renderResumen();
  else if(tab==='acuerdo') renderFormTab('acuerdo');
  else if(tab==='anamnesis') renderFormTab('anamnesis');
  else renderReport();
}
function setTab(t){
  if(!trainer){
    if(t==='edit'||t==='rep'||t==='asis'||t==='pagos') return;
    if(t==='resumen'&&!informeEnabledForStudent()) return;
  }
  tab=t; render();
}

async function toggleTrainer(){
  if(locked) return;
  if(trainer){ let pin=DB.settings.pin||''; if(!pin){ const np=((await uiPrompt("Creá un PIN de profe para bloquear la edición:"))||'').trim(); if(!np) return; DB.settings.pin=np; await saveDB(); } trainer=false; if(tab==='edit'||tab==='rep') tab='app'; render(); toast("Bloqueado · modo alumno",'ok'); }
  else { const pin=DB.settings.pin||''; if(!pin){ const np=((await uiPrompt("Creá un PIN de profe:"))||'').trim(); if(!np) return; DB.settings.pin=np; await saveDB(); trainer=true; render(); return; } const p=((await uiPrompt("PIN de profe:","",true))||'').trim(); if(p===pin){ trainer=true; render(); } else toast("PIN incorrecto",'warn'); }
}

async function switchStudent(id){ if(locked||!DB.students[id]) return; active=id; await Store.set('tafit:active',id); await loadStudent(); render(); }
async function addStudent(){
  const name=((await uiPrompt("Nombre del nuevo alumno/a (para dúo, poné los dos: \"Nati, Caro\"):"))||"").trim(); if(!name) return;
  const parts=name.split(',').map(s=>s.trim()).filter(Boolean);
  let id=slug(name), n=2; while(DB.students[id]) id=slug(name)+'-'+(n++);
  const st={ name, routine:cp(tmplOmar()), theme:guessFem(parts[0]||name)?'f':'m', weeks:cp(DEFAULT_WEEKS) };
  if(parts.length>1) st.members=parts;
  DB.students[id]=st;
  DB.order.push(id); await saveDB(); active=id; await Store.set('tafit:active',id); await loadStudent(); render();
  toast("Agregado: "+name,'ok');
}
async function renameStudent(id){ const name=((await uiPrompt("Nuevo nombre:",DB.students[id].name))||"").trim(); if(!name) return; DB.students[id].name=name; await saveDB(); render(); }
async function deleteStudent(id){ if(DB.order.length<=1){ toast("Tiene que quedar al menos un alumno",'warn'); return; } if(!await uiConfirm("¿Eliminar a "+DB.students[id].name+"? Se borra su rutina, datos y fotos.")) return;
  delete DB.students[id]; DB.order=DB.order.filter(x=>x!==id);
  await Store.del('tafit:data:'+id); await Store.del('tafit:logs:'+id);
  const pidx=safeParse(await Store.get('tafit:photoidx:'+id)||'[]',[]); for(const p of pidx) await Store.del('tafit:photo:'+id+':'+p.pid); await Store.del('tafit:photoidx:'+id);
  await saveDB(); if(active===id){ active=DB.order[0]; await Store.set('tafit:active',active); await loadStudent(); } render();
}
async function setTheme(v){ DB.students[active].theme=v; await saveDB(); render(); }
async function toggleFormEnable(type){ const st=DB.students[active]; if(!st.forms) st.forms={}; st.forms[type]=!st.forms[type]; await saveDB(); renderEdit(); }

async function savePlanDate(){ const el=$('planPaidInput'); const v=el?el.value:''; DB.students[active].planPaid=v; await saveDB(); toast(v?'Fecha de pago guardada ✓':'Fecha de pago borrada ✓','ok'); renderEdit(); }
