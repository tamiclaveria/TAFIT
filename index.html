<style>
  :root{
    /* Identidad de marca TaFiT: negro cálido + beige, un único look premium para toda la
       app (ver nota más abajo junto a #app.dark). --navy y --steel quedan como los dos
       tonos de texto/superficie "neutros"; --accent es el dorado/beige de marca y SIEMPRE
       va con texto oscuro encima (nunca blanco), porque es un color claro. */
    --navy:#241F18; --steel:#0a0908; --accent:#E3C3A5; --accentDk:#9B5F26;
    --niebla:#7A6850; --light:#FAF7F2; --white:#FFFFFF;
    --ink:#241F18; --mute:#8A7866; --line:#E8DFD0;
    --card:#FFFFFF; --ok:#4CAF7E; --okbg:#E8F5EC; --warn:#B3261E; --tint2:#F2ECE0;
    --repBrand:#E3C3A5; --repBrandDk:#C9A074; --repTint:#FFFFFF; --repTint2:#F2ECE0; --repInk:#241F18; --repTintDk:#0a0908;
  }
  /* Un solo look para toda la app — ya no hay un tema de acento aparte para alumnas
     (antes era rosa, ahora todos comparten el mismo negro + dorado de la marca). */
  #app.theme-f{ --accent:#E3C3A5; --accentDk:#9B5F26;
    --repBrand:#E3C3A5; --repBrandDk:#C9A074; --repTint:#FFFFFF; --repTint2:#F2ECE0; --repInk:#241F18; --repTintDk:#0a0908; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0908;color:var(--ink);min-height:100vh}
  a{color:var(--accentDk)}
  #app{max-width:600px;margin:0 auto;min-height:100vh;background:var(--light);display:flex;flex-direction:column}
  header{background:#0a0908;color:#fff;padding:12px 16px 12px}
  .topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .wm{font-weight:800;font-size:22px;letter-spacing:3px;display:flex;align-items:center}
  .wm img{height:76px;width:76px;border-radius:50%;display:block;object-fit:cover;border:2px solid var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.45)}
  .wm b{color:var(--accent)}
  .topright{display:flex;gap:8px;align-items:center}
  .lockbtn{background:var(--steel);border:none;color:#fff;border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer}
  .bellbtn{position:relative;font-size:15px;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 9px;color:var(--mute)}
  .bell-badge{position:absolute;top:-5px;right:-5px;background:#e74c3c;color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 3px}
  .bell-badge.show{display:flex}
  .notif-ov{position:fixed;inset:0;background:rgba(13,27,42,.55);display:none;align-items:flex-start;justify-content:center;z-index:80;padding:14px}
  .notif-ov.show{display:flex}
  .notif-box{background:var(--card);border-radius:14px;max-width:420px;width:100%;max-height:80vh;overflow:auto;padding:16px}
  #app.dark .notif-box{background:#FFFFFF;color:#241F18}
  .notif-box h3{font-size:15px;color:var(--navy);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  #app.dark .notif-box h3{color:#241F18}
  .notif-row{padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .notif-row.notif-click{cursor:pointer;margin:0 -8px;padding:9px 8px;border-radius:8px}
  .notif-row.notif-click:hover{background:var(--light)}
  #app.dark .notif-row{border-color:#E8DFD0}
  #app.dark .notif-row.notif-click:hover{background:#FFFFFF}
  .notif-row b{color:var(--navy);display:block;font-size:13px}
  #app.dark .notif-row b{color:#241F18}
  .notif-row span{color:var(--mute)}
  .notif-close{width:100%;margin-top:12px;padding:10px;border:none;border-radius:9px;background:var(--steel);color:#fff;font-weight:700;cursor:pointer}
  .cloud{font-size:11px;letter-spacing:.3px;color:var(--niebla);display:flex;align-items:center;gap:5px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--niebla)}
  .dot.on{background:var(--ok)}
  .dot.pend{background:#E6A23C;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .pickrow{display:flex;gap:8px;margin-top:12px}
  select.alumno{flex:1;padding:11px 12px;border-radius:11px;border:none;font-size:15px;font-weight:700;color:var(--navy);background:var(--card)}
  .namestatic{flex:1;padding:11px 12px;border-radius:11px;background:var(--card);color:var(--navy);font-size:15px;font-weight:700}
  .iconbtn{background:var(--steel);border:none;color:#fff;border-radius:11px;padding:0 14px;font-size:18px;font-weight:700;cursor:pointer}
  .iconbtn:hover{background:var(--accent);color:#17120E}
  nav{display:flex;background:var(--steel);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 13px 9px;border:none;background:transparent;color:#cfe0ea;font-weight:700;letter-spacing:.2px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  nav .navico{font-size:16px;line-height:1;position:relative;display:inline-block}
  nav .navlbl{font-size:10.5px;line-height:1}
  nav button.active{color:#241F18;border-bottom-color:var(--accent);background:rgba(255,255,255,.06)}
  .navdot{position:absolute;top:-3px;right:-6px;width:8px;height:8px;border-radius:50%;background:#e74c3c;border:1px solid var(--steel)}
  main{flex:1;padding:16px 14px 40px}
  .focus{font-size:13px;color:var(--mute);margin-bottom:12px;text-align:center}
  .focus b{color:var(--steel)}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--accentDk);margin-bottom:8px}

  .seg{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .seg button{flex:1;min-width:84px;padding:10px 4px;border:2px solid var(--line);background:var(--card);border-radius:11px;font-size:13px;font-weight:700;color:var(--mute);cursor:pointer}
  .seg button.sel{border-color:var(--accent);color:var(--navy);background:var(--light)}
  .daytag{font-size:11px;margin-left:3px;vertical-align:middle}
  .mseg{margin-top:-4px}
  .mseg button{border-radius:999px;padding:11px 4px}
  .mseg button.sel{background:var(--accent);border-color:var(--accent);color:#17120E}
  .weeks{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .weeks button.wlock{opacity:.45;filter:grayscale(.5)}
  .weeks button{flex:1;min-width:54px;padding:9px 2px;border:2px solid var(--line);background:var(--card);border-radius:10px;font-size:12px;font-weight:700;color:var(--mute);cursor:pointer;line-height:1.2}
  .weeks button small{display:block;font-weight:600;font-size:9px;color:var(--niebla)}
  .weeks button.sel{border-color:var(--steel);color:#fff;background:var(--steel)}
  .weeks button.sel small{color:#241F18;opacity:.75}
  .weekdesc{font-size:12px;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:16px}
  .week-nudge{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--accentDk);background:var(--tint2);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;margin:-8px 0 16px}
  .week-nudge button{border:none;border-radius:8px;padding:6px 12px;font-size:11.5px;font-weight:700;cursor:pointer;background:var(--accentDk);color:#fff;margin-left:auto}
  .unlock-warn{font-size:12px;color:#875D1C;background:#F6F0E4;border:1px solid #e3cc9e;border-radius:10px;padding:10px 12px;margin:10px 0;line-height:1.45}

  .medbanner{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 13px;margin-bottom:14px;font-size:12.5px;color:var(--steel);font-weight:700}
  .rules .rule{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--light)}
  .rules .rule:last-child{border-bottom:none}
  .rules .rule .ico{font-size:16px;flex:none;line-height:1.4}
  .rules .rule b{font-size:13px;color:var(--navy)}
  .rules .rule p{margin:1px 0 0;font-size:12px;color:var(--mute)}
  .legcard .opts{display:flex;gap:8px;margin-bottom:8px}
  .legcard .opts button{flex:1;padding:10px 0;border:2px solid var(--line);border-radius:11px;background:var(--card);font-weight:700;font-size:13px;color:var(--mute);cursor:pointer}
  .legcard .opts button.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .legcard .opts button.warn.on{background:#cf8a23;border-color:#cf8a23;color:#17120E}
  .alarmas{display:flex;flex-wrap:wrap;gap:7px}
  .alarmas button{padding:7px 11px;border:2px solid var(--line);border-radius:20px;background:var(--card);font-size:12px;font-weight:600;color:var(--mute);cursor:pointer}
  .alarmas button.on{background:#F7E3E3;border-color:var(--warn);color:var(--warn)}
  .legwarn{font-size:12px;color:var(--warn);background:#F7E3E3;border-radius:9px;padding:9px 11px;margin-top:9px;line-height:1.4;font-weight:600}
  .legnote{font-size:11.5px;color:var(--mute);margin-top:8px;line-height:1.4}

  .progwrap{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:16px;border:1px solid var(--line)}
  .progbar{height:8px;background:#F2ECE0;border-radius:6px;overflow:hidden;margin-bottom:7px}
  .progbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
  .proglbl{font-size:12px;color:var(--mute);font-weight:600}

  .ex{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--line);box-shadow:0 2px 8px rgba(13,27,42,.04)}
  .ex h3{font-size:15px;color:var(--navy);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ex h3 .num,.ex-hdr .num{background:var(--steel);color:#fff;width:22px;height:22px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
  .ex .meta{font-size:12px;color:var(--mute);margin:4px 0 2px 30px}
  .ex .alt{font-size:12px;color:var(--niebla);margin:0 0 0 30px}
  .ex .alt b{color:var(--mute);font-weight:700}
  .alt-tap{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
  .chips{margin:9px 0 0 30px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .rest{font-size:12px;font-weight:700;color:var(--steel);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
  .rest:hover{border-color:var(--accent)}
  .vid{font-size:12px;font-weight:700;text-decoration:none;color:var(--accentDk);background:none;border:none;padding:0;font-family:inherit;cursor:pointer}
  /* Modal de video: se abre adentro de la app en vez de salir a YouTube, cuando el ejercicio tiene un video puntual cargado */
  .vid-modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px}
  .vid-modal-ov.show{display:flex}
  .vid-modal{background:#000;border-radius:14px;overflow:hidden;width:100%;max-width:520px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .vid-modal-top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#161616;color:#fff}
  .vid-modal-top span{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vid-modal-top button{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:4px 8px;flex:none}
  .vid-modal-body{position:relative;width:100%;aspect-ratio:16/9}
  .vid-modal-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .tip{font-size:12px;color:var(--steel);background:var(--light);border-radius:9px;padding:9px 11px;margin:9px 0 0 30px;line-height:1.45}
  /* ---- Técnica en acordeón: cerrado por defecto para no alargar la tarjeta ---- */
  .tipacc{border:1.5px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card);margin:9px 0 0 30px}
  .tipacc summary{list-style:none;display:flex;align-items:center;gap:8px;padding:8px 11px;cursor:pointer;font-size:12px;font-weight:700;color:var(--steel);-webkit-user-select:none;user-select:none}
  .tc-gen{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--niebla);background:var(--light);border-radius:6px;padding:1px 6px}
  #app.dark .tc-gen{background:#FFFFFF;color:#8A7866}
  .tipacc summary::-webkit-details-marker{display:none}
  .tipacc .chev{margin-left:auto;font-size:10px;color:var(--niebla);transition:.15s}
  .tipacc[open] .chev{transform:rotate(180deg)}
  .tipacc[open] summary{border-bottom:1px solid var(--line)}
  .tipacc .tc-body{background:var(--card);padding:8px 11px 10px}
  .tipacc .tc-pt{display:flex;gap:8px;align-items:flex-start;padding:5px 0}
  .tipacc .tc-dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:5px;flex-shrink:0}
  .tipacc .tc-pt p{font-size:12px;line-height:1.5;color:var(--ink)}
  #app.dark .tipacc{background:#FFFFFF;border-color:#E8DFD0}
  #app.dark .tipacc summary{color:#E3C3A5}
  #app.dark .tipacc .tc-body{background:#FFFFFF}
  #app.dark .tipacc .tc-pt p{color:#76582D}

  /* ---- Bloque / circuito: cartel de sección, no un ejercicio con peso y series ---- */
  .block-banner-wrap{margin-bottom:12px}
  .block-banner{background:linear-gradient(135deg,#F1EDE9,#F2EEE9);color:#241F18;border-radius:14px;padding:16px 18px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .block-banner .bb-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .block-banner .bb-ico{font-size:20px;flex:none}
  .block-banner .bb-title{font-size:15px;font-weight:800;letter-spacing:.3px}
  .block-banner .bb-desc{font-size:12.5px;opacity:.92;line-height:1.5;margin:2px 0 12px}
  .block-banner .bb-btn{background:var(--steel);border:1.5px solid var(--steel);color:#fff;font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
  .block-banner .bb-btn:hover{background:var(--accent);border-color:var(--accent);color:#17120E}
  .lastw{font-size:11.5px;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:9px;padding:8px 11px;margin:9px 0 0 0;line-height:1.5}
  .lastw b{color:var(--steel)}
  .lastw-fill{display:block;margin-top:7px;border:none;border-radius:8px;padding:7px 12px;font-size:11.5px;font-weight:700;cursor:pointer;background:var(--accent);color:#17120E}
  .member-h{font-size:13px;font-weight:800;color:var(--steel);margin:14px 0 2px;display:flex;align-items:center;gap:7px;padding-top:11px;border-top:1px dashed var(--line)}
  .member-h::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
  .member-h .mo{font-size:11px;font-weight:600;color:var(--niebla)}
  table.sets{width:100%;border-collapse:collapse;margin-top:8px}
  table.sets th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--niebla);font-weight:700;padding:4px;text-align:center}
  table.sets th.s{width:34px;text-align:left}
  table.sets td{padding:3px;text-align:center}
  table.sets td.s{font-size:12px;color:var(--mute);font-weight:700;text-align:left;padding-left:2px}
  .cell{width:100%;padding:9px 4px;border:2px solid var(--line);border-radius:9px;font-size:15px;text-align:center;outline:none}
  .cell:focus{border-color:var(--accent)}
  select.cell{padding:9px 2px;-webkit-appearance:none;appearance:none;background:var(--card)}
  .chk{width:30px;height:30px;border:2px solid var(--line);border-radius:9px;background:var(--card);cursor:pointer;font-size:15px;color:transparent;line-height:1}
  .chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
  /* ==== Informe v2 (07/10/2026) ==== */
  .inf2{text-align:left;--i-ink:#241F18;--i-mute:#8A7866;--i-line:#E8DFD0;--i-br:#9B5F26;--i-acc:#E3C3A5;--i-tint:#F2ECE0;--i-bg:#FAF7F2;--i-dark:#0E0B09;color:var(--i-ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:760px;margin:0 auto 14px}
  .inf2 *{box-sizing:border-box}
  .inf2 .page{background:var(--i-bg);border-radius:16px;padding:14px 14px 10px;margin-bottom:12px;position:relative}
  .inf2 h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:20px;margin:0 0 10px;color:var(--i-ink)}
  .inf2 h2 small{font-family:system-ui,sans-serif;font-size:11px;color:var(--i-mute);margin-left:6px}
  .inf2 .sec{margin-top:22px}
  .inf2 .sec.first{margin-top:6px}
  .inf2 .cover{background:var(--i-dark);color:#fff;border-radius:18px;padding:22px 16px 20px;text-align:center;position:relative;overflow:hidden}
  .inf2 .cover:after{content:"";position:absolute;left:50%;top:-80px;width:340px;height:340px;margin-left:-170px;border-radius:50%;background:radial-gradient(circle,rgba(227,195,165,.22),rgba(227,195,165,0) 70%);pointer-events:none}
  .inf2 .cover img{width:150px;height:150px;border-radius:50%;display:block;margin:0 auto 14px;box-shadow:0 0 0 4px rgba(227,195,165,.35),0 10px 30px rgba(0,0,0,.5);position:relative;z-index:1}
  .inf2 .eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--i-acc);font-weight:700;position:relative;z-index:1}
  .inf2 .cover h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:38px;line-height:1.05;margin:8px 0 6px;color:#fff;position:relative;z-index:1}
  .inf2 .cover .sub{font-size:13px;opacity:.85;position:relative;z-index:1}
  .inf2 .cover .meta{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;margin-top:16px;font-size:12px;position:relative;z-index:1}
  .inf2 .cover .meta span{display:block;color:var(--i-acc);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px}
  .inf2 .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .inf2 .kpi{background:#fff;border:1px solid var(--i-line);border-radius:14px;padding:12px 10px}

  .edit-bottom{display:flex;gap:8px;margin-top:6px}
  .edit-bottom button{flex:1;padding:13px;border:none;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer}
  .save{background:var(--ok);color:#fff}
  .reset{background:var(--card);border:2px solid var(--line)!important;color:var(--mute)}
  .note{font-size:11px;color:var(--niebla);text-align:center;margin-top:12px;line-height:1.5}
  .week-row{display:grid;grid-template-columns:64px 1fr;gap:8px;margin-bottom:8px;align-items:end}
  .week-row .wfull{grid-column:1/3}
  .week-row .delw{grid-column:1/3;padding:7px;border:none;border-radius:8px;background:#F6E6E4;color:var(--warn);font-size:11px;font-weight:700;cursor:pointer}
  .hrule{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
  .stu-row{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--light)}
  .stu-row:last-child{border-bottom:none}
  .stu-row .sn{flex:1;font-size:14px;font-weight:600;color:var(--navy)}
  .stu-row .tg{font-size:11px;font-weight:700;color:var(--niebla)}
  .stu-row button{padding:7px 10px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
  .stu-row .ren{background:var(--light);color:var(--steel)}
  .stu-row .del{background:#F6E6E4;color:var(--warn)}
  .stu-row .lnk{background:var(--okbg,#E5F6EC);color:var(--ok)}

  /* Biblioteca de ejercicios */
  .lib-row{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--light)}
  .lib-row:last-child{border-bottom:none}
  .lib-row .ln{flex:1;min-width:0}
  .lib-row .ln .nm{font-size:14px;font-weight:600;color:var(--navy)}
  .lib-row .ln .gp{font-size:11px;font-weight:700;color:var(--accentDk);margin-right:6px}
  .lib-row .ln .tp{font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lib-row button{padding:7px 10px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0}
  .lib-row .edb{background:var(--light);color:var(--steel)}
  .lib-row .delb{background:#F6E6E4;color:var(--warn)}
  .lib-edit-row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0}
  .lib-groups{display:flex;flex-wrap:wrap;gap:6px}
  .lib-gchk{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--steel);background:var(--light);border:1px solid var(--line);border-radius:20px;padding:6px 11px;cursor:pointer;user-select:none}
  .lib-gchk input{margin:0;accent-color:var(--accent)}
  .lib-gchk.on{background:var(--accent);color:#17120E;border-color:var(--accent)}
  .lib-gchk:has(input:checked){background:var(--accent);color:#17120E;border-color:var(--accent)}
  .libpick{margin-bottom:8px;width:100%}
  .libsave-btn{background:var(--light);color:var(--steel);border:none;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer;margin-top:6px}

  /* Asistencia */
  .asis-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px}
  .asis-nav button{border:none;background:var(--light);color:var(--steel);border-radius:8px;width:32px;height:32px;font-size:14px;font-weight:700;cursor:pointer;flex:none}
  .asis-nav b{font-size:13px;color:var(--navy);text-align:center;line-height:1.3}
  .asis-summary{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-bottom:14px;font-size:12px;font-weight:700}
  .asis-summary .ok{color:var(--ok)}
  .asis-summary .bad{color:var(--warn)}
  .asis-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .asis-dow{text-align:center;font-size:10px;font-weight:700;color:var(--niebla);padding-bottom:4px}
  .asis-cell{aspect-ratio:1;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
  .asis-cell.today{border-color:var(--accent);border-width:2px}
  .asis-cell.p{background:var(--okbg);color:#9B5F26;border-color:var(--ok)}
  .asis-cell.a{background:#F6E6E4;color:#e89892;border-color:var(--warn)}
  .asis-cell.sched{border-color:var(--accent);border-style:dashed;color:var(--steel)}
  .asis-cell.nochq{cursor:default}
  .asis-cell small{font-size:9px}
  .asis-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .asis-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
  .asis-row.p{background:var(--okbg);border-color:var(--ok)}
  .asis-row.a{background:#F6E6E4;border-color:var(--warn)}
  .asis-rn{font-weight:700;font-size:14px;color:var(--ink)}
  .asis-rchip{font-size:12px;font-weight:700;color:var(--mute)}
  .asis-row.p .asis-rchip{color:#9B5F26}
  .asis-row.a .asis-rchip{color:#e89892}
  .asis-drill{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:6px}
  .asis-drill label{display:block;font-size:11px;font-weight:700;color:var(--mute);margin-bottom:6px}
  .asis-drill select{padding:8px;border-radius:8px;border:1px solid var(--line)}
  .asis-drill button{border:none;background:var(--accent);color:#17120E;border-radius:8px;padding:0 14px;font-weight:700;font-size:12px;cursor:pointer}

  .rep-card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line)}
  .rep-card .rh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .rep-card .rh .rn{font-size:16px;font-weight:800;color:var(--navy)}
  .rep-card .rh .rw{font-size:11px;font-weight:700;color:var(--steel)}
  .wstreak-chip{display:inline-block;background:linear-gradient(135deg,#f39c12,#e74c3c);color:#fff;font-size:10.5px;font-weight:800;border-radius:7px;padding:2px 7px;vertical-align:middle;margin-left:2px}
  .rep-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
  .rep-stats div{background:var(--card);border-radius:9px;padding:8px 4px;text-align:center}
  .rep-stats div b{display:block;font-size:18px;color:var(--navy)}
  .rep-stats div span{font-size:10px;color:var(--niebla);text-transform:uppercase;letter-spacing:.4px}
  .rep-last{font-size:12px;color:var(--mute)}
  .rep-flag{font-size:12px;color:var(--warn);font-weight:700;margin-top:6px;background:#F7E3E3;border-radius:8px;padding:8px 10px}
  .rep-adh{height:7px;background:#F2ECE0;border-radius:5px;overflow:hidden;margin-top:8px}
  .rep-adh i{display:block;height:100%;background:var(--ok)}

  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .pcard img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover;background:var(--card);cursor:pointer}
  .pcard .pm{padding:8px 10px;font-size:12px;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
  .pcard .pm button{background:none;border:none;color:var(--warn);font-size:11px;font-weight:700;cursor:pointer}
  .pcard-imgwrap{position:relative}
  .pcard-sel{outline:2.5px solid var(--accent)}
  .pchk{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.85);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;z-index:2}
  .pchk.on{background:var(--accent);border-color:var(--accent);color:#17120E}
  .cmp-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:12.5px;color:var(--navy);font-weight:700}
  .cmp-bar-btns{display:flex;gap:8px}
  .cmp-bar-btns button{border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--line)}
  .cmp-go{background:var(--accent);color:#17120E;border-color:var(--accent)}
  .cmp-go:disabled{opacity:.4;cursor:not-allowed}
  .cmp-cancel{background:var(--card);color:var(--mute)}
  .cmp-ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px}
  .cmp-ov.show{display:flex}
  .cmp-modal{background:#111;border-radius:14px;overflow:hidden;width:100%;max-width:560px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .cmp-modal-top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#161616;color:#fff;font-size:13px;font-weight:700}
  .cmp-modal-top button{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:4px 8px}
  .cmp-cols{display:flex}
  .cmp-col{flex:1;min-width:0}
  .cmp-col img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover}
  .cmp-cap{text-align:center;color:#fff;font-size:12px;padding:8px 4px;background:#000}
  @media (max-width:420px){ .cmp-cols{flex-direction:column} .cmp-col img{aspect-ratio:4/3} }

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#0a0908;color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{background:#9B5F26}
  .toast.warn{background:var(--warn)}
  #rest{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#0a0908;color:#fff;border-radius:14px;padding:12px 16px;display:none;align-items:center;gap:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  #rest.show{display:flex}
  #rest b{font-size:22px;font-variant-numeric:tabular-nums;min-width:54px;text-align:center}
  #rest button{background:var(--accent);border:none;color:#17120E;border-radius:9px;padding:7px 12px;font-weight:700;cursor:pointer}
  #mtitle{white-space:pre-line}
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:70;padding:18px}
  #lb.show{display:flex}
  #lb img{max-width:100%;max-height:100%;border-radius:10px}
  #modal{position:fixed;inset:0;background:rgba(13,27,42,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:22px}
  #modal.show{display:flex}
  #modal .mbox{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:360px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
  #modal .mtitle{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:13px;line-height:1.4}
  #modal .minput{width:100%;padding:11px;border:2px solid var(--line);border-radius:10px;font-size:16px;outline:none;margin-bottom:14px}
  #modal .minput:focus{border-color:var(--accent)}
  #modal .minput.hide{display:none}
  #modal .mbtns{display:flex;gap:8px}
  #modal .mbtns button{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
  #modal #mcancel{background:var(--card);color:var(--mute);border:2px solid var(--line)}
  #modal #mok{background:var(--accent);color:#17120E}
  /* Forms */
  .form-sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
  .form-sec-hdr{padding:12px 16px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;align-items:center}
  .form-sec-hdr.acuerdo{background:var(--tint2);color:var(--accentDk)}
  .form-sec-hdr.anamnesis{background:var(--tint2);color:var(--accentDk)}
  
  .theme-f .form-sec-hdr.anamnesis{background:#E8F2EC;color:#247F49}
  .form-body{padding:16px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:540px){.form-grid{grid-template-columns:1fr}}
  .form-field{display:flex;flex-direction:column;gap:4px}
  .form-field.full{grid-column:1/-1}
  .form-lbl{font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
  .form-lbl .req{color:#e39797}
  .form-inp{background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;color:var(--navy);width:100%;outline:none;font-family:inherit}
  .form-inp:focus{border-color:var(--accent)}
  textarea.form-inp{resize:vertical;min-height:60px}
  select.form-inp{appearance:auto}
  .form-checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .form-chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--navy);cursor:pointer;padding:7px 12px;border-radius:8px;border:1.5px solid var(--line)}
  .form-chk input{accent-color:var(--accent);width:15px;height:15px}
  .form-radios{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .form-rad{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--navy);cursor:pointer;padding:7px 12px;border-radius:8px;border:1.5px solid var(--line)}
  .form-rad input{accent-color:var(--accent)}
  .form-reveal{margin-top:8px;padding:12px;background:var(--bg);border-radius:10px;border:1.5px solid var(--line);display:none}
  .form-reveal.show{display:block}
  .form-clause{font-size:13px;color:var(--navy);line-height:1.7;margin-bottom:12px}
  .form-clause b{color:var(--accentDk)}
  .form-status{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600}
  .form-status.done{background:#E6F4EA;color:#247F49}
  .form-status.pending{background:#F6EFE4;color:#875B1C}
  .form-view-val{font-size:14px;color:var(--navy);padding:6px 0;border-bottom:1px solid var(--line)}
  /* Accordion */
  .ex-hdr{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent;border-bottom:1px solid var(--line)}
  .ex-hdr-info{flex:1;min-width:0}
  .ex-hdr-name{font-weight:700;font-size:14px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ex-hdr-meta{font-size:11.5px;color:var(--mute);margin-top:2px}
  .ex-hdr-prog{display:flex;gap:3px;margin-top:4px}
  .ex-hdr-prog i{width:18px;height:4px;border-radius:2px;background:#F2ECE0}
  .ex-hdr-prog i.done{background:var(--ok)}
  .ex-thumb{flex:none;width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--steel);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
  .ex-thumb svg{width:26px;height:26px}
  .ex-thumb img{width:100%;height:100%;object-fit:cover}
  /* miniatura real del ejercicio (frame del video cargado), no del grupo muscular */
  .ex-vidthumb{flex:none;width:40px;height:40px;border-radius:10px;object-fit:cover;border:1px solid var(--line);cursor:pointer;background:var(--card)}
  #lb .lb-icon{background:var(--card);border-radius:16px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:220px;margin:0 auto}
  #lb .lb-icon svg{width:120px;height:120px;color:var(--steel)}
  #lb .lb-icon-lbl{font-size:13px;font-weight:700;color:var(--navy);text-align:center}
  .ex-chev{font-size:18px;color:var(--mute);transition:transform .2s;flex:0 0 auto}
  .ex-chev.open{transform:rotate(180deg)}
  .ex-body{display:none;padding:12px 16px 16px}
  .ex-body.open{display:block}
  .ex.open-ex{border-left:3px solid var(--accent)}
  .session-saved{text-align:center;padding:16px;background:var(--ok);color:#fff;border-radius:12px;margin-top:12px;font-weight:600;font-size:14px}
  .max-w{font-size:10px;color:var(--ok);font-weight:700}
  .inact{font-size:11px;color:#e39797;font-weight:700;margin-top:4px}
  .wa-btn{display:none}
  .wa-float{position:fixed;bottom:18px;right:18px;width:50px;height:50px;border-radius:50%;background:var(--accentDk);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:50;text-decoration:none;font-size:26px}
  .wa-ex{font-size:11px;color:var(--accentDk);text-decoration:none;font-weight:600;padding:4px 8px;border:1px solid var(--accentDk);border-radius:8px;display:inline-flex;align-items:center;gap:3px}
  .welcome-overlay{position:fixed;inset:0;background:rgba(13,27,42,.6);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px}
  .welcome-box{background:var(--card);border-radius:20px;padding:28px 24px;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .welcome-box h2{font-size:20px;margin-bottom:8px;color:var(--navy)}
  .welcome-box p{font-size:14px;color:var(--mute);line-height:1.6;margin-bottom:16px}
  .welcome-box button{background:var(--accent);color:#17120E;border:none;border-radius:10px;padding:12px 24px;font-size:14px;font-weight:700;cursor:pointer}
  .dark-toggle{font-size:11px;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 10px;color:var(--mute)}
  /* Dark mode */
  /* --ink es el color de texto "principal" en TODA la app (nombres, títulos de tarjeta, valores).
     Antes solo se redefinían acá los demás tokens del tema oscuro y --ink se quedaba con su
     valor casi negro de siempre — por eso varios textos quedaban invisibles en modo oscuro
     (texto oscuro sobre tarjeta oscura): nombres en Asistencia, títulos del Informe, etc.
     Los pocos lugares que ya tenían su propio color fijo para modo oscuro (con selector más
     específico, ej. #app.dark .plan-date-inp) siguen ganando por especificidad, así que este
     cambio no les toca nada. */
  #app.dark{--navy:#241F18;--steel:#0a0908;--accent:#E3C3A5;--accentDk:#9B5F26;--ok:#4CAF7E;--warn:#B3261E;--ink:#241F18;--mute:#8A7866;--line:#E8DFD0;--bg:#0E0B09;--light:#FAF7F2;--card:#FFFFFF;--niebla:#7A6850}
  #app.dark .ex{background:#FFFFFF;border-color:#E8DFD0}
  #app.dark .form-inp{background:#FFFFFF;border-color:#E8DFD0;color:#241F18}
  #app.dark .form-sec{border-color:#E8DFD0}
  #app.dark .form-chk,#app.dark .form-rad{border-color:#E8DFD0;color:#76582D}
  #app.dark header{background:#0F0B08}
  #app.dark .seg button{background:#FFFFFF;border-color:#E8DFD0;color:#8A7866}
  #app.dark .seg button.sel{background:var(--accent);color:#17120E;border-color:var(--accent)}
  #app.dark .weeks button{background:#FFFFFF;border-color:#E8DFD0}
  #app.dark .weeks button.sel{border-color:var(--accent);background:#F2EEE9}
  #app.dark .edit-section{background:#FFFFFF;border-color:#E8DFD0}
  #app.dark .tcard{background:#FFFFFF;border-color:#E8DFD0}
  #app.dark .rep-card{background:#FFFFFF;border-color:#E8DFD0}
  #app.dark .asis-row{background:#FFFFFF;border-color:#E8DFD0}
  #app.dark .asis-cell{background:#FFFFFF;border-color:#E8DFD0;color:#241F18}
  #app.dark .asis-drill{background:#FFFFFF;border-color:#E8DFD0}
  #app.dark .pago-block.vencido{background:#F2E8E8;border-color:#F3E7E7}
  #app.dark .pago-block.porvencer{background:#F2EFE8;border-color:#F3EFE7}
  #app.dark .pago-block.aldia{background:#E8F5EC;border-color:#9adbb5}
  #app.dark .pago-block.sinreg{background:#FFFFFF;border-color:#E8DFD0}
  #app.dark input,#app.dark select,#app.dark textarea{background:#FFFFFF;border-color:#E8DFD0;color:#241F18}
  #app.dark .welcome-box{background:#FFFFFF}
  #app.dark .welcome-box h2{color:#241F18}
  #app.dark .welcome-box p{color:#8A7866}
  #app.dark #modal .mbox{background:#FFFFFF}
  #app.dark .weekdesc{background:#FFFFFF;border-color:#E8DFD0;color:#241F18}
  #app.dark .progwrap{background:#FFFFFF;border-color:#E8DFD0}
  /* Acento rosa-dorado para alumnas, misma base oscura */
  #app.dark.theme-f{--accent:#E3C3A5;--ok:#4CAF7E;--warn:#B3261E}
  #app.dark.theme-f .seg button.sel{background:#E3C3A5;border-color:#E3C3A5}
  #app.dark.theme-f .weeks button.sel{border-color:#E3C3A5;background:#F2EEE9}
  #app.dark.theme-f .ex.open-ex{border-left-color:#E3C3A5}
  #app.dark.theme-f header{background:#140D0F}
  /* Tabata */
  .tabata-overlay{position:fixed;inset:0;background:rgba(13,27,42,.9);display:none;align-items:center;justify-content:center;z-index:75;padding:20px}
  .tabata-overlay.show{display:flex}
  .tabata-box{text-align:center;width:100%;max-width:340px}
  .tabata-title{font-size:14px;letter-spacing:3px;color:#92bee8;font-weight:800;margin-bottom:8px}
  .tabata-modes{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
  .tabata-modes button{padding:7px 14px;border:1.5px solid #2a3a4a;border-radius:20px;background:transparent;color:#a2bcd7;font-size:12px;font-weight:700;cursor:pointer}
  .tabata-modes button.sel{background:#E3C3A5;border-color:#E3C3A5;color:#17120E}
  .tabata-modehelp{font-size:11px;color:#a2bdd7;margin-top:10px;line-height:1.5;max-width:280px;margin-left:auto;margin-right:auto}
  .tabata-time{font-size:80px;font-weight:900;color:#fff;font-family:'system-ui';line-height:1}
  .tabata-phase{font-size:22px;font-weight:700;color:#fff;margin:12px 0;padding:8px 20px;border-radius:12px;display:inline-block}
  .tabata-phase.work{background:#e74c3c;color:#fff}
  .tabata-phase.rest-phase{background:#2ecc71;color:#fff}
  .tabata-phase.done{background:#f39c12;color:#fff}
  .tabata-round{font-size:14px;color:#a2bcd7;margin:8px 0 16px}
  .tabata-controls{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
  .tabata-controls button{padding:10px 18px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;color:#fff}
  .tabata-controls button:first-child{background:#2ecc71}
  .tabata-controls button:nth-child(2){background:#e74c3c}
  .tabata-controls button:last-child{background:#34495e}
  .tabata-config{display:flex;gap:8px;justify-content:center}
  .tabata-config .fld{text-align:center}
  .tabata-config label{font-size:10px;color:#a2bdd7;display:block;margin-bottom:4px}
  .tabata-config input{width:60px;text-align:center;padding:8px;border:1.5px solid #2a3a4a;border-radius:8px;background:#0d1b2a;color:#fff;font-size:16px;font-weight:700}
  .tabata-btn{background:var(--accent);color:#17120E;border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;margin-top:8px}
  @media print{ header,nav,.seg,.weeks,.session-close,.edit-actions,.iconbtn,.lockbtn,.rest,.no-print{display:none!important} body,#app,main{background:#fff!important} #resumenCard{box-shadow:none!important;border-radius:0!important;max-width:100%!important} .icard{break-inside:avoid} }

  /* Informe de Progreso · formato "tablero" (tarjetas con estadísticas, récords, ejercicios y gráficos) */
  #resumenCard{max-width:420px;margin:0 auto}
  .irep-head{background:var(--repTintDk);color:#fff;border-radius:16px;padding:20px 20px 18px;margin-bottom:14px}
  .rword{font-size:22px;font-weight:900;letter-spacing:-1px}
  .rword span{font-weight:400}
  .icard{background:var(--card);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  #app.dark .icard{background:#FFFFFF}
  .icard h3{font-size:13px;font-weight:800;color:var(--ink);margin:0 0 12px}
  .istats{display:flex;gap:8px}
  .istat{flex:1;border-radius:10px;padding:10px 6px;text-align:center}
  .istat b{display:block;font-size:21px;font-weight:900}
  .istat span{font-size:9.5px;font-weight:700}
  .irec{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--light)}
  .irec:last-child{border:none}
  .irec .medal{font-size:22px}
  .irec .name{font-weight:700;font-size:13px;color:var(--ink)}
  .irec .chg{font-size:12px;color:var(--mute)}
  .irec .chg b{color:var(--ok)}
  .irec .diff{background:var(--okbg);color:var(--ok);font-weight:800;font-size:12px;padding:4px 10px;border-radius:8px;white-space:nowrap}
  .iex{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--light)}
  .iex:last-child{border:none}
  .iex .tr{font-size:15px;width:20px;text-align:center;flex-shrink:0}
  .iex b{display:block;font-weight:600;font-size:12.5px;color:var(--ink)}
  .iex small{color:var(--mute);font-size:10.5px}
  .iex .w{font-weight:700;font-size:12.5px;padding:4px 9px;border-radius:8px;white-space:nowrap}
  .iex .w.up{background:var(--okbg);color:var(--ok)}
  .iex .w.down{background:#F6E4E4;color:#A82424}
  .iex .w.same, .iex .w.none{background:var(--card);color:var(--mute)}
  .prbadge{display:inline-block;font-size:9.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,#f5a623,#e8580c);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
  .iex-acc{border-bottom:1px solid var(--light)}
  .iex-acc:last-child{border-bottom:none}
  .iex-acc summary{padding:10px 0!important;font-size:13px;font-weight:700;color:var(--ink)}
  .iex-acc .tacc-body{padding:0 0 8px!important}
  .iex-acc .iex:first-child{padding-top:2px}
  .ichart-label{font-size:11px;color:var(--mute);font-weight:700;margin:12px 0 6px}

  .ichart .bar .v{font-size:8.5px;color:var(--mute);margin-bottom:2px;white-space:nowrap}
  .ichart .bar .b{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--repBrand),var(--repBrandDk))}
  .ichart .bar .wk{font-size:8.5px;color:var(--niebla);margin-top:2px}

  /* ===== Marca TaFit para el Informe de Progreso: tipografía serif para los títulos + tarjetas
     "tablero", como la referencia visual que mandó Tami. Los colores siguen viniendo de las
     variables --rep* de siempre (azul para tema por defecto, bordó/rosa para #app.theme-f más
     arriba) para que cada alumno mantenga SU color — esto solo cambia la tipografía y la forma
     de las tarjetas, no fuerza un color único para todos. Todo escapado a esta sola pantalla
     — #resumenCard/.icard/etc siguen siendo los mismos, así el resto de la app no se toca. */
  .tafit-report .rword{ font-family:'Playfair Display',Georgia,serif; font-weight:900; }
  .tafit-report .icard h3{ font-family:'Playfair Display',Georgia,serif; font-weight:900; font-size:15px; }
  .tafit-report .istat b{ font-family:'Playfair Display',Georgia,serif; }
  .week-card{ background:var(--repTintDk); color:#fff; }
  .week-eyebrow{ font-size:10px; font-weight:800; letter-spacing:1.5px; color:rgba(255,255,255,.75); margin-bottom:6px; }
  .week-headline{ font-family:'Playfair Display',Georgia,serif; font-weight:900; font-size:26px; margin-bottom:14px; }
  .week-headline small{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-weight:600; font-size:13px; opacity:.8; }
  .week-strip{ display:flex; gap:6px; margin-bottom:12px; }
  .week-day{ flex:1; aspect-ratio:1; border-radius:10px; background:rgba(255,255,255,.1); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:11px; font-weight:700; }
  .week-day.on{ background:var(--repBrand); }
  .week-day.today{ box-shadow:0 0 0 2px #fff inset; }
  .week-day i{ font-style:normal; font-size:10px; }
  .week-list{ display:flex; flex-direction:column; gap:8px; }
  .week-item{ display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.1); border-radius:10px; padding:9px 11px; font-size:12.5px; }
  .week-item i{ font-style:normal; background:var(--repBrand); color:#fff; width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; flex:none; }
  .week-item b{ flex:1; font-weight:700; }
  .week-item span{ color:rgba(255,255,255,.7); font-size:11px; }
  .week-empty{ font-size:12px; color:rgba(255,255,255,.75); }
  .prog-card{ text-align:center; }
  .prog-card h3{ text-align:left; }
  .prog-ex-name{ font-weight:800; font-size:13px; color:var(--repBrandDk); text-align:left; margin:-4px 0 6px; }
  .prog-stats{ display:flex; gap:10px; margin-top:10px; }
  .prog-stat{ flex:1; background:var(--repTint); border-radius:10px; padding:10px 6px; }
  .prog-stat b{ display:block; font-family:'Playfair Display',Georgia,serif; font-weight:900; font-size:19px; color:var(--repBrandDk); }
  .prog-stat span{ font-size:9.5px; font-weight:700; color:var(--repBrandDk); opacity:.8; }
  #app.dark .week-item{ background:rgba(255,255,255,.08); }
  #app.dark .prog-stat{ background:var(--repTintDk); }
  .rep-signature{ color:var(--repBrandDk); }
  #app.dark .rep-signature{ color:var(--repBrand); }
  /* "Tu progreso" desplegable — para no alargar tanto el scroll del informe. Cerrado por
     defecto; al imprimir/descargar PDF se fuerza abierto (ver @media print) para que el
     gráfico no falte en el PDF ni en la imagen. */
  details.prog-card{ padding:16px; cursor:default; }
  details.prog-card summary{ list-style:none; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  details.prog-card summary::-webkit-details-marker{ display:none; }
  details.prog-card summary h3{ margin:0; }
  details.prog-card .tchev{ color:var(--niebla); font-size:14px; transition:transform .2s; flex:none; }
  details.prog-card[open] .tchev{ transform:rotate(180deg); }
  details.prog-card .prog-body{ margin-top:14px; }
  @media print{
    details.prog-card .prog-body{ display:block!important; }
    details.prog-card .tchev{ display:none!important; }
  }

  /* ===== Tarjeta "tablero" TaFit, reutilizable en toda la app (Rutina de hoy, Transcripta,
     Asistencia, Pagos) — mismo lenguaje visual que "Tu semana"/"Tu progreso" del Informe:
     degradé bordó/azul según el tema del alumno + título en serif. Vive en las variables
     --rep* de siempre, así que ya respeta el tema de cada alumno sin nada extra. No toca los
     colores funcionales (verde=ok, rojo/naranja=alerta) — esos siguen siendo los mismos. */
  .rep-hero{ background:var(--repTintDk); color:#fff; border-radius:14px; padding:16px; margin-bottom:12px; }
  .rep-hero-eyebrow{ font-size:10px; font-weight:800; letter-spacing:1.5px; color:rgba(255,255,255,.75); margin-bottom:6px; }
  .rep-hero-title{ font-family:'Playfair Display',Georgia,serif; font-weight:900; font-size:21px; line-height:1.25; }
  .rep-hero-title.sm{ font-size:16px; }
  .rep-hero-title small{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-weight:600; font-size:12px; opacity:.85; display:block; margin-top:2px; }
  .rep-hero-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .rep-hero-nav{ border:none; background:rgba(255,255,255,.16); color:#fff; border-radius:8px; width:30px; height:30px; font-size:14px; font-weight:700; cursor:pointer; flex:none; }
  .rep-hero-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; font-size:11.5px; font-weight:700; }
  .rep-hero-chip{ background:rgba(255,255,255,.15); border-radius:20px; padding:4px 10px; }
  .rep-hero-quote{ font-size:12.5px; opacity:.9; margin-top:10px; line-height:1.5; }
  .rep-hero-stats{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .rep-hero-stat{ flex:1; min-width:64px; background:rgba(255,255,255,.14); border-radius:10px; padding:8px 6px; text-align:center; }
  .rep-hero-stat b{ display:block; font-family:'Playfair Display',Georgia,serif; font-weight:900; font-size:18px; }
  .rep-hero-stat span{ font-size:9px; font-weight:700; opacity:.85; }
  .rep-hero-stat.ok b{ color:#8fe3ae; }
  .rep-hero-stat.bad b{ color:#ffaba0; }
  .rep-hero-stat.warn b{ color:#ffcf7a; }
  .tcard summary h2,details.tcycle summary.tcycle-sum b{ font-family:'Playfair Display',Georgia,serif; font-weight:900; }

  /* ---- Splash de arranque: el logo circular de marca mientras carga la app ---- */
  #bootsplash{position:fixed;inset:0;background:#15110D;display:flex;align-items:center;justify-content:center;z-index:99999;transition:opacity .4s ease}
  #bootsplash img{width:42vw;max-width:220px;min-width:120px;display:block;border-radius:50%;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:bootpulse 1.6s ease-in-out infinite}
  #bootsplash.hide{opacity:0;pointer-events:none}
  #authgate{position:fixed;inset:0;z-index:9998;background:#0a0908;color:#FAF7F2;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 20px;text-align:center}
  #authgate.show{display:flex}
  #authgate .ag-logo{width:120px;height:120px;border-radius:50%;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  #authgate .ag-t{font-size:20px;font-weight:700;color:#E3C3A5}
  #authgate .ag-p{font-size:14px;line-height:1.5;max-width:340px;color:#d9cfc2}
  #authgate .ag-p.small{font-size:12px;color:#8A7866;margin-top:6px}
  #authgate form{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
  #authgate input{font-size:16px;padding:12px 14px;border-radius:10px;border:1px solid #3a3128;background:#17130f;color:#FAF7F2}
  #authgate button{font-size:16px;font-weight:700;padding:12px;border-radius:10px;border:0;background:#E3C3A5;color:#241F18;cursor:pointer}
  #authgate button:disabled{opacity:.6}
  #authgate .ag-err{min-height:18px;font-size:13px;color:#f2a29b}
  #privbox{position:fixed;inset:0;z-index:9997;background:rgba(10,9,8,.72);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 16px}
  #privbox.show{display:flex}
  #privbox .pv-card{position:relative;background:var(--card);color:var(--ink);max-width:560px;width:100%;border-radius:14px;padding:22px 20px 18px;font-size:14px;line-height:1.55;box-shadow:0 12px 40px rgba(0,0,0,.4)}
  #privbox h2{font-size:19px;margin:0 30px 2px 0}
  #privbox h3{font-size:15px;margin:16px 0 4px}
  #privbox p,#privbox li{margin:4px 0}
  #privbox ul{padding-left:18px;margin:4px 0}
  #privbox .pv-small{font-size:12px;color:var(--mute)}
  #privbox .pv-legal{font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px;margin-top:16px}
  #privbox .pv-x{position:absolute;top:12px;right:12px;border:0;background:none;font-size:18px;color:var(--mute);cursor:pointer}
  #privbox .pv-ok{display:block;width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#241F18;font-weight:700;font-size:15px;cursor:pointer}
  footer.legal .lnk-priv{background:none;border:0;padding:0;margin-top:2px;font:inherit;color:var(--mute);text-decoration:underline;cursor:pointer}
  .form-priv{font-size:13px;line-height:1.5;background:var(--tint2);border-radius:10px;padding:10px 12px}
  .form-priv button{margin-top:6px;background:none;border:0;padding:0;font:inherit;font-weight:700;text-decoration:underline;color:var(--ink);cursor:pointer}
  footer.legal{text-align:center;font-size:11px;line-height:1.4;color:var(--mute);padding:10px 16px 18px;border-top:1px solid var(--line)}
  @keyframes bootpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
</style>
</head>
<body>
<div id="bootsplash"><img src="./logo-principal.png" alt="TaFiT"></div>
<div id="authgate"></div>
<div id="app">
  <header>
    <div class="topline">
      <div class="wm"><img src="./logo-principal.png" alt="TaFiT" data-act="viewLogo" style="cursor:zoom-in"></div>
      <div class="topright">
        <button class="bellbtn" id="bellbtn" data-act="openNotifs" style="display:none">🔔<span class="bell-badge" id="bellBadge"></span></button>
        <button class="lockbtn" id="lockbtn" data-act="lock"></button>
        <div class="cloud"><span class="dot" id="clouddot"></span><span id="cloudlbl">…</span><button class="sync-btn" data-act="forceSync" title="Sincronizar">↻</button></div>

  <nav id="nav"></nav>
  <main id="main"><div class="focus">Cargando…</div></main>
  <footer class="legal">© 2026 Tamara Claveria · TaFiT, marca en trámite · Todos los derechos reservados<br><button class="lnk-priv" data-act="showPrivacy">Política de privacidad</button></footer>
</div>
<div class="toast" id="toast"></div>
<div id="rest"><span>⏱ Descanso</span><b id="restnum">0 s</b><button data-act="restStop">Saltar</button></div>
<div id="lb"></div>
<div id="tabata" class="tabata-overlay">
  <div class="tabata-box">
    <div class="tabata-title" id="tabataTitle">TABATA</div>
    <div class="tabata-modes">
      <button data-act="tabataMode" data-mode="tabata" class="sel">Tabata</button>
      <button data-act="tabataMode" data-mode="amrap">AMRAP</button>
      <button data-act="tabataMode" data-mode="emom">EMOM</button>
    </div>
    <div class="tabata-time" id="tabataTime">00:00</div>
    <div class="tabata-phase" id="tabataPhase">Listo para empezar</div>

</div>
<div id="modal"><div class="mbox"><div class="mtitle" id="mtitle"></div><input id="minput" class="minput"><div class="mbtns"><button id="mcancel">Cancelar</button><button id="mok">Aceptar</button></div></div></div>
<div id="notifOv" class="notif-ov"><div class="notif-box"><h3>🔔 Avisos<button data-act="closeNotifs" style="background:none;border:none;font-size:18px;color:var(--mute);cursor:pointer">✕</button></h3><div id="notifList"></div><button class="notif-close" data-act="closeNotifs">Cerrar</button></div></div>

<script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
/* ====================================================================
   TaFit · multi-alumno · v8 (Firebase sync + offline + dúos por pestaña + timer manual)
   ==================================================================== */
let _swVisibleSince=Date.now(), _swUpdateReady=false;
function showUpdateBanner(){
  if(document.getElementById('updBanner')) return;
  const d=document.createElement('div'); d.id='updBanner';
  d.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:9999;background:#0a0908;color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:13.5px;font-weight:600';
  d.innerHTML='<span style="flex:1">✨ Hay una versión nueva de TaFit</span><button type="button" style="font-family:inherit;font-weight:800;font-size:13px;border:none;border-radius:9px;padding:8px 12px;background:#E3C3A5;color:#241F18;cursor:pointer">Actualizar</button>';
  d.querySelector('button').addEventListener('click', async function(){ try{ if(typeof saveData==='function'&&active) await saveData(); }catch(e){} location.reload(); });
  document.body.appendChild(d);
}
const APP_VERSION='v8-133'; /* mantener SIEMPRE igual al CACHE de sw.js — se muestra en Ajustes para poder confirmar a simple vista si un dispositivo ya bajó la última versión.
  07/10/2026: esto quedó pisado en 'v8-91' durante varias subidas (hasta la v8-102) sin que nadie lo notara — o sea que el número de versión en Ajustes
  NO SIRVIÓ para confirmar nada en todo ese tiempo. De acá en adelante, cada vez que se sube un zip nuevo, bumpear este valor Y el CACHE de sw.js juntos, al mismo número. */
let fireSync=()=>{},fireDel=()=>{};
let _fromRemote=false;
const DEVICE_ID=(()=>{ try{ let id=localStorage.getItem('tafit:devid'); if(!id){ id='d_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); localStorage.setItem('tafit:devid',id); } return id; }catch(e){ return 'd_'+Math.random().toString(36).slice(2,10); } })();

const Store=(()=>{
  const cloud=(typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function');
  let ls=false; try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); ls=true; }catch(e){ ls=false; }
  const mem={};
  async function get(k){ if(cloud){ try{ const r=await window.storage.get(k,false); return r?r.value:null; }catch(e){ return null; } } if(ls){ try{ return localStorage.getItem(k); }catch(e){ return (k in mem)?mem[k]:null; } } return (k in mem)?mem[k]:null; }
  async function set(k,v){ if(cloud){ try{ await window.storage.set(k,v,false); fireSync(k,v); return true; }catch(e){ return false; } } if(ls){ try{ localStorage.setItem(k,v); fireSync(k,v); return true; }catch(e){ return false; } } mem[k]=v; fireSync(k,v); return true; }
  async function del(k){ if(cloud){ try{ await window.storage.delete(k,false); fireDel(k); return; }catch(e){} } if(ls){ try{ localStorage.removeItem(k); fireDel(k); return; }catch(e){} } delete mem[k]; fireDel(k); }
  return { get,set,del, where:cloud?'nube':(ls?'dispositivo':'memoria'), cloud, ls };
})();

/* ==== Ver técnica sin salir de la app ====
   YouTube no permite embeber su página de resultados de búsqueda (solo videos puntuales vía /embed/ID),
   así que: si el link es un video puntual (watch?v=, youtu.be/, shorts/) lo mostramos en un modal adentro
   de la app; si es un link de búsqueda genérico (el que se arma solo con YT(nombre)), no hay forma de
   embeberlo y se abre YouTube afuera, como hasta ahora. Cuando cargás un video puntual (en la Biblioteca
   o en el ejercicio de la rutina) queda todo adentro de la app. */
function extractYouTubeId(url){
  if(!url) return null;
  let m=String(url).match(/[?&]v=([A-Za-z0-9_-]{6,})/); if(m) return m[1];
  m=String(url).match(/youtu\.be\/([A-Za-z0-9_-]{6,})/); if(m) return m[1];
  m=String(url).match(/youtube\.com\/shorts\/([A-Za-z0-9_-]{6,})/); if(m) return m[1];
  m=String(url).match(/youtube\.com\/embed\/([A-Za-z0-9_-]{6,})/); if(m) return m[1];
  return null;
}
function playVideo(url,name){
  const id=extractYouTubeId(url);
  if(id) openVideoModal(id,name);
  else window.open(url,'_blank','noopener');
}
/* miniatura real del ejercicio (no del grupo muscular): el frame del propio video de
   YouTube cargado en vid. Si el link es genérico (búsqueda, sin ID puntual) no hay
   miniatura posible y la función devuelve '' — el ejercicio simplemente no la muestra. */
function ytThumb(url){
  const id=extractYouTubeId(url);
  return id?('https://img.youtube.com/vi/'+id+'/mqdefault.jpg'):'';
}
function viewExThumb(url,name){
  const img=ytThumb(url); if(!img) return;
  $('lb').innerHTML=`<img src="${img}" alt="${esc(name||'')}">`;
  $('lb').classList.add('show');
}

function abFinisherOptionsHTML(){
  const groups={};
  AB_CORE_BLOCKS.forEach(function(p){ (groups[p.format]=groups[p.format]||[]).push(p); });
  let h='<option value="">+ Agregar bloque de abdominales/espinal (al principio)…</option>';
  Object.keys(AB_FORMAT_LABEL).forEach(function(fmt){
    if(!groups[fmt]) return;
    h+=`<optgroup label="${esc(AB_FORMAT_LABEL[fmt])}">`+groups[fmt].map(function(p){ return `<option value="${p.id}">${esc(p.label)}</option>`; }).join('')+'</optgroup>';
  });
  return h;
}
function addAbFinisher(di,id){
  syncFromForms();
  const p=AB_CORE_BLOCKS.find(function(x){ return x.id===id; }); if(!p) return;
  const day=DB.students[active].routine[di];
  /* se agrega AL PRINCIPIO del día (antes del primer ejercicio), como bloque de activación */
  const items=[{ n:'── '+p.label+' ──', blk:true, tip:p.desc, blkWork:p.work, blkRest:p.rest, blkRounds:p.rounds, blkFormat:p.format, s:p.rounds }]
    .concat(p.exercises.map(function(pe){ return JSON.parse(JSON.stringify(pe)); }));
  day.ex.unshift.apply(day.ex, items);
  openSecs.add('day'+di);
  toast('Bloque agregado al principio del día — revisalo y tocá "Guardar rutina" ✓','ok');
  renderEdit();
}

/* ==== Cumpleaños: se leen de "Fecha de nacimiento" (Anamnesis o Acuerdo), sin pedir carga aparte ==== */
function parseFechaNac(str){
  if(!str) return null;
  const m=String(str).match(/^(\d{4})-(\d{2})-(\d{2})/); /* formato <input type=date> */
  if(!m) return null;
  const mo=+m[2],d=+m[3];
  if(mo<1||mo>12||d<1||d>31) return null;
  return {m:mo,d:d};
}
function daysUntilBirthday(mo,d){
  const now=new Date(); now.setHours(0,0,0,0);
  let next=new Date(now.getFullYear(),mo-1,d);
  if(next<now) next=new Date(now.getFullYear()+1,mo-1,d);
  return Math.round((next-now)/86400000);
}

/* ==== Vencimiento de plan: opcional, se calcula a partir de la fecha del último pago cargada
   a mano en Editar. El plan dura 30 días desde esa fecha. Si no hay fecha cargada, no se
   muestra ninguna alerta (no se asume nada sobre alumnos sin el dato). ==== */
const PLAN_DAYS=30;
function todayISO(){ return new Date().toISOString().slice(0,10); }
function planDueInfo(planPaidISO){
  if(!planPaidISO) return null;
  const paid=new Date(planPaidISO+'T00:00:00');
  if(isNaN(paid.getTime())) return null;
  const now=new Date(); now.setHours(0,0,0,0);
  const due=new Date(paid.getTime()); due.setDate(due.getDate()+PLAN_DAYS);
  const daysLeft=Math.round((due-now)/86400000);
  const status=daysLeft<0?'bad':(daysLeft<=5?'warn':'ok');
  const dueStr=due.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});
  return { daysLeft, dueStr, status };
}

   "Jalón al pecho" -> es espalda aunque diga "pecho", o "Curl femoral" -> es pierna, no bíceps) */

  ['core',/abdomin|\babd\b|crunch|plancha|sit ?up|v-?ups?|barquito|twist|pallof|oblicuo|inferiores|toco punta|lanzamiento/],

  ['espalda',/dorsal|jalon|remo|domina|pull ?over|pullover|lachine|espinales/],
  ['biceps',/biceps|curl/],
  ['piernas',/sentadilla|prensa|zancada|estocada|bulgara|step ?up|gemelo|abduc|aduc|\bsumo\b|\bhack\b|sillon de cuad|patada/],
  ['pecho',/pecho|apertura|flexion|fondos en cajon|\bbanca\b|\bplano\b|inclinado|^press\b/],
];

function libAccHTML(items,rowFn,opts){
  opts=opts||{}; const openAll=!!opts.openAll, editId=opts.editId;

  const anyEdit=function(arr){ return !!editId&&arr.some(function(it){ return it.id===editId; }); };
  let h='';
  EXLIB_GROUPS.forEach(function(g){
    const arr=byG[g]; if(!arr||!arr.length) return;
    const subNames=g==='Core'?CORE_SUBS.concat(['Otros']):(LIB_SUBS[g]?LIB_SUBS[g].map(function(x){ return x[0]; }).concat(['Otros']):null);
    let inner;
    if(subNames){ inner=''; subNames.forEach(function(sn){ const sub=arr.filter(function(it){ return (libSubsOf(it,g)||[]).indexOf(sn)>=0; }); if(!sub.length) return; inner+=acc(sn,sub,sub.map(rowFn).join(''),'sub',openAll||anyEdit(sub)); }); }
    else inner=arr.map(rowFn).join('');
    h+=acc(g,arr,inner,'',openAll||anyEdit(arr));
  });
  let el=''; let tot=new Set();
  LIB_ELEM.forEach(function(x){ const sub=items.filter(function(it){ return x[1].test(it.n||''); }); if(!sub.length) return; sub.forEach(function(it){ tot.add(it.id); }); el+=acc(x[0],sub,sub.map(rowFn).join(''),'sub',openAll&&false); });
  if(el) h+=`<details class="lib-acc elem"><summary><span>🧰 Por elemento</span><b>${tot.size}</b><i>▾</i></summary>${el}</details>`;
  if(opts.sesiones){ /* 15/10/2026: sesiones armadas (running, natación, movilidad) */
    const sec=function(tipo,tit){ const ts=SES_TPL.filter(function(t){ return t.tipo===tipo; }); let inner=''; ['Principiante','Intermedio','Avanzado','Todos'].forEach(function(nv){ const g=ts.filter(function(t){ return t.niv===nv; }); if(!g.length) return; inner+=acc(nv==='Todos'?'Para todos':nv,g,g.map(function(t){ return `<div class="lib-row"><div class="ln"><div class="nm">${esc(t.n)}</div><div class="tp">${t.tipo==='swim'?swimTotal(t)+' m':sesMins(t)+' min'} · ${t.bl?t.bl.map(function(b){ return b.rep?b.rep+'×('+b.bl.map(function(x){ return minTxt(x.min)+' Z'+x.z; }).join('+')+')':minTxt(b.min)+' Z'+b.z; }).join(' → '):t.ser?t.ser.map(function(x){ return (x.rep>1?x.rep+'×':'')+x.m+' '+x.q.toLowerCase(); }).join(' · '):t.mov.join(' · ')}</div></div></div>`; }).join(''),'sub',false); }); return acc(tit,ts,inner,'elem',false); };
    h+=sec('run','🏃 Running y caminata (sesiones)')+sec('swim','🏊 Natación (sesiones)')+sec('mob','🧘 Movilidad (sesiones)'); }

}

/* Foto de "lo último que este dispositivo sabe que está sincronizado con la nube" —
   se usa en saveDB() para saber, alumno por alumno, si ESTE dispositivo lo tocó de
   verdad desde la última sincronización, o si sigue exactamente igual a como lo cargó
   (y por lo tanto no hay que pisar lo que haya en el servidor con esta copia). */
let _syncBaseline=null;
function setSyncBaseline(){ try{ _syncBaseline=JSON.stringify({students:DB.students,settings:DB.settings,exLib:DB.exLib,templates:DB.templates}); }catch(e){} }
/* Merge genérico por id para listas "planas" como la Biblioteca de ejercicios o las
   Plantillas de rutina (06/10/2026) — antes, el merge de saveDB() solo armaba de nuevo
   {order,students,settings,_seed,_deleted} y se OLVIDABA de exLib/templates: la próxima
   vez que este dispositivo sincronizara con la nube, la Biblioteca entera (o las
   Plantillas) se perdían sin aviso. Misma lógica que el merge de alumnos, pero por ítem:
   si cambió localmente respecto al baseline (o es nuevo, nunca sincronizado), gana lo
   local; si no cambió, gana siempre el servidor (incluso si eso significa que lo borraron
   desde otro dispositivo). */
function mergeListById(localArr,remoteArr,baseArr){
  const localMap={}, remoteMap={}, baseMap={};
  (localArr||[]).forEach(function(it){ if(it&&it.id) localMap[it.id]=it; });
  (remoteArr||[]).forEach(function(it){ if(it&&it.id) remoteMap[it.id]=it; });
  (baseArr||[]).forEach(function(it){ if(it&&it.id) baseMap[it.id]=it; });
  const ids=new Set(Object.keys(localMap).concat(Object.keys(remoteMap)).concat(Object.keys(baseMap)));
  const out=[];
  ids.forEach(function(id){
    const inLocal=Object.prototype.hasOwnProperty.call(localMap,id);
    const inRemote=Object.prototype.hasOwnProperty.call(remoteMap,id);
    const inBase=Object.prototype.hasOwnProperty.call(baseMap,id);
    if(!inBase){ if(inLocal) out.push(localMap[id]); else if(inRemote) out.push(remoteMap[id]); return; }
    const changedLocally=inLocal&&(JSON.stringify(localMap[id])!==JSON.stringify(baseMap[id]));
    if(changedLocally){ out.push(localMap[id]); return; }
    if(inRemote) out.push(remoteMap[id]);
  });
  return out;
}

   Un mensaje por alumno, guardado en 'tafit:chat:<id>' (array de {id,from,text,ts}),
   sincronizado con el mismo mecanismo genérico de Store/Firestore que ya usa todo lo
   demás (ver myKeys()/pushAllLocal() más arriba). "Visto" es solo local a cada
   dispositivo (como 'tafit:notifs:seen'), nunca se sube — cada celular lleva su propia
   cuenta de qué leyó. Cuando escribe un alumno, además se genera un Aviso (el mismo
   sistema de la campanita que ya usa Tami para "cerró la sesión") para que a la profe le
   llegue el aviso aunque no esté mirando a ese alumno en ese momento. */
function newChatId(){ return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* 23/10/2026: el aviso a la profe trae el resumen de la salida, y la profe puede comentar una
   sesión desde la Transcripta: el comentario le llega al alumno por el chat. */
function sesNotifTxt(x){ if(!x) return ''; const p=[]; const ic=x.tipo==='swim'?'🏊':x.tipo==='mob'?'🧘':'🏃';
  if(x.km) p.push(String(x.km).replace('.',',')+' km'); if(x.m) p.push(x.m+' m'); if(x.min&&!x.km) p.push(x.min+' min');
  const km=inf2Num(x.km), sc=+x.sec||inf2Num(x.min)*60; if(km>=0.5&&sc&&km<60) p.push(paceTxt(sc,km*1000)+'/km');
  if(x.rpe) p.push('esfuerzo '+x.rpe+'/10'); if(x.feel){ const fe=FEELS.find(function(f){ return f[0]===x.feel; }); if(fe) p.push(fe[1]); } if(x.test) p.push('test 12′: '+(x.test/1000).toFixed(2).replace('.',',')+' km');
  try{ if(x.tipo==='run'&&x.at){ const h=runHist(+x.at); if(h.length){ const R=runRecords(h), c=runEntry(x,+x.at); if((c.bk&&(!R.bk||c.bk<R.bk))||c.km>R.km||(c.b5&&(!R.b5||c.b5<R.b5))) p.push('🏆 récord'); } } }catch(e){}
  return p.length?ic+' '+p.join(' · '):''; }

async function sendChatMessage(){
  const inp=$('chatInput'); if(!inp) return;
  const text=inp.value.trim(); if(!text) return;
  /* releemos lo último antes de agregar, para no pisar un mensaje que el otro lado
     mandó un segundo antes y todavía no nos llegó por el listener en tiempo real */
  const remote=safeParse(await Store.get('tafit:chat:'+active)||'[]',[]);
  CHAT=mergeChat(CHAT, remote);
  const msg={ id:newChatId(), from:trainer?'trainer':'student', text, ts:new Date().toISOString() };
  CHAT.push(msg);
  await Store.set('tafit:chat:'+active, JSON.stringify(CHAT));
  if(!trainer){ try{ await pushNotif({ id:active, name:DB.students[active].name, date:msg.ts, chat:true, text }); }catch(e){} }
  inp.value='';
  renderChat();
}
async function renderChat(){
  const remote=safeParse(await Store.get('tafit:chat:'+active)||'[]',[]);
  CHAT=mergeChat(CHAT, remote);
  const st=DB.students[active]||{};
  const myRole=trainer?'trainer':'student';

      const mine=msg.from===myRole;

    }).join('');

/* ==== Recordatorios del sistema (26/09/2026) ====
   Primera versión de "notificaciones": como la app vive en GitHub Pages sin servidor
   propio, no podemos mandar avisos que lleguen con la app CERRADA (eso necesitaría
   Firebase Cloud Functions + plan pago). Lo que sí podemos hacer sin nada de eso: en
   cuanto la profe ABRE la app, si ya activó el permiso del navegador, se le muestra una
   notificación real del sistema (aparece igual que cualquier otra app) resumiendo lo que
   tiene pendiente — pagos vencidos/por vencer y avisos sin leer. Como máximo una vez por
   día por celular, para no ser invasivo. */
function notifsSupported(){ return typeof Notification!=='undefined' && 'serviceWorker' in navigator; }
async function requestNotifPermission(){
  if(!notifsSupported()){ toast('Este navegador no soporta notificaciones','warn'); return; }
  try{
    const perm=await Notification.requestPermission();
    if(perm==='granted'){
      toast('Notificaciones activadas ✓','ok');
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg) reg.showNotification('TaFit',{body:'Listo — acá vas a ver tus avisos pendientes cada vez que abras la app.',icon:'./icon-app-512.png',badge:'./icon-app-512.png'});
    } else if(perm==='denied'){
      toast('Quedaron bloqueadas. Se activan desde los permisos del sitio en el navegador.','warn');
    }
    renderEdit();
  }catch(e){ toast('No se pudo activar','warn'); }
}

async function checkDailyReminders(){
  try{
    if(locked||!trainer) return; /* esto es para la profe, no para el alumno */
    if(!notifsSupported()||Notification.permission!=='granted') return;
    if(lastReminderShownDate()===todayISO()) return; /* ya se mostró hoy en este celular */
    const ids=DB.order.filter(id=>DB.students[id]);
    const rows=[]; /* recordatorio de planes a 30 días: reemplazado por Cobros */
    const vencidos=rows.filter(d=>d&&d.status==='bad').length;
    const porVencer=rows.filter(d=>d&&d.status==='warn').length;
    const avisos=unseenNotifs().length;
    const partes=[];
    if(vencidos) partes.push('💳 '+vencidos+' pago'+(vencidos===1?'':'s')+' vencido'+(vencidos===1?'':'s'));

  const ids=new Set(Object.keys(L.students||{}).concat(Object.keys(remote.students||{})));
  ids.forEach(function(id){
    if(mergedDeleted[id]) return;
    const localHas=L.students&&Object.prototype.hasOwnProperty.call(L.students,id);
    const remoteHas=Object.prototype.hasOwnProperty.call(remote.students,id);
    if(localHas&&!remoteHas){ mergedStudents[id]=L.students[id]; return; }
    if(!localHas&&remoteHas){ mergedStudents[id]=remote.students[id]; return; }
    const hadInBaseline=Object.prototype.hasOwnProperty.call(baseStudents,id);
    const localSt=L.students[id]||{}, remoteSt=remote.students[id]||{}, baseSt=baseStudents[id]||{};
    const allFields=new Set(Object.keys(localSt).concat(Object.keys(remoteSt)).concat(Object.keys(baseSt)));
    const mergedSt={};

      else if(!hadInBaseline) val=remoteSt[f];                  /* alumno recreado localmente: manda la nube */
      else val=(JSON.stringify(localSt[f])!==JSON.stringify(baseSt[f]))?localSt[f]:remoteSt[f];
      if(val!==undefined) mergedSt[f]=val;

  (remote.order||[]).forEach(function(id){ if(mergedStudents[id]&&mergedOrder.indexOf(id)===-1) mergedOrder.push(id); });
  Object.keys(mergedStudents).forEach(function(id){ if(mergedOrder.indexOf(id)===-1) mergedOrder.push(id); });

function mergeStudentsByFt(L,R,pref){
  const out=JSON.parse(JSON.stringify(pref==='local'?L:R));
  const dead=Object.assign({},R._deleted,L._deleted); out._deleted=dead;
  out.students={};
  const ids=new Set(Object.keys(L.students||{}).concat(Object.keys(R.students||{})));
  ids.forEach(function(id){
    if(dead[id]) return;
    const a=L.students&&L.students[id], b=R.students&&R.students[id];
    if(a&&!b){ out.students[id]=a; return; } if(b&&!a){ out.students[id]=b; return; }
    const m={};
    new Set(Object.keys(a).concat(Object.keys(b))).forEach(function(f){
      if(f==='_ft') return;
      const lt=ftOf(a,f), rt=ftOf(b,f);
      const val=(lt!==rt)?((lt>rt)?a[f]:b[f]):(pref==='local'?a[f]:b[f]);
      if(val!==undefined) m[f]=val;

    const ft=mergeFtMaps(a,b); if(Object.keys(ft).length) m._ft=ft;
    out.students[id]=m;

  Object.keys(out.students).forEach(function(id){ if(order.indexOf(id)===-1) order.push(id); });
  out.order=order;

     copiaban enteros de un solo lado y se perdían cosas) */

  out.templates=unionListT(L.templates,R.templates,out._tomb);

     nunca puede volver a pisar el trabajo reciente de otro — ni siquiera con un dispositivo
     que tenía la app abierta desde hace rato con datos desactualizados. Esto reemplaza al
     chequeo global de v2, así que ya no hace falta rechazar ni descartar guardados enteros;
     'force' se mantiene solo por compatibilidad con quien la llama, pero ya no cambia el
     comportamiento: el merge por alumno es siempre seguro, incluso al importar un backup
     (los alumnos que trae el backup se guardan tal cual se importaron; los que el backup no
     conoce —por ejemplo si se sumó un alumno nuevo después de exportarlo— se conservan). */
  /* 08/10/2026 — "guardé la rutina de Grupo 5 y desapareció": el guardado leía la nube y
     DESPUÉS escribía. Si en ese medio otro celular (ej. el de una alumna con su copia vieja)
     también guardaba, el último en escribir pisaba al otro — y como esa copia vieja no tenía
     la rutina nueva, la borraba. Ahora:
     1) cada campo que ESTE celular cambió de verdad queda marcado con su hora (st._ft);
        al juntar dos versiones, gana siempre el cambio más nuevo de ese campo, venga de
        donde venga (una copia vieja nunca le gana a una edición más nueva);
     2) leer + juntar + escribir en la nube va en UN solo paso (transacción): si otro
        celular escribe en el medio, se vuelve a juntar con lo suyo antes de guardar. */
  /* celular de alumna con link nuevo: hasta que llegue su alumno de la nube no se guarda nada */
  if(LINK_TOK&&(!active||!DB.students[active]||urlLockPending||urlLockFailed)) return;
  if(force) stampAllFields(); else stampLocalEdits();
  let _mergedFromServer=false, _wroteCloud=false;
  if(fsDB){
    try{
      const ref=kvCol().doc(CLOUD_DB_ID);
      const localDB=DB, base=safeParse(_syncBaseline,null);
      const tx=fsDB.runTransaction(function(t){ return t.get(ref).then(function(snap){
        if(snap.exists) return snap;
        /* primera vez con el documento nuevo: se parte de lo último del documento viejo */
        return t.get(kvCol().doc(LEGACY_DB_ID));
      }).then(function(snap){
        const remote=snap.exists?safeParse(snap.data().v,null):null;
        const out=(remote&&remote.students)?mergeDBWithRemote(localDB,remote,base):JSON.parse(JSON.stringify(localDB));
        out._ts=Date.now();
        /* celular de alumna: a su casillero sube solo su propio alumno */
        if(LINK_TOK&&active&&out.students&&out.students[active]){ const one={}; one[active]=out.students[active]; out.students=one; out.order=[active]; out.templates=[]; }
        t.set(ref,{v:JSON.stringify(out),ts:firebase.firestore.FieldValue.serverTimestamp(),dev:DEVICE_ID});
        return out;
      }); });
      const merged=await Promise.race([tx,new Promise(function(_,rej){ setTimeout(function(){ rej(new Error('timeout')); },10000); })]);
      DB=merged; _mergedFromServer=true; _wroteCloud=true;
      mirrorLegacyDB(JSON.stringify(merged));
    }catch(e){ /* sin señal u otro error: seguimos con el guardado normal (offline-first) */ }
  }
  if(_wroteCloud){
    /* ya quedó en la nube: solo lo dejamos también en este celular (sin volver a subirlo) */
    try{ localStorage.setItem('tafit:students', JSON.stringify(DB)); }catch(e){}
    clearPending('tafit:students');
    try{ relayOut('tafit:students', JSON.stringify(DB)); }catch(e){} /* casilleros de alumnos */
  } else {
    DB._ts=Date.now();
    await Store.set('tafit:students', JSON.stringify(DB)); /* sube por _pushRaw, que también junta con la nube */
  }
  /* SEGUNDA CAUSA (25/09/2026) de "se ve bien un instante y después vuelve a lo malo":
     acá siempre se adelantaba _syncBaseline, incluso cuando este guardado NO se pudo
     comparar contra el servidor (fsDB todavía null, sin señal, etc. — el caso típico es el
     primer guardado del arranque, justo el que hace runSeeds() al forzar una corrección).
     Eso hacía que, un rato después, cuando SÍ había señal y pushAllLocal() volvía a llamar
     a saveDB() para comparar de verdad, este alumno ya figurara como "sin cambios desde el
     baseline" — porque el baseline se había adelantado de más, a upa de un guardado que
     nunca miró al servidor — y el merge terminaba prefiriendo la versión vieja del servidor
     por sobre la corrección recién aplicada. Ahora _syncBaseline solo avanza cuando este
     guardado realmente se comparó contra el servidor: así, la próxima vez que haya señal,
     el merge todavía puede ver que el alumno cambió de verdad desde la última comparación
     real, y la corrección gana en vez de perderse. */
  if(_mergedFromServer||_syncBaseline===null) setSyncBaseline();
}

async function saveLogs(){

/* Protección: al recibir LOGS de Firebase, solo AGREGAR sesiones nuevas, nunca borrar existentes */
function mergeLogs(localLogs, remoteLogs){
  return unionLogsArr(localLogs, remoteLogs, logsDelFor(active));
}
/* Mismo criterio que mergeLogs: al recibir mensajes de chat de Firebase, solo AGREGAR los
   que no tengamos todavía (por id), nunca pisar/perder los que ya están acá — así dos
   celulares (profe + alumna) pueden escribir casi al mismo tiempo sin que uno le gane al
   otro en el guardado. */
function mergeChat(localChat, remoteChat){
  if(!remoteChat||!remoteChat.length) return localChat||[];
  if(!localChat||!localChat.length) return remoteChat;
  const ids=new Set(localChat.map(function(m){ return m.id; }));
  const merged=localChat.slice();
  remoteChat.forEach(function(rm){ if(!ids.has(rm.id)) merged.push(rm); });
  merged.sort(function(a,b){ return new Date(a.ts)-new Date(b.ts); });
  return merged;
}
