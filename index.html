/* Marca el inicio de un nuevo ciclo/programa: NO borra ni toca el historial (sigue completo en
   Transcripta), solo guarda una fecha para que el Informe de Evolución de acá en más cuente
   nada más que las sesiones del programa nuevo. */
async function startNewCycle(){
  const st=DB.students[active], name=st.name;
  if(!await uiConfirm('¿Iniciar un nuevo ciclo para '+name+'? Su historial anterior NO se borra — sigue completo en Transcripta, dividido como "Transcripta 1", "Transcripta 2", etc. — pero el Informe de Evolución de ahora en más solo va a contar los datos desde hoy.')) return;
  const now=new Date().toISOString();
  /* Guarda una "foto" de la rutina que tenía hasta ahora (con sus fechas de inicio/fin) para
     que Transcripta pueda seguir mostrando esa rutina vieja tal cual era, separada de la nueva. */
  if(!st.cycleHistory) st.cycleHistory=[];
  st.cycleHistory.push({ start:st.cycleStart||null, end:now, routine:cp(st.routine), weeks:cp(st.weeks) });
  st.cycleStart=now;
  /* La CACHE (overrides semanales de la profe + los pesos/reps que se van cargando en la
     sesión en curso) está indexada por POSICIÓN (semana/día/índice de ejercicio), no por
     ejercicio en sí. Si la rutina nueva tiene otros ejercicios en esas mismas posiciones,
     dejar la CACHE vieja hace que se mezclen datos de la rutina anterior con la nueva (por
     ej. un día mostrando de golpe el ejercicio viejo a partir de cierta semana). El LOGS
     (historial de sesiones cerradas, lo que se ve en Transcripta) NO se toca acá. */
  CACHE=clearedCache(CACHE);
  await saveData();
  await saveDB();
  toast('✓ Nuevo ciclo iniciado para '+name,'ok');
  renderEdit();
}

async function applyTemplate(tplId,targetId){
  const tpl=(DB.templates||[]).find(function(t){ return t.id===tplId; }); if(!tpl) return;

     cada plantilla tiene su propio selector de alumno (ver templates UI) y se puede aplicar
     a cualquiera, no solo al que tenías abierto en ese momento. */
  const target=(targetId&&DB.students[targetId])?targetId:active;

     que su CACHE/LOGS se carguen bien antes de tocar su rutina — si no, se pisaría la

  if(target!==active) await switchStudent(target);

   igual que "Iniciar nuevo ciclo" en vez de tirarla — así no se pierde nada si más
   adelante se le vuelve a cargar una rutina. */
async function clearRoutineForFormsOnly(){
  const st=DB.students[active], name=st.name;
  if(!st.routine||!st.routine.length){ toast('Ya está sin rutina','ok'); return; }
  if(!await uiConfirm('¿Vaciar la rutina de '+name+' y dejarla solo con formularios? No le van a aparecer las pestañas App/Transcripta/Fotos hasta que le cargues una rutina de nuevo. Si ya tenía sesiones registradas, quedan a salvo archivadas. Te activo de una el Acuerdo y la Anamnesis para que ya le aparezcan.')) return;
  const now=new Date().toISOString();
  if(!st.cycleHistory) st.cycleHistory=[];
  st.cycleHistory.push({ start:st.cycleStart||null, end:now, routine:cp(st.routine), weeks:cp(st.weeks) });
  st.routine=[];
  st.cycleStart=null;
  CACHE=clearedCache(CACHE);
  /* 05/10/2026: sin esto, un alumno "solo con formularios" se quedaba sin NINGUNA pestaña
     (ni rutina, ni Acuerdo, ni Anamnesis) hasta que la profe se acordara de ir a tocar
     "Activar" en Formularios — que es un paso aparte, fácil de pasar por alto porque no
     tiene nada que ver con vaciar la rutina a simple vista. El sentido de este botón es
     justamente que el alumno pueda completarlos, así que ahora se activan solos. */
  if(!st.forms) st.forms={};
  if(!st.forms.acuerdo) st.forms.acuerdo=true;
  if(!st.forms.anamnesis) st.forms.anamnesis=true;

}

async function copyMyLink(){ const url=location.origin+location.pathname.replace(/index\.html$/,'');

async function copyStudentLink(id){
  const st=DB.students[id]; if(!st) return;
  /* 10/10/2026: cada alumno tiene su token secreto; sin él el link no abre nada */
  /* el celular solo deja compartir/copiar en el mismo instante del toque: primero se arma
     el link (el token se crea acá mismo) y el guardado en la nube va de fondo, después */
  const isNew=!st.tok; if(isNew){ st.tok=genTok(); st._ft=st._ft||{}; st._ft.tok=Date.now(); /* fechado: ninguna sincronización lo descarta */ }
  const tok=st.tok;
  (async function(){ try{
    /* mientras otro guardado está en curso, DB se reemplaza por la versión juntada y un token
       recién creado puede quedar afuera: se verifica después de guardar y se repone */
    for(let i=0;i<4;i++){ await saveDB(); const cur=DB.students[id]; if(!cur) return; if(cur.tok===tok) break; cur.tok=tok; cur._ft=cur._ft||{}; cur._ft.tok=Date.now(); }
    if(!RELAY.seeded[id]) await seedPub(id); watchPub(id);
  }catch(e){ console.warn('link seed',e); } })();
  const url=location.origin+location.pathname+'?a='+encodeURIComponent(id)+'&t='+encodeURIComponent(tok)+'&lock=1';
  const shareData={ title:'TaFit · '+st.name, text:'Hola '+st.name+'! Acá está tu link de TaFit 💪', url:url };
  try{
    if(navigator.share && navigator.canShare && navigator.canShare(shareData)){
      await navigator.share(shareData);
      return;
    }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  try{
    await navigator.clipboard.writeText(url);
    toast('Link de '+st.name+' copiado ✓','ok');
  }catch(e){
    uiPrompt('Copiá el link de '+st.name+':', url);
  }
}
/* Lista los ciclos de un alumno (cada uno con su propia rutina "congelada" y rango de fechas).
   Si nunca se usó "Iniciar nuevo ciclo", devuelve un solo ciclo con la rutina actual. */
function studentCycles(){
  const st=DB.students[active];
  const hist=(st.cycleHistory||[]).map(function(c){ return { start:c.start||null, end:c.end||null, routine:c.routine, weeksArr:c.weeks }; });
  hist.push({ start:st.cycleStart||null, end:null, routine:st.routine, weeksArr:st.weeks });
  return hist;
}
/* Sesiones de LOGS que caen dentro del rango de un ciclo, conservando el índice real
   dentro de LOGS (necesario para poder borrar una sesión puntual con delLog). */
function logsForCycle(cycle){
  const out=[];
  LOGS.forEach(function(l,i){
    if(cycle.start&&l.date<cycle.start) return;
    if(cycle.end&&l.date>=cycle.end) return;
    out.push({ e:l, i:i });
  });
  return out;
}

  medidas.push({date:new Date().toISOString(),peso:peso,talla:talla,cintura:cintura,cadera:cadera});
  await Store.set(mediaKey('tafit:medidas:'), JSON.stringify(medidas));
  toast('Medidas guardadas ✓','ok');
  renderPhotos();
}
/* Backup automático */
async function autoBackup(trigger){
  try{
    var snapshot={
      trigger:trigger,
      date:new Date().toISOString(),
      student:active,
      name:DB.students[active]?DB.students[active].name:'',
      cache:JSON.parse(JSON.stringify(CACHE)),
      logs:LOGS.slice(0,10),
    };
    var acuerdo=await Store.get('tafit:form:acuerdo:'+active);
    var anamnesis=await Store.get('tafit:form:anamnesis:'+active);
    if(acuerdo) snapshot.acuerdo=acuerdo;
    if(anamnesis) snapshot.anamnesis=anamnesis;
    var key='tafit:backup:'+active+':'+Date.now();
    await Store.set(key, JSON.stringify(snapshot));
    /* Mantener solo últimos 5 backups por alumno */
    var prefix='tafit:backup:'+active+':';
    var allKeys=[];
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.startsWith(prefix)) allKeys.push(k);
    }
    allKeys.sort();
    while(allKeys.length>5){
      var old=allKeys.shift();
      await Store.del(old);
    }
  }catch(e){ console.warn('Backup:',e); }
}

      if(nd===d&&ne===e){ if(!(k in moved)) out[k]=v; return; }
      vac.push(k);
      if(nd!=null&&ne!=null&&!(v&&v._del)){ const nk='wo_w'+m[1]+'_'+nd+'_'+ne; out[nk]=Object.assign({},v,{_t:now}); moved[nk]=1; }
      return;
    }
    if((m=/^(\d+)\|(\d+)\|(.*)$/.exec(k))){
      const d=+m[1], e=+m[2]; const nd=mapD(d); const ne=(nd==null)?null:mapE(d,e);
      if(nd!=null&&ne!=null) out[nd+'|'+ne+'|'+m[3]]=v; return;
    }
    if((m=/^(obs|hpre|hpost|halarm|core)\|(\d+)$/.exec(k))){ const nd=mapD(+m[2]); if(nd!=null) out[m[1]+'|'+nd]=v; return; }
    if(!(k in out)) out[k]=v;
  });
  vac.forEach(function(k){ if(!(k in moved)) out[k]=woTombstone(); });
  CACHE=out;
}

/* ===================== ASISTENCIA =====================
   Calendario simple por alumno: presente / ausente, separado de si completó o no la
   rutina (eso ya lo cuenta Transcripta). Vive en st.attendance como mapa "AAAA-MM-DD" ->
   'p' (presente) / 'a' (ausente); sin marcar = no existe la clave. */
function pad2(n){ return n<10?'0'+n:''+n; }
function dstr(y,m,d){ return y+'-'+pad2(m+1)+'-'+pad2(d); }
/* log.date guarda un ISO completo en UTC (new Date().toISOString()); para compararlo contra un
   día calendario LOCAL (ej. "hoy") hay que pasarlo por Date y leer año/mes/día locales — comparar
   el string ISO tal cual, o cortarlo con .slice(0,10), da el día equivocado en sesiones cerradas
   de noche (Argentina es UTC-3: un cierre después de las 21h ya cae en el día UTC siguiente). */
function localDateOf(iso){ const d=new Date(iso); return dstr(d.getFullYear(),d.getMonth(),d.getDate()); }
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS_LARGOS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function isoAddDays(iso,delta){ const [y,mo,d]=iso.split('-').map(Number); const dt=new Date(y,mo-1,d); dt.setDate(dt.getDate()+delta); return dstr(dt.getFullYear(),dt.getMonth(),dt.getDate()); }
function isoLabel(iso){ const [y,mo,d]=iso.split('-').map(Number); const dt=new Date(y,mo-1,d); return DIAS_LARGOS[dt.getDay()]+' '+d+' de '+MESES[mo-1].toLowerCase(); }
function asisPrevMonth(){ asisM--; if(asisM<0){ asisM=11; asisY--; } renderAsistencia(); }
function asisNextMonth(){ asisM++; if(asisM>11){ asisM=0; asisY++; } renderAsistencia(); }
function asisPrevDay(){ asisDayISO=isoAddDays(asisDayISO,-1); renderAsistencia(); }
function asisNextDay(){ asisDayISO=isoAddDays(asisDayISO,1); renderAsistencia(); }
function asisGoToday(){ asisDayISO=dstr(_asisNow.getFullYear(),_asisNow.getMonth(),_asisNow.getDate()); renderAsistencia(); }
function asisOpenMes(id){ if(!id) return; asisMesId=id; const now=new Date(); asisY=now.getFullYear(); asisM=now.getMonth(); asisMode='mes'; renderAsistencia(); }

/* ==== Cobros por mes (09/10/2026) ====
   Tami cobra por hora: precio × clases del mes (los días que entrena cada uno, sin
   feriados), y casi todos transfieren. Acá la app hace la cuenta sola y ella solo marca
   "Pagó". Grupos y dúos: cada integrante paga por separado. Monto fijo para quien lo tenga
   (Omar + Martín). Aumento automático cada N meses. Todo vive en el alumno (st.cobro,
   st.cobros[mes][integrante], st.cobroExtra[mes], st.cobroExento[mes]) y los feriados/alias
   en Ajustes (DB.settings). */
const FERIADOS_AR=['2026-10-12','2026-11-23','2026-12-07','2026-12-08','2026-12-25','2027-01-01','2027-02-08','2027-02-09','2027-03-24','2027-03-26','2027-04-02','2027-05-25','2027-06-21'];
const DOW_L=['D','L','M','X','J','V','S'], DOW_N=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
let cobroMes=null, cobroEditId=null, cobroFerEdit=false;
function ymNow(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1); }
function ymAdd(ym,n){ let y=+ym.slice(0,4), m=+ym.slice(5,7)+n; while(m>12){ m-=12; y++; } while(m<1){ m+=12; y--; } return y+'-'+pad2(m); }
function ymDiff(a,b){ return (+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7)); }
function ymLabel(ym){ return MESES[+ym.slice(5,7)-1]+' '+ym.slice(0,4); }
function money(n){ return '$'+Math.round(+n||0).toLocaleString('es-AR'); }
function feriadosSet(){ const st=DB.settings||{}; const f=new Set(FERIADOS_AR); (st.feriadosOn||[]).forEach(function(d){ f.add(d); }); (st.feriadosOff||[]).forEach(function(d){ f.delete(d); }); return f; }
function conAumento(base,c,ym){ let p=+base||0; const a=c.aumento; if(a&&a.desde&&+a.monto&&ym>=a.desde) p+=(+a.monto)*(1+Math.floor(ymDiff(a.desde,ym)/(+a.cada||3))); return p; }
function proxAumento(c,ym){ const a=c.aumento; if(!a||!a.desde||!+a.monto) return null; if(ym<a.desde) return a.desde; const k=Math.floor(ymDiff(a.desde,ym)/(+a.cada||3))+1; return ymAdd(a.desde,k*(+a.cada||3)); }
function clasesMes(c,ym){ const y=+ym.slice(0,4), m=+ym.slice(5,7)-1, n=new Date(y,m+1,0).getDate(); const fer=feriadosSet(); const dias=c.dias||[]; let cnt=0; const feri=[];
  for(let d=1; d<=n; d++){ const dow=new Date(y,m,d).getDay(); if(dias.indexOf(dow)<0) continue; const iso=dstr(y,m,d); if(fer.has(iso)) feri.push(iso); else cnt++; }
  return {n:cnt, fer:feri}; }
/* Alumnos virtuales: pagan un plan cada X días (Tami: 45 días, "cada mes y medio").
   Pagos en st.cobroVirt=[{fecha,monto}]; el próximo vence a los X días del último. */
function addDaysISO(iso,n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function virtLast(st,c){ const ps=(st.cobroVirt||[]).map(function(p){ return p.fecha; }).sort(); return ps.length?ps[ps.length-1]:(c.ultimo||null); }
function virtPayer(id,st,c,ym,exento){
  const nm=st.name+((st.members&&st.members.length>1)?' (las dos)':'');
  const plan=+c.plan||0, cada=+c.cadaDias||45;
  const pagosMes=(st.cobroVirt||[]).filter(function(p){ return p.fecha.slice(0,7)===ym; });
  const base={ id, mi:0, name:nm, virtual:true, exento, monto:exento?0:plan };
  if(pagosMes.length){ const tot=pagosMes.reduce(function(a,p){ return a+(+p.monto||0); },0); return Object.assign(base,{ monto:Math.max(plan,tot), paid:{monto:tot, fecha:pagosMes[pagosMes.length-1].fecha}, detalle:'Plan virtual · cada '+cada+' días' }); }
  const last=virtLast(st,c);
  if(!last) return Object.assign(base,{ sinDias:true, detalle:'Falta la fecha del último pago' });
  const due=addDaysISO(last,cada); const fin=ym+'-31';
  if(due.slice(0,7)>ym) return Object.assign(base,{ noToca:true, monto:0, detalle:'Plan virtual · próximo pago '+due.slice(8,10)+'/'+due.slice(5,7) });
  const hoy=todayISO(); const dd=Math.round((new Date(due+'T12:00:00')-new Date(hoy+'T12:00:00'))/86400000);
  return Object.assign(base,{ due, detalle:'Plan virtual · '+(dd<0?'venció hace '+(-dd)+' día'+(dd===-1?'':'s')+' ('+due.slice(8,10)+'/'+due.slice(5,7)+')':dd===0?'vence hoy':'vence el '+due.slice(8,10)+'/'+due.slice(5,7)) });
}
function cobroPayers(ym){
  const out=[];
  DB.order.forEach(function(id){ const st=DB.students[id]; if(!st||st.archived) return; const c=st.cobro;
    if(c&&c.parteDe&&DB.students[c.parteDe]) return; /* lo paga junto con otro (ej: Martín dentro de Omar) */
    if(!c||(!+c.precio&&!+c.fijo&&!(c.tipo==='virtual'&&+c.plan))){ out.push({id, mi:0, name:st.name, sinTarifa:true}); return; }
    const exento=(st.cobroExento||[]).indexOf(ym)>=0;
    const paidOf=function(mi){ return ((st.cobros||{})[ym]||{})[mi]||null; };
    if(c.tipo==='virtual'){ out.push(virtPayer(id,st,c,ym,exento)); return; }
    if(+c.fijo&&Array.isArray(c.fijoDesde)&&c.fijoDesde.length){ /* monto fijo nuevo a partir de un mes (ej: Omar + Martín $350.000 desde diciembre) */
      const junto=c.junto&&DB.students[c.junto]?DB.students[c.junto].name:''; let f=+c.fijo; c.fijoDesde.slice().sort(function(a,b){ return a.desde<b.desde?-1:1; }).forEach(function(x){ if(ym>=x.desde) f=+x.monto; });
      out.push({ id, mi:0, name:st.name+(junto?' + '+junto:''), monto:exento?0:f, detalle:'Monto fijo del mes'+(junto?' (los dos)':''), exento, paid:paidOf(0) }); return; }
    if(+c.fijo){ const junto=c.junto&&DB.students[c.junto]?DB.students[c.junto].name:''; const cl=(c.dias&&c.dias.length)?clasesMes(c,ym).n:0;
      /* el aumento es "por hora": sobre un monto fijo se suma por cada clase del mes */
      const sube=(c.aumento&&c.aumento.desde&&ym>=c.aumento.desde)?(conAumento(0,c,ym)*(cl||1)):0;
      out.push({ id, mi:0, name:st.name+(junto?' + '+junto:''), monto:exento?0:(+c.fijo+sube), detalle:'Monto fijo del mes'+(junto?' (los dos)':'')+(sube?' + aumento '+money(conAumento(0,c,ym))+(cl?' × '+cl+' clases':''):''), exento, paid:paidOf(0) }); return; }
    const cl=clasesMes(c,ym); const extra=+((st.cobroExtra||{})[ym]||0); const n=cl.n+extra; const precio=conAumento(c.precio,c,ym); const horas=+c.horas||1;
    const mem=(st.members&&st.members.length>1)?st.members:[st.name];
    const sinDias=!(c.dias&&c.dias.length);
    mem.forEach(function(nm,mi){ out.push({ id, mi, name:nm, grupo:mem.length>1?st.name:'', monto:(exento||sinDias)?0:precio*horas*n, precio, horas, n, extra, fer:cl.fer, sinDias, exento,
      detalle: sinDias?'Faltan los días que entrena':(n+' clase'+(n===1?'':'s')+(extra?' ('+(extra>0?'+':'')+extra+' extra)':'')+' × '+money(precio)+(horas!==1?' × '+horas+' h':'')), paid:paidOf(mi) }); });
  });
  return out;
}

  return 'Hola '+first+'! Te paso la cuota de '+MESES[+ym.slice(5,7)-1].toLowerCase()+': '+(p.n!=null?p.n+' clase'+(p.n===1?'':'s')+' × '+money(p.precio)+' = ':'')+'*'+money(p.monto)+'*.'+(alias?' Podés transferir al alias *'+alias+'*.':'')+' ¡Gracias! 💪'; }

/* ==== Bloqueo por falta de pago (09/10/2026) ====
   Presenciales: si al día 11 del mes Tami no marcó "Pagó" (o el pago no cubre el total).
   Virtuales: a los 3 días de vencido su plan. Dúos y grupos: solo se bloquea la que debe.
   Nunca se bloquea: a quien no tiene tarifa, a quien "no paga este mes", a quien Tami marcó
   "Nunca bloquear", ni antes de COBRO_BLOQ_DESDE (para que Tami tenga tiempo de marcar lo
   que ya le pagaron). Bloquea la rutina; el chat sigue abierto. */
const COBRO_BLOQ_DESDE='2026-10', COBRO_DIA_LIMITE=10, COBRO_MARGEN_VIRTUAL=3;
function payBlockInfo(id,mi){
  const st=DB.students[id]; if(!st||!st.cobro) return null;
  let c=st.cobro, sid=id, pmi=mi;
  if(c.parteDe&&DB.students[c.parteDe]){ sid=c.parteDe; pmi=0; c=DB.students[sid].cobro||{}; }
  if(c.noBloquear) return null;
  const hoy=todayISO(), ym=hoy.slice(0,7);
  const p=cobroPayers(ym).find(function(x){ return x.id===sid&&x.mi===pmi; }); if(!p||p.sinTarifa||p.exento||p.sinDias||p.noToca) return null;
  const pagado=p.paid?+p.paid.monto:0; if(pagado>=p.monto) return null;
  if(p.virtual){ if(!p.due) return null; if(hoy<=addDaysISO(p.due,COBRO_MARGEN_VIRTUAL)) return null; } /* virtuales: bloquean desde ya (Tami, 09/10/2026) */
  else { if(ym<COBRO_BLOQ_DESDE) return null; if(+hoy.slice(8,10)<=COBRO_DIA_LIMITE) return null; } /* presenciales: desde octubre (Tami, 09/10/2026: "si pasó la fecha de pago que se bloqueen") */

}

function generateReportText(cards){
  var txt='📊 *INFORME SEMANAL TAFIT*\n'+new Date().toLocaleDateString('es-AR')+'\n\n';
  cards.forEach(function(c){
    var ds=c.last?Math.floor((Date.now()-new Date(c.last.date).getTime())/(1000*60*60*24)):999;
    txt+='*'+c.name+'*\n';
    txt+='  Sesiones: '+c.sessions+'\n';
    txt+='  Última: '+(c.last?fmtShort(c.last.date):'sin sesiones')+'\n';
    txt+='  Adherencia: '+c.adh+'%\n';
    if(ds>=2&&ds<999) txt+='  ⚠ '+ds+' días sin entrenar\n';
    if(c.last&&c.last.obs) txt+='  📝 '+c.last.obs+'\n';
    txt+='\n';
  });
  txt+='_Generado por TaFit_';
  return txt;
}
function fmtShort(iso){ const d=new Date(iso); return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}); }

/* ===================== BACKUP ===================== */
/* Claves de Acuerdo/Anamnesis de un alumno: viven en SU PROPIA clave de Store (no dentro
   de DB.students), una por tipo de formulario y, en un dúo, una por integrante. */
function studentFormKeys(id){
  const s=DB.students[id]; const keys=['tafit:form:acuerdo:'+id,'tafit:form:anamnesis:'+id];
  if(s&&s.members&&s.members.length>1){ for(let mi=0;mi<s.members.length;mi++){ keys.push('tafit:form:acuerdo:'+id+':'+mi,'tafit:form:anamnesis:'+id+':'+mi); } }
  return keys;
}
async function exportData(){
  /* v7 (05/10/2026): el backup NUNCA había incluido las respuestas de Acuerdo/Anamnesis
     (viven en su propia clave, fuera de DB.students) — así que restaurar desde un backup
     viejo, o desde uno de mis parches de corrección, podía dejar esas respuestas afuera
     sin que se notara. Ahora se exportan también. */
  const p={ _app:'TaFit', _v:7, exported:new Date().toISOString(), db:DB, data:{}, logs:{}, forms:{} };
  for(const id of DB.order){
    p.data[id]=safeParse(await Store.get('tafit:data:'+id)||'{}',{});
    p.logs[id]=safeParse(await Store.get('tafit:logs:'+id)||'[]',[]);
    for(const fk of studentFormKeys(id)){ const v=await Store.get(fk); if(v!=null) p.forms[fk]=v; }
  }
  const blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='TaFit-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); URL.revokeObjectURL(url); toast("Backup descargado ✓",'ok'); }
function importData(e){ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=async()=>{ try{ const p=JSON.parse(rd.result); if(!p.db||!p.db.order) throw 0; DB=p.db; if(!DB.settings) DB.settings={pin:""}; if(!DB._seed) DB._seed={}; if(!DB._deleted) DB._deleted={}; if(!DB.exLib) DB.exLib=[]; DB.order.forEach(id=>{ const s=DB.students[id]; if(!s.theme) s.theme=guessFem(s.name)?'f':'m'; if(!s.weeks) s.weeks=cp(DEFAULT_WEEKS); }); await saveDB(true); for(const id of DB.order){ if(p.data&&p.data[id]) await Store.set('tafit:data:'+id,JSON.stringify(p.data[id])); if(p.logs&&p.logs[id]) await Store.set('tafit:logs:'+id,JSON.stringify(p.logs[id])); if(p.forms) for(const fk of studentFormKeys(id)){ if(p.forms[fk]!=null) await Store.set(fk,p.forms[fk]); } } if(!DB.students[active]) active=DB.order[0]; await Store.set('tafit:active',active); await loadStudent(); render(); toast("Backup importado ✓",'ok'); }catch(err){ toast("El archivo no es un backup válido",'warn'); } e.target.value=''; }; rd.readAsText(f); }

document.addEventListener('input',e=>{
  const el=e.target.closest('[data-chg="obs"]'); if(el) updObs(el.value);
  const libEl=e.target.closest('[data-chg="libSearch"]');
  if(libEl){
    libFilter=libEl.value;
    /* Filtra en vivo sin re-renderizar todo el formulario (así no se pierde el foco del
       input de búsqueda mientras se tipea) — oculta/muestra directamente los grupos y filas
       ya dibujados, y esconde también la etiqueta de grupo si le quedan 0 filas visibles. */
    const sec=libEl.closest('.tacc-body'); if(!sec) return;
    const q=libFilter.trim().toLowerCase();
    let curLabel=null, curVisible=0;
    Array.from(sec.children).forEach(function(child){
      if(child.tagName==='LABEL'&&child.classList.contains('lib-glabel')){
        if(curLabel) curLabel.style.display=curVisible>0?'':'none';
        curLabel=child; curVisible=0; child.style.display='';
        return;
      }
      if(child.classList&&(child.classList.contains('lib-row')||child.classList.contains('lib-edit-row'))){
        const show=!q||(child.textContent||'').toLowerCase().includes(q);
        child.style.display=show?'':'none';
        if(show) curVisible++;
      }
    });
    if(curLabel) curLabel.style.display=curVisible>0?'':'none';
  }
});
$('lb').addEventListener('click',()=>$('lb').classList.remove('show'));
$('mok').addEventListener('click',()=>_modalClose(true));
$('mcancel').addEventListener('click',()=>_modalClose(false));
$('minput').addEventListener('keydown',e=>{ if(e.key==='Enter') _modalClose(true); else if(e.key==='Escape') _modalClose(false); });
/* Cross-tab sync en mismo dispositivo */
window.addEventListener('storage',function(e){
  if(e.key&&shouldSync(e.key)&&!_fromRemote){
    _fromRemote=true;
    reloadFromRemote().then(function(){ _fromRemote=false; });
  }
});
</script>
