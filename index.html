function renderFormHTML(schema,data,type,editable){
  let h='';
  schema.forEach((sec,si)=>{
    const secOpen=!sec.accordion||data._ts;
    h+=`<div class="form-sec"><div class="form-sec-hdr ${type}" data-act="formAccordion" data-si="${si}" style="cursor:pointer;display:flex;align-items:center">${esc(sec.title)}${sec.accordion?'<span class="ex-chev" style="margin-left:auto;font-size:14px">▾</span>':''}</div><div class="form-body form-acc-body" data-secidx="${si}"${sec.accordion&&!secOpen?' style="display:none"':''}><div class="form-grid">`;
    sec.fields.forEach(f=>{
      const val=data[f.k]||'';
      const cls='form-field'+(f.full?' full':'');
      const req=f.req?'<span class="req"> *</span>':'';
      if(f.type==='privinfo'){
        h+=`<div class="${cls}"><div class="form-priv">🔒 Tus datos los ve solo tu profe y se usan para entrenarte de forma segura y actuar ante una emergencia. Las preguntas de salud son voluntarias. Al final de la ficha te pido tu consentimiento.<br><button type="button" data-act="showPrivacy">Leer la política de privacidad</button></div></div>`;
      } else if(f.type==='fixed'){
        h+=`<div class="${cls}"><div class="form-lbl">${esc(f.l)}</div><div class="form-view-val" style="font-weight:600">${esc(f.value)}</div></div>`;
      } else if(!editable){
        let display=val;
        if(f.type==='check') display=val?'✓ Sí':'✗ No';
        if(f.type==='yesno') display=val==='si'?'Sí':(val==='no'?'No':'—');
        if(f.type==='checks'&&Array.isArray(val)) display=val.join(', ')||'—';
        if(!display&&display!==0) display='—';
        h+=`<div class="${cls}"><div class="form-lbl">${esc(f.l)}</div><div class="form-view-val">${esc(String(display))}</div></div>`;
      } else if(f.type==='textarea'){
        const show=f.reveal?(' data-reveal="'+f.reveal+'"'):'';
        h+=`<div class="${cls}"${show}${f.reveal&&data[f.reveal]!=='si'?' style="display:none"':''}><div class="form-lbl">${esc(f.l)}${req}</div><textarea class="form-inp" data-fk="${f.k}">${esc(val)}</textarea></div>`;
      } else if(f.type==='select'){
        h+=`<div class="${cls}"><div class="form-lbl">${esc(f.l)}${req}</div><select class="form-inp" data-fk="${f.k}"><option value="">Seleccioná...</option>`;
        (f.opts||[]).forEach(o=>{ h+=`<option value="${esc(o)}"${val===o?' selected':''}>${esc(o)}</option>`; });
        h+=`</select></div>`;
      } else if(f.type==='check'){
        h+=`<div class="${cls}"><label class="form-chk"><input type="checkbox" data-fk="${f.k}" data-ftype="check"${val?' checked':''}> ${esc(f.l)}${req}</label></div>`;
      } else if(f.type==='checks'){
        const arr=Array.isArray(val)?val:[];
        h+=`<div class="${cls}"><div class="form-lbl">${esc(f.l)}${req}</div><div class="form-checks">`;
        (f.opts||[]).forEach(o=>{ h+=`<label class="form-chk"><input type="checkbox" data-fk="${f.k}" data-ftype="checks" value="${esc(o)}"${arr.includes(o)?' checked':''}> ${esc(o)}</label>`; });
        h+=`</div></div>`;
      } else if(f.type==='yesno'){
        h+=`<div class="${cls}"><div class="form-lbl">${esc(f.l)}${req}</div><div class="form-radios"><label class="form-rad"><input type="radio" name="f_${f.k}" data-fk="${f.k}" data-ftype="yesno" value="no"${val==='no'?' checked':''}> No</label><label class="form-rad"><input type="radio" name="f_${f.k}" data-fk="${f.k}" data-ftype="yesno" value="si"${val==='si'?' checked':''}> Sí</label></div></div>`;
      } else {
        const show=f.reveal?(' data-reveal="'+f.reveal+'"'):'';
        h+=`<div class="${cls}"${show}${f.reveal&&data[f.reveal]!=='si'?' style="display:none"':''}><div class="form-lbl">${esc(f.l)}${req}</div><input class="form-inp" type="${f.type||'text'}" data-fk="${f.k}" value="${esc(val)}"></div>`;
      }
    });
    h+=`</div></div></div>`;
  });
  return h;

/* Guarda una foto completa de TODOS los alumnos (rutinas + cargas + sesiones) en la nube,
   una vez por día, en una clave propia ('tafit:autobackup:AAAA-MM-DD') separada del
   documento en vivo ('tafit:students'). No participa del merge alumno por alumno ni de la
   sincronización entre celulares (ver shouldSync) — es solo una caja fuerte con los últimos
   7 días, para poder volver atrás en minutos si algo se corrompe, sin depender de que
   alguien se acuerde de tocar "Exportar backup" a mano. Usa el mismo formato que ese
   backup manual, así que un backup automático se puede reimportar con el mismo botón. */
async function dailyBackupIfNeeded(){
  if(!fsDB) return;
  try{
    const today=new Date().toISOString().slice(0,10);
    if(localStorage.getItem('tafit:lastAutoBackup')===today) return;
    const payload={ _app:'TaFit', _v:6, exported:new Date().toISOString(), auto:true, db:DB, data:{}, logs:{} };
    for(const id of DB.order){
      payload.data[id]=safeParse(await Store.get('tafit:data:'+id)||'{}',{});
      payload.logs[id]=safeParse(await Store.get('tafit:logs:'+id)||'[]',[]);
    }
    const ok=await _pushRaw('tafit:autobackup:'+today, JSON.stringify(payload));
    if(!ok) return; /* sin señal: probamos de nuevo la próxima vez que abra la app */
    localStorage.setItem('tafit:lastAutoBackup', today);
    const idx=safeParse(localStorage.getItem('tafit:autobackupIndex')||'[]',[]);
    if(idx.indexOf(today)<0) idx.push(today);
    idx.sort();
    while(idx.length>7){ const old=idx.shift(); try{ kvCol().doc('tafit:autobackup:'+old).delete(); }catch(e){} }
    localStorage.setItem('tafit:autobackupIndex', JSON.stringify(idx));
  }catch(e){ console.warn('AutoBackup:',e); }
}

function runEntry(x,at){ const km=inf2Num(x.km), sec=+x.sec||inf2Num(x.min)*60||0; const sp=(x.splits||[]).filter(s=>s>0); let b5=0; if(sp.length>=5){ for(let i=0;i+5<=sp.length;i++){ const t=sp.slice(i,i+5).reduce((a,c)=>a+c,0); if(!b5||t<b5) b5=t; } }
  return {at:at,km:km,sec:sec,bk:sp.length?Math.min(...sp):0,b5:b5,pace:km>=1&&sec?sec/km:0}; }
function runHist(before){ return (LOGS||[]).filter(l=>l.ses&&l.ses.tipo==='run').map(l=>runEntry(l.ses,+l.ses.at||Date.parse(l.date))).filter(e=>e.at<before&&(e.km>0||e.sec>0)).sort((a,b)=>b.at-a.at); }

  const R=runRecords(hist), news=[];

  if(cur.bk&&R.bk&&cur.bk<R.bk) news.push(['Km más rápido',paceTxt(cur.bk,1000)+' min/km']); else if(cur.bk&&!R.bk) news.push(['Km más rápido',paceTxt(cur.bk,1000)+' min/km']);

/* Tabata Timer */
let tabataInt=null, tabataState=null, tabataMode='tabata';
function openTabata(title,work,rest,rounds,format){
  $('tabataTitle').textContent=title?String(title).toUpperCase():'TABATA';
  /* El temporizador abre en el formato que se eligió al armar el bloque (Tabata/AMRAP/EMOM)
     — antes siempre abría en Tabata sin importar cuál se había elegido. Igual se puede
     cambiar de formato a mano acá mismo, tocando los botones de arriba, para una sesión
     puntual sin tener que ir a Editar. */
  const fmt=(format==='amrap'||format==='emom')?format:'tabata';
  setTabataMode(fmt);
  if(fmt==='emom'){
    /* El intervalo de EMOM se guarda en "work" (mismo campo que usan Tabata/AMRAP para no
       duplicar el dato), pero el temporizador en modo EMOM lo lee de "Cada (seg)" (tabRest). */
    if(work) $('tabRest').value=work;
    if(rounds) $('tabRounds').value=rounds;
  } else {
    if(work) $('tabWork').value=work;
    if(rest) $('tabRest').value=rest;
    if(rounds) $('tabRounds').value=rounds;
  }
  $('tabata').classList.add('show');
}
function closeTabata(){ stopTabata(); $('tabata').classList.remove('show'); }
function stopTabata(){ if(tabataInt){ clearInterval(tabataInt); tabataInt=null; } tabataState=null; $('tabataPhase').textContent='Listo para empezar'; $('tabataPhase').className='tabata-phase'; $('tabataTime').textContent='00:00'; $('tabataRound').textContent=''; $('tabataStartBtn').textContent='▶ Iniciar'; }
function setTabataMode(mode){
  tabataMode=mode; stopTabata();
  document.querySelectorAll('.tabata-modes button').forEach(b=>b.classList.toggle('sel',b.dataset.mode===mode));
  const fw=$('fldWork'), fr=$('fldRest'), frd=$('fldRounds'), help=$('tabataModeHelp');
  if(mode==='tabata'){
    fw.style.display=''; fr.style.display=''; frd.style.display='';
    $('lblWork').textContent='Trabajo (seg)'; $('lblRest').textContent='Descanso (seg)'; $('lblRounds').textContent='Rondas';
    help.textContent='Alterna trabajo y descanso durante la cantidad de rondas que pongas.';
  } else if(mode==='amrap'){
    fw.style.display=''; fr.style.display='none'; frd.style.display='none';
    $('lblWork').textContent='Duración total (seg)';
    help.textContent='AMRAP: hacé la mayor cantidad de vueltas posibles hasta que se acabe el tiempo. Vos contás las rondas.';
  } else if(mode==='emom'){
    fw.style.display='none'; fr.style.display=''; frd.style.display='';
    $('lblRest').textContent='Cada (seg)'; $('lblRounds').textContent='Rondas (0 = sin límite)';
    help.textContent='EMOM: arranca una ronda nueva cada tantos segundos. Descansás lo que te sobre de esa ronda.';
  }
}
function startTabata(){
  stopTabata();
  audioWarm();
  if(tabataMode==='amrap'){
    var total=parseInt($('tabWork').value)||600;
    tabataState={mode:'amrap',time:total,total:total};
    paintTabata();
    tabataInt=setInterval(function(){
      tabataState.time--;
      if(tabataState.time<=0){ stopTabata(); buzz(true); $('tabataPhase').textContent='¡TERMINADO!'; $('tabataPhase').className='tabata-phase done'; $('tabataTime').textContent='💪'; return; }
      paintTabata();
    },1000);
  } else if(tabataMode==='emom'){
    var every=parseInt($('tabRest').value)||60, totalR=parseInt($('tabRounds').value)||0;
    tabataState={mode:'emom',every:every,rounds:totalR,round:1,time:every};
    paintTabata();
    tabataInt=setInterval(function(){
      tabataState.time--;
      if(tabataState.time<=0){
        if(tabataState.rounds>0&&tabataState.round>=tabataState.rounds){ stopTabata(); buzz(true); $('tabataPhase').textContent='¡TERMINADO!'; $('tabataPhase').className='tabata-phase done'; $('tabataTime').textContent='💪'; return; }
        tabataState.round++; tabataState.time=tabataState.every; buzz(false);
      }
      paintTabata();
    },1000);
  } else {
    var work=parseInt($('tabWork').value)||20, rest=parseInt($('tabRest').value)||10, rounds=parseInt($('tabRounds').value)||8;
    tabataState={mode:'tabata',work:work,rest:rest,rounds:rounds,round:1,phase:'work',time:work};
    paintTabata();
    tabataInt=setInterval(function(){
      tabataState.time--;
      if(tabataState.time<=0){
        if(tabataState.phase==='work'){
          if(tabataState.round>=tabataState.rounds){ stopTabata(); buzz(true); $('tabataPhase').textContent='¡TERMINADO!'; $('tabataPhase').className='tabata-phase done'; $('tabataTime').textContent='💪'; return; }
          tabataState.phase='rest'; tabataState.time=tabataState.rest; buzz(false);
        } else { tabataState.phase='work'; tabataState.round++; tabataState.time=tabataState.work; buzz(false); }
      }
      paintTabata();
    },1000);
  }
  $('tabataStartBtn').textContent='⏸ Reiniciar';
}
function paintTabata(){
  var s=tabataState; if(!s) return;
  var mm=Math.floor(s.time/60),ss=s.time%60; $('tabataTime').textContent=(mm?mm+':':'')+String(ss).padStart(2,'0');
  if(s.mode==='amrap'){
    $('tabataPhase').textContent='¡DALE!'; $('tabataPhase').className='tabata-phase work'; $('tabataRound').textContent='Contá vos las vueltas que completás';
  } else if(s.mode==='emom'){
    $('tabataPhase').textContent='RONDA EN CURSO'; $('tabataPhase').className='tabata-phase work'; $('tabataRound').textContent='Ronda '+s.round+(s.rounds>0?' de '+s.rounds:'');
  } else {
    $('tabataPhase').textContent=s.phase==='work'?'¡TRABAJO!':'DESCANSO'; $('tabataPhase').className='tabata-phase '+(s.phase==='work'?'work':'rest-phase'); $('tabataRound').textContent='Ronda '+s.round+' de '+s.rounds;
  }
}

function getStreak(memberName){
  var L=memberName?LOGS.filter(function(l){ return logHasMember(l,memberName); }):LOGS;
  if(!L.length) return 0;
  var streak=1;
  for(var i=0;i<L.length-1;i++){
    var d1=new Date(L[i].date), d2=new Date(L[i+1].date);
    var diff=Math.floor((d1-d2)/(1000*60*60*24));
    if(diff<=3) streak++; else break;
  }
  return streak;
}
function showStreak(container){
  var s=getStreak();

  div.innerHTML='🔥 '+s+' sesiones consecutivas · ¡No pierdas la racha!';
  container.appendChild(div);
}
/* "Racha de constancia" (06/10/2026): a diferencia de getStreak() de arriba (sesiones
   seguidas, sin importar qué día caen), esta cuenta SEMANAS calendario consecutivas
   (lunes a domingo) con al menos una sesión — para mostrar algo tipo "4 semanas
   seguidas sin faltar", pensado para que lo vean tanto la alumna (pestaña App) como la
   profe (Informe con todas las alumnas). La semana en curso no corta la racha solo por
   no haber entrenado TODAVÍA — se corta recién si ni esta semana ni la anterior tienen
   ninguna sesión cargada. */
function weekStartTs(d){ const dt=new Date(d); dt.setHours(0,0,0,0); const wd=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-wd); return dt.getTime(); }
function getWeeklyStreak(logs,memberName){
  const L=memberName?(logs||[]).filter(function(l){ return logHasMember(l,memberName); }):(logs||[]);
  if(!L.length) return 0;
  const weekSet=new Set(L.map(function(l){ return weekStartTs(l.date); }));
  const weeks=Array.from(weekSet).sort(function(a,b){ return b-a; });
  const oneWeek=7*86400000;
  const thisWeek=weekStartTs(new Date());
  if(weeks[0]<thisWeek-oneWeek) return 0; /* ni esta semana ni la pasada tienen sesión: racha cortada */
  let streak=1, cursor=weeks[0];
  for(let i=1;i<weeks.length;i++){
    if(cursor-weeks[i]===oneWeek){ streak++; cursor=weeks[i]; } else break;
  }
  return streak;
}

/* Una semana está completa cuando cada día de la rutina tiene su sesión cerrada en esa semana */
/* Cuenta una semana como "completada" solo con sesiones cerradas DESPUÉS de que arrancó
   el ciclo actual (st.cycleStart). Sin este corte, sesiones viejas de un ciclo anterior
   (mismo índice de semana / mismo nombre de día, por coincidencia de posición) hacían que
   el desbloqueo progresivo de semanas se saltee de más — por eso una alumna con acceso
   manual limitado a la semana 3 terminaba viendo todas las semanas igual. */
function weekDone(wi){
  const r=routine(); if(r.length===0) return false;
  const st=DB.students[active];
  const cutoff=(st&&st.cycleStart)?Date.parse(st.cycleStart):0;
  /* 09/10/2026: el día se reconoce por su posición (dayIdx) además del nombre: si la profe
     renombra un día ("Día 1" → "Día 1 · Piernas"), las sesiones ya hechas siguen contando */
  return r.every(function(d,di){ return LOGS.some(function(l){
    if(+l.week!==+wi || !(l.dayName===d.day || (l.dayIdx!=null&&+l.dayIdx===di))) return false;
    if(!cutoff) return true;
    const t=l.date?Date.parse(l.date):0;
    return !isNaN(t) && t>=cutoff;
  }); });
}
/* Para alumnas: la semana i se desbloquea SOLO al completar TODOS los días de la anterior. La profe ve todo. */
function wkLocked(i){ if(trainer) return false; const unlockW=(DB.students[active]&&DB.students[active].unlockWeek)||0; if(i<=unlockW) return false; return i>0 && !weekDone(i-1); }

function lastFor(exName,forName){

    const x=log.ex.find(e2=>e2.n===exName); if(!x) continue;
    let sets=null;
    if(x.members){ const me=x.members.find(m2=>m2.name===mname); if(me) sets=me.sets; }
    else sets=x.sets;

/* Junta las series de un ejercicio, filtrando por integrante en cuentas dúo/grupo
   (para Informe individual). Si memberName es null/undefined, junta TODOS los
   integrantes (comportamiento de siempre, usado en vivo durante la sesión). */
function collectMemberSets(x,memberName,cb){
  if(x.members){
    if(memberName){ const me=x.members.find(function(mm){ return mm.name===memberName; }); if(me) (me.sets||[]).forEach(cb); }
    else { x.members.forEach(function(mm){ (mm.sets||[]).forEach(cb); }); }
  } else { (x.sets||[]).forEach(cb); }
}
/* ¿Este log tiene algo cargado por ese integrante puntual? (para no contarle a Nati
   una sesión donde solo entrenó Caro, y viceversa). Alumno individual: siempre true. */
function logHasMember(log,memberName){
  if(!memberName) return true;
  return (log.ex||[]).some(function(x){ return x.members && x.members.some(function(mm){ return mm.name===memberName; }); });
}
function getMaxWeight(exName,memberName){
  let max=0;
  LOGS.forEach(function(log){ log.ex.forEach(function(x){
    if(x.n!==exName) return;
    collectMemberSets(x,memberName,function(s){ var w=firstNum(s.w); if(w&&w>max) max=w; });
  }); });
  return max;
}

/* Resumen del programa · tarjeta de cierre para compartir por WhatsApp.
   Se calcula solo con datos reales de LOGS del alumno activo, no inventa nada. */
function exWeightInLog(log,exName,memberName){
  let max=null;
  (log.ex||[]).forEach(function(x){
    if(x.n!==exName) return;
    collectMemberSets(x,memberName,function(s){ const w=firstNum(s.w); if(w!=null&&w>0&&(max==null||w>max)) max=w; });
  });
  return max;
}
/* Clasificación aproximada por grupo muscular a partir del nombre del ejercicio,
   solo por palabras clave (no hay un campo de "grupo muscular" en los datos). */
const MUSCLE_KEYWORDS=[
  ['Piernas',/sentadilla|prensa|peso muerto|zancada|estocada|femoral|cu[aá]driceps|gemelo|hip thrust|aductor|abductor|b[uú]lgar|pierna/i],
  ['Espalda',/espalda|remo|dorsal|jal[oó]n|pull.?over|vups|gironda/i],
  ['Hombros',/hombro|press militar|arnold|volada|elevaci[oó]n|ment[oó]n/i],
  ['Brazos',/b[ií]ceps|tr[ií]ceps|curl|press franc[eé]s|fondos|copa/i],
  ['Pecho',/pecho|press de banca|press plano|inclinado|flexion(es)?/i],
  ['Core',/abdomin|crunch|plancha|oblicuo|espinales|core|circuito/i],
];
function muscleGroupOf(name){
  const n=name||'';
  for(let i=0;i<MUSCLE_KEYWORDS.length;i++){ if(MUSCLE_KEYWORDS[i][1].test(n)) return MUSCLE_KEYWORDS[i][0]; }
  return null;
}
function computeProgramSummary(cycleOverride,memberName){
  /* Por defecto usa el ciclo actual del alumno (ver startNewCycle). Si se pasa cycleOverride
     (desde el selector de ciclo del Informe), calcula todo para ESE ciclo puntual en cambio,
     usando su propia rutina y semanas "congeladas" — sin tocar ni perder nada del historial.
     memberName (dúos/grupos): si viene, TODO el informe se calcula solo con lo que cargó
     ESE integrante — sesiones, récords, cumplimiento — sin mezclarlo con sus compañeros. */
  const st=DB.students[active];
  const cyc=cycleOverride||{ start:st.cycleStart||null, end:null, routine:st.routine, weeksArr:st.weeks };
  let LOGS_=LOGS.filter(function(l){ if(cyc.start&&l.date<cyc.start) return false; if(cyc.end&&l.date>=cyc.end) return false; return true; });
  if(memberName) LOGS_=LOGS_.filter(function(l){ return logHasMember(l,memberName); });
  const R=cyc.routine||routine();
  const weekDone_=function(wi){ return R.length>0 && R.every(function(d){ return LOGS_.some(function(l){ return +l.week===+wi && l.dayName===d.day; }); }); };

  const logsAsc=LOGS_.slice().reverse(); /* LOGS viene de más nuevo a más viejo */
  const sessions=LOGS_.length;
  const W=cyc.weeksArr||weeks(), totalWeeks=W.length;
  let weeksCompleted=0;
  W.forEach(function(w,wi){ if(weekDone_(wi)) weeksCompleted++; });

  let planTotal=0, doneTotal=0;
  LOGS_.forEach(function(log){ (log.ex||[]).forEach(function(x){
    collectMemberSets(x,memberName,function(s){ planTotal++; if(s.done) doneTotal++; });
  }); });
  const completion=planTotal?Math.round(doneTotal/planTotal*100):0;

  const names=[];
  LOGS_.forEach(function(log){ (log.ex||[]).forEach(function(x){ if(x.n&&names.indexOf(x.n)===-1) names.push(x.n); }); });
  const prog=[];
  names.forEach(function(n){
    let first=null,last=null;
    for(let i=0;i<logsAsc.length;i++){ const w=exWeightInLog(logsAsc[i],n,memberName); if(w!=null){ first=w; break; } }
    for(let i=logsAsc.length-1;i>=0;i--){ const w=exWeightInLog(logsAsc[i],n,memberName); if(w!=null){ last=w; break; } }
    if(first!=null&&last!=null&&first>0&&last>first){ prog.push({ n, first, last, pct:Math.round((last-first)/first*100), metric:'kg' }); return; }
    /* Sin progreso de peso (o ejercicio sin carga: banda, peso corporal) — probamos con
       repeticiones, así no queda vacío para alumnos que no levantan pesas pesadas. */
    let rf=null,rl=null;
    for(let i=0;i<logsAsc.length;i++){ const r=exFieldInLog(logsAsc[i],n,'r',memberName); if(r!=null){ rf=r; break; } }
    for(let i=logsAsc.length-1;i>=0;i--){ const r=exFieldInLog(logsAsc[i],n,'r',memberName); if(r!=null){ rl=r; break; } }
    if(rf!=null&&rl!=null&&rf>0&&rl>rf) prog.push({ n, first:rf, last:rl, pct:Math.round((rl-rf)/rf*100), metric:'reps' });
  });
  prog.sort(function(a,b){ return b.pct-a.pct; });
  const best=prog[0]||null;
  const top=prog.slice(0,5);

  /* Agrupación por grupo muscular (a partir del nombre, ver MUSCLE_KEYWORDS) para
     poder señalar el grupo más fuerte/con mejor evolución, no solo el ejercicio suelto. */
  const groupProg={};
  prog.forEach(function(p){
    const g=muscleGroupOf(p.n); if(!g) return;
    if(!groupProg[g]) groupProg[g]=[];
    groupProg[g].push(p);
  });
  let bestGroup=null;
  const muscleGroups=[];
  Object.keys(groupProg).forEach(function(g){
    const arr=groupProg[g];
    const avgPct=Math.round(arr.reduce(function(a,p){ return a+p.pct; },0)/arr.length);
    const top1=arr.slice().sort(function(a,b){ return b.pct-a.pct; })[0];
    muscleGroups.push({ group:g, avgPct, count:arr.length, top:top1 });
    if(!bestGroup||avgPct>bestGroup.avgPct) bestGroup={ group:g, avgPct, top:top1, count:arr.length };
  });
  muscleGroups.sort(function(a,b){ return b.avgPct-a.avgPct; });

  const weekStats=W.map(function(w,wi){
    const wLogs=LOGS_.filter(function(l){ return +l.week===+wi; });
    if(!wLogs.length) return { t:w.t, n:w.n, hasLogs:false, pct:0, complete:false };
    let plan=0,done=0;
    wLogs.forEach(function(log){ (log.ex||[]).forEach(function(x){
      collectMemberSets(x,memberName,function(s){ plan++; if(s.done) done++; });
    }); });
    return { t:w.t, n:w.n, hasLogs:true, pct:plan?Math.round(done/plan*100):0, complete:weekDone_(wi) };
  });
  let bestWeek=null;
  weekStats.forEach(function(w){ if(w.hasLogs&&(!bestWeek||w.pct>bestWeek.pct)) bestWeek=w; });

  const streak=getStreak(memberName);
  const startDate=logsAsc.length?logsAsc[0].date:null;
  const endDate=logsAsc.length?logsAsc[logsAsc.length-1].date:null;

  const compByEx={};
  LOGS_.forEach(function(log){ (log.ex||[]).forEach(function(x){
    if(!x.n) return;
    if(!compByEx[x.n]) compByEx[x.n]={plan:0,done:0};
    collectMemberSets(x,memberName,function(s){ compByEx[x.n].plan++; if(s.done) compByEx[x.n].done++; });
  }); });
  let improve=null;
  Object.keys(compByEx).forEach(function(n){
    const c=compByEx[n]; if(c.plan<3) return; /* muy pocos datos para sacar conclusiones */
    const ratio=c.done/c.plan;
    if(ratio>=1) return; /* 100% cumplido no es un área para mejorar */
    if(!improve||ratio<improve.ratio) improve={ n, ratio, pct:Math.round(ratio*100) };
  });

  /* Mismo agrupamiento pero por cumplimiento de series, para detectar el grupo
     muscular más flojo (no solo un ejercicio suelto) y sugerir foco concreto. */
  const groupComp={};
  Object.keys(compByEx).forEach(function(n){
    const g=muscleGroupOf(n); if(!g) return;
    const c=compByEx[n];
    if(!groupComp[g]) groupComp[g]={ plan:0, done:0, exs:[] };
    groupComp[g].plan+=c.plan; groupComp[g].done+=c.done; groupComp[g].exs.push(n);
  });
  let weakGroup=null;
  Object.keys(groupComp).forEach(function(g){
    const c=groupComp[g]; if(c.plan<3) return; /* muy pocos datos */
    const ratio=c.done/c.plan;
    if(ratio>=1) return; /* 100% cumplido no es un área para reforzar */
    if(!weakGroup||ratio<weakGroup.ratio) weakGroup={ group:g, ratio, pct:Math.round(ratio*100), exs:c.exs };
  });

  /* Todos los ejercicios de la rutina actual, con el último peso registrado y la tendencia
     (sube/baja/igual) contra el registro anterior — para la sección "Todos los ejercicios". */
  const allEx=[];
  R.forEach(function(d){
    d.ex.forEach(function(ex){
      if(isBlockRow(ex)||!ex.n) return;
      if(allEx.some(function(a){ return a.n===ex.n; })) return; /* mismo ejercicio en 2 días: 1 sola fila */
      const found=[];
      for(let i=0;i<LOGS_.length&&found.length<2;i++){ const w=exWeightInLog(LOGS_[i],ex.n,memberName); if(w!=null) found.push(w); }
      let trend='none', peso=null;
      if(found.length){ peso=found[0]; trend = found.length>1 ? (found[0]>found[1]?'up':(found[0]<found[1]?'down':'same')) : 'same'; }
      /* Peso inicial: el primer registro de este ejercicio DENTRO de este período/ciclo
         (orden cronológico ascendente, ver logsAsc más arriba). */
      let first=null;
      for(let i=0;i<logsAsc.length;i++){ const w=exWeightInLog(logsAsc[i],ex.n,memberName); if(w!=null){ first=w; break; } }
      /* Peso máximo: el récord histórico de TODA la vida del alumno (o de ese integrante
         puntual) con ese ejercicio, sin importar el ciclo — mismo criterio que el "🎉 PR". */
      const max=getMaxWeight(ex.n,memberName);
      const pr=peso!=null&&peso>0&&peso>=max;
      allEx.push({ n:ex.n, reps:ex.s+'×'+(ex.r||''), peso, first, max, trend, pr });
    });
  });

  /* Series semanales de peso para las 1-2 mejores progresiones DE PESO (los progresos por
     repeticiones no se grafican acá, mezclarían dos escalas distintas). Solo semanas con
     datos reales (sin inventar/interpolar). */
  const charts=prog.filter(function(p){ return p.metric==='kg'; }).slice(0,3).map(function(p){
    const series=[];
    for(let wi=0; wi<totalWeeks; wi++){
      const wLogs=LOGS_.filter(function(l){ return +l.week===wi; });
      let max=null;
      wLogs.forEach(function(l){ const w=exWeightInLog(l,p.n,memberName); if(w!=null&&(max==null||w>max)) max=w; });
      if(max!=null) series.push({ label:(W[wi]&&W[wi].t)||('S'+(wi+1)), v:max });
    }
    let exSessions=0;
    LOGS_.forEach(function(l){ if(exWeightInLog(l,p.n,memberName)!=null) exSessions++; });
    return { n:p.n, series, exSessions };
  }).filter(function(c){ return c.series.length>=2; });

  /* "Tu semana": lunes a domingo de la semana calendario actual, comparado contra los días de
     rutina por semana (dayCount) — para el cartel "X de Y entrenamientos" y la tira de días.
     Si el ciclo que se está mirando no es el actual (ej. un ciclo ya cerrado), simplemente da 0,
     no inventa nada. Usa localDateOf() para no confundir el día en sesiones cerradas de noche. */
  const now2=new Date(); now2.setHours(0,0,0,0);
  const dow2=(now2.getDay()+6)%7; /* lunes=0 */
  const monday=new Date(now2); monday.setDate(now2.getDate()-dow2);
  const WD_SHORT=['L','M','X','J','V','S','D'];
  const todayISO2=dstr(now2.getFullYear(),now2.getMonth(),now2.getDate());
  const thisWeekDays=[];
  for(let i=0;i<7;i++){
    const d=new Date(monday); d.setDate(monday.getDate()+i);
    const dISO=dstr(d.getFullYear(),d.getMonth(),d.getDate());
    const dayLogs=LOGS_.filter(function(l){ return localDateOf(l.date)===dISO; });
    thisWeekDays.push({ label:WD_SHORT[i], date:dISO, trained:dayLogs.length>0, isToday:dISO===todayISO2, dayNames:dayLogs.map(function(l){return l.dayName;}) });
  }
  const thisWeek={ days:thisWeekDays, trainedCount:thisWeekDays.filter(function(d){return d.trained;}).length, totalDays:R.length };

  return { sessions, totalWeeks, weeksCompleted, completion, best, top, bestGroup, muscleGroups, improve, weakGroup, weekStats, bestWeek, streak, startDate, endDate, allEx, charts, thisWeek, dayCount:R.length, cyc:{start:cyc.start,end:cyc.end} };
}
function printResumen(){

/* Datos auto-generados del Informe de Evolución (todo calculado, nada manual):
   asistencia/adherencia, checks de progreso, y una conclusión redactada sola. */
function exFieldInLog(log,exName,field,memberName){
  let max=null;
  (log.ex||[]).forEach(function(x){
    if(x.n!==exName) return;
    collectMemberSets(x,memberName,function(s){ const v=firstNum(s[field]); if(v!=null&&v>0&&(max==null||v>max)) max=v; });
  });
  return max;
}
function sessionSetsDone(log,memberName){
  let total=0;
  (log.ex||[]).forEach(function(x){
    collectMemberSets(x,memberName,function(s){ if(s.done) total++; });
  });
  return total;
}
/* Texto "50 kg → 70 kg" o, si el progreso fue por repeticiones (banda/peso corporal), "8 → 12 reps". */
function fmtProg(p){ return p&&p.metric==='reps' ? (p.first+' → '+p.last+' reps') : (p?fmt(p.first)+' → '+fmt(p.last):''); }
/* Gráfico de línea con puntos para "Tu progreso" (evolución de kg por semana). Nada de librerías:
   un SVG chico con path de línea + área degradada + puntos, en los colores del reporte (var(--rep*)
   así hereda el color que tenga #tafit-report en ese momento). */
function lineChartSVG(series){
  const W=280,H=118,padL=8,padR=8,padT=16,padB=20;
  const vals=series.map(function(p){return p.v;});
  const min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
  const range=(max-min)||1;
  const n=series.length;
  const stepX=n>1?(W-padL-padR)/(n-1):0;
  const pts=series.map(function(p,i){
    const x=padL+stepX*i;
    const y=padT+(H-padT-padB)*(1-((p.v-min)/range));
    return {x:x,y:y,v:p.v,label:p.label};
  });
  const linePath=pts.map(function(p,i){ return (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1); }).join(' ');
  const areaPath=linePath+' L'+pts[pts.length-1].x.toFixed(1)+','+(H-padB)+' L'+pts[0].x.toFixed(1)+','+(H-padB)+' Z';
  const dots=pts.map(function(p,i){ const anchor=(i===0)?'start':(i===n-1)?'end':'middle'; const tx=(i===0)?Math.max(0,p.x-1):(i===n-1)?Math.min(W,p.x+1):p.x; return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.5" fill="var(--repBrand)" stroke="#fff" stroke-width="1.5"/><text x="'+tx.toFixed(1)+'" y="'+(p.y-8).toFixed(1)+'" font-size="8.5" font-weight="700" fill="var(--repBrandDk)" text-anchor="'+anchor+'">'+fmt(p.v)+'</text>'; }).join('');
  const labels=pts.map(function(p){ return '<text x="'+p.x.toFixed(1)+'" y="'+(H-5)+'" font-size="8.5" fill="var(--mute)" text-anchor="middle">'+esc(p.label)+'</text>'; }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg">'
    +'<defs><linearGradient id="progGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--repBrand)" stop-opacity="0.30"/><stop offset="100%" stop-color="var(--repBrand)" stop-opacity="0"/></linearGradient></defs>'
    +'<path d="'+areaPath+'" fill="url(#progGrad)"/>'
    +'<path d="'+linePath+'" fill="none" stroke="var(--repBrand)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'
    +dots+labels+'</svg>';
}
function computeInformeAuto(sum,memberName){
  const plannedSessions=Math.max(1,sum.totalWeeks*Math.max(1,sum.dayCount||1));
  const attendancePct=Math.min(100,Math.round(sum.sessions/plannedSessions*100));
  let regularidad;
  if(sum.streak>=3&&attendancePct>=80) regularidad='Constante · racha de '+sum.streak;
  else if(attendancePct>=50) regularidad='Irregular';
  else regularidad='Discontinua';

  const cyc=sum.cyc||{start:null,end:null};
  let LOGS_=LOGS.filter(function(l){ if(cyc.start&&l.date<cyc.start) return false; if(cyc.end&&l.date>=cyc.end) return false; return true; });
  if(memberName) LOGS_=LOGS_.filter(function(l){ return logHasMember(l,memberName); });
  const logsAsc=LOGS_.slice().reverse();
  const names=[]; LOGS_.forEach(function(log){ (log.ex||[]).forEach(function(x){ if(x.n&&names.indexOf(x.n)===-1) names.push(x.n); }); });
  let repIncrease=false;
  names.forEach(function(n){
    let first=null,last=null;
    for(let i=0;i<logsAsc.length;i++){ const r=exFieldInLog(logsAsc[i],n,'r',memberName); if(r!=null){ first=r; break; } }
    for(let i=logsAsc.length-1;i>=0;i--){ const r=exFieldInLog(logsAsc[i],n,'r',memberName); if(r!=null){ last=r; break; } }
    if(first!=null&&last!=null&&last>first) repIncrease=true;
  });
  const volumenIncrease=logsAsc.length>=2&&sessionSetsDone(logsAsc[logsAsc.length-1],memberName)>sessionSetsDone(logsAsc[0],memberName);

  const checks={ cargas:!!sum.best, reps:repIncrease, volumen:volumenIncrease, regularidad:(sum.streak>=3||attendancePct>=80) };

  let qualifier;
  if(attendancePct>=85&&sum.best&&sum.best.pct>=20) qualifier='sobresaliente';
  else if(attendancePct>=70) qualifier='muy buena';
  else if(attendancePct>=50) qualifier='buena';
  else qualifier='en desarrollo';

  const highlight=sum.bestGroup
    ? 'el grupo muscular de '+sum.bestGroup.group+' (+'+sum.bestGroup.avgPct+'% de evolución promedio)'+(sum.bestGroup.top?', con su mayor salto en '+sum.bestGroup.top.n+' ('+fmtProg(sum.bestGroup.top)+')':'')+', además de '+sum.weeksCompleted+' de '+sum.totalWeeks+' semanas completadas'
    : sum.best
      ? 'su progreso en '+sum.best.n+' (+'+sum.best.pct+'%) y '+sum.weeksCompleted+' de '+sum.totalWeeks+' semanas completadas'
      : sum.weeksCompleted+' de '+sum.totalWeeks+' semanas completadas';

  const recommendation=sum.weakGroup
    ? 'Se recomienda reforzar '+sum.weakGroup.group+' en el próximo bloque, donde el cumplimiento de series fue del '+sum.weakGroup.pct+'% — poniendo foco en '+sum.weakGroup.exs.slice(0,2).join(' y ')+'.'
    : sum.improve
      ? 'Se recomienda priorizar '+sum.improve.n+' en el próximo bloque, donde el cumplimiento de series fue más bajo ('+sum.improve.pct+'%).'
      : 'Se recomienda continuar con el plan de entrenamiento, ajustando cargas según la evolución.';

  const nextEvalStr=new Date(Date.now()+30*86400000).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});

  return { plannedSessions, attendancePct, regularidad, checks, qualifier, highlight, recommendation, nextEvalStr };
}

/* Compartir el Informe como imagen (sin pasar por PDF) — Canvas + Web Share API */
function repColors(){
  /* La imagen compartida por WhatsApp usa la misma paleta que el Informe en pantalla para
     ESE alumno: bordó/rosa para tema rosa, azul para tema por defecto — así los alumnos
     varones mantienen su color azul también en la imagen que se comparte. */
  const st=DB.students[active];
  const isF=st&&st.theme==='f';
  return isF
    ? { ink:'#2D0B1B', brand:'#B8285A', brandDk:'#7A1638', tint:'#FBEAEF' }
    : { ink:'#0D1B2A', brand:'#2E86AB', brandDk:'#1B4F72', tint:'#E8F4F8' };
}
function rr(ctx,x,y,w,h,r){
  if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); return; }
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function dataURLToBlob(dataUrl){
  const parts=dataUrl.split(',');
  const mime=parts[0].match(/:(.*?);/)[1];
  const bin=atob(parts[1]);
  const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
function shareWrapText(ctx,text,x,y,maxWidth,lineHeight){
  const words=String(text).split(' ');
  let line='', yy=y;
  for(let i=0;i<words.length;i++){
    const test=line+words[i]+' ';
    if(ctx.measureText(test).width>maxWidth && line){ ctx.fillText(line,x,yy); line=words[i]+' '; yy+=lineHeight; }
    else line=test;
  }
  ctx.fillText(line,x,yy);
  return yy+lineHeight;
}
/* Para dúos/grupos: a quién le corresponde el Informe que se está viendo ahora mismo.
   idx/name quedan en null si el alumno es individual (no hay nada que elegir). */
function resumenMember(){
  const mm=membersOf();
  if(mm.length<=1) return { idx:0, name:null, mm };
  const idx=(resumenMemberIdx!=null&&resumenMemberIdx>=0&&resumenMemberIdx<mm.length)?resumenMemberIdx:Math.min(Math.max(member,0),mm.length-1);
  return { idx, name:mm[idx], mm };
}
function buildShareCanvas(sum,inf,displayName){
  const s=DB.students[active];
  const col=repColors();
  const weakName_=sum.weakGroup?sum.weakGroup.group:(sum.improve?sum.improve.n:null);
  /* Alto adaptable: arranca en un mínimo prolijo y suma solo el espacio de las secciones que van a existir,
     para que no quede un hueco vacío cuando el informe tiene pocos datos todavía. */
  const W=1000;
  let H=245+55+155; /* header + tarjeta + asistencia */
  if(sum.top&&sum.top.length) H+=110;
  if(sum.bestGroup) H+=110;
  if(weakName_) H+=110;
  H+=90; /* línea del calificador */
  H+=190; /* firma + margen inferior */
  H=Math.max(880,H);

  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');

  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,col.brandDk); bg.addColorStop(1,col.brand);
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#fff'; ctx.textAlign='left';
  ctx.font='700 44px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillText('TAFIT', 60, 95);
  ctx.font='400 22px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  ctx.globalAlpha=0.9;
  ctx.fillText('Informe de Progreso · '+(displayName||s.name), 60, 132);
  ctx.globalAlpha=1;

  rr(ctx,50,175,W-100,H-175-70,26);
  ctx.fillStyle='#fff'; ctx.fill();

  let y=245;
  ctx.fillStyle=col.ink; ctx.font='700 30px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillText('📋 Asistencia', 90, y);
  y+=55;

  const tiles=[
    { label:'Sesiones', val:String(sum.sessions) },
    { label:'Adherencia', val:inf.attendancePct+'%' },
    { label:'Racha', val:'🔥'+sum.streak }
  ];
  const gap=18, tileW=(W-180-gap*2)/3;
  tiles.forEach(function(t,i){
    const tx=90+i*(tileW+gap);
    rr(ctx,tx,y,tileW,105,16); ctx.fillStyle=col.tint; ctx.fill();
    ctx.fillStyle=col.brandDk; ctx.textAlign='center';
    ctx.font='700 32px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillText(t.val, tx+tileW/2, y+48);
    ctx.font='600 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillText(t.label, tx+tileW/2, y+80);
    ctx.textAlign='left';
  });
  y+=155;

  if(sum.top&&sum.top.length){
    const p=sum.top[0];
    ctx.fillStyle=col.ink; ctx.font='700 26px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillText('🥇 Récord del período', 90, y); y+=42;
    ctx.font='400 20px system-ui,-apple-system,Segoe UI,Roboto,sans-serif'; ctx.fillStyle='#444';
    /* fmt() ya agrega "kg" solo (ej: "60 kg") — antes acá se sumaba otro " kg" más, y
       quedaba "60 kg → 75 kg kg (+25%)" en la imagen/PDF del informe. */
    const chgTxt=p.metric==='reps' ? (p.n+': '+p.first+' → '+p.last+' reps (+'+p.pct+'%)') : (p.n+': '+fmt(p.first)+' → '+fmt(p.last)+' (+'+p.pct+'%)');
    y=shareWrapText(ctx,chgTxt,90,y,W-260,28)+16;
  }

  if(sum.bestGroup){
    ctx.fillStyle=col.ink; ctx.font='700 26px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillText('💪 Mejor evolución', 90, y); y+=42;
    ctx.font='400 20px system-ui,-apple-system,Segoe UI,Roboto,sans-serif'; ctx.fillStyle='#444';
    y=shareWrapText(ctx,sum.bestGroup.group+' +'+sum.bestGroup.avgPct+'%',90,y,W-260,28)+16;
  }

  if(weakName_){
    ctx.fillStyle=col.ink; ctx.font='700 26px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillText('🎯 Área a reforzar', 90, y); y+=42;
    ctx.font='400 20px system-ui,-apple-system,Segoe UI,Roboto,sans-serif'; ctx.fillStyle='#444';
    y=shareWrapText(ctx,weakName_,90,y,W-260,28)+16;
  }

  ctx.fillStyle=col.brandDk; ctx.font='700 24px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillText('Evolución '+inf.qualifier+' en este período', 90, y+10);

  ctx.textAlign='right'; ctx.fillStyle=col.ink;
  ctx.font='italic 400 26px Georgia,serif';
  ctx.fillText('Tamara Claveria', W-90, H-125);
  ctx.font='400 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif'; ctx.fillStyle='#888';
  ctx.fillText('TAFIT · Entrenadora Personal', W-90, H-100);
  ctx.textAlign='left';

  return cv;
}
/* "Informe de Evolución como PDF" (06/10/2026): hasta ahora "Descargar PDF" abría el
   diálogo de impresión del navegador (printResumen, más arriba) — en iOS, si la app está
   agregada a la pantalla de inicio (modo standalone), eso no funciona para nada (ver el
   comentario de printResumen) y había que explicarle a cada alumna/profe que lo abriera
   en Safari. Esta versión arma un PDF de verdad del lado del celular (con la librería
   jsPDF, se suma una sola vez por wifi y después queda cacheada para usarla offline,
   igual que Firebase) a partir de la MISMA imagen prolija que ya se usa para "Compartir
   por WhatsApp" (buildShareCanvas) — así no hay dos diseños distintos del informe
   dando vueltas, y como no depende del diálogo de impresión del sistema, funciona igual
   en iOS standalone, Android y escritorio. */
async function downloadInformePDF(){
  const cycles=studentCycles();
  const cIdx=(resumenCycleIdx!=null&&resumenCycleIdx>=0&&resumenCycleIdx<cycles.length)?resumenCycleIdx:cycles.length-1;
  const rm=resumenMember();
  const sum=computeProgramSummary(cycles[cIdx],rm.name);
  if(!sum.sessions){ toast('Todavía no hay datos suficientes para generar el PDF','warn'); return; }
  const inf=computeInformeAuto(sum,rm.name);
  const displayName=rm.name||DB.students[active].name;
  try{
    if(!window.jspdf||!window.jspdf.jsPDF){
      /* Primera vez que se usa en este celular y todavía no bajó jsPDF (sin señal en ese
         momento): en vez de dejar a la profe sin nada, caemos al método anterior. */
      toast('Generando con el método anterior (todavía no se descargó el nuevo) …');
      printResumen();
      return;
    }
    const cv=buildShareCanvas(sum,inf,displayName);
    const imgData=cv.toDataURL('image/png');
    const pageW=210; /* mm — mismo ancho que una hoja A4, para que se imprima bien si hace falta */
    const pageH=pageW*cv.height/cv.width;
    const { jsPDF }=window.jspdf;
    const doc=new jsPDF({ unit:'mm', format:[pageW,pageH] });
    doc.addImage(imgData,'PNG',0,0,pageW,pageH);
    doc.save('informe_'+(displayName||'alumno').replace(/\s+/g,'_')+'.pdf');
    toast('PDF generado ✓','ok');
  }catch(err){
    toast('No se pudo generar el PDF','warn');
  }
}
async function shareInforme(){
  const cycles=studentCycles();
  const cIdx=(resumenCycleIdx!=null&&resumenCycleIdx>=0&&resumenCycleIdx<cycles.length)?resumenCycleIdx:cycles.length-1;
  const rm=resumenMember();
  const sum=computeProgramSummary(cycles[cIdx],rm.name);
  if(!sum.sessions){ toast('Todavía no hay datos suficientes para compartir','warn'); return; }
  const inf=computeInformeAuto(sum,rm.name);
  const displayName=rm.name||DB.students[active].name;
  try{
    const cv=buildShareCanvas(sum,inf,displayName);
    const dataUrl=cv.toDataURL('image/png');
    const blob=dataURLToBlob(dataUrl);
    const fname='informe_'+(displayName||'alumno').replace(/\s+/g,'_')+'.png';
    const file=new File([blob], fname, { type:'image/png' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:'Informe de Progreso · '+displayName });
    } else {
      const w=window.open(dataUrl,'_blank');
      if(!w) toast('Mantené presionada la imagen para guardarla o compartirla','ok');
    }
  }catch(err){
    if(err && err.name==='AbortError') return;
    toast('No se pudo generar la imagen para compartir','warn');
  }
}
/* Tarjeta chiquita y directa para UN récord puntual (a diferencia del Informe completo,
   que necesita varias semanas de datos) — pensada para compartir apenas pasa, en el
   momento en que más entusiasmo hay. Misma paleta/firma que el resto de las tarjetas. */
function buildRecordCard(rec,displayName){
  const col=repColors();
  const W=1000,H=1000;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,col.brandDk); bg.addColorStop(1,col.brand);
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  ctx.textAlign='center';
  ctx.font='700 40px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillStyle='#fff'; ctx.globalAlpha=.85;
  ctx.fillText('TAFIT', W/2, 110);
  ctx.globalAlpha=1;

  ctx.font='140px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillText('🏆', W/2, 330);

  ctx.font='700 54px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillText('¡NUEVO RÉCORD!', W/2, 420);

  rr(ctx,90,480,W-180,260,26);
  ctx.fillStyle='#fff'; ctx.fill();
  ctx.fillStyle=col.ink; ctx.font='700 34px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  shareWrapCenter(ctx,rec.ex,W/2,545,W-260,40);
  ctx.font='700 64px system-ui,-apple-system,Segoe UI,Roboto,sans-serif'; ctx.fillStyle=col.brandDk;
  ctx.fillText(fmt(rec.prevWeight)+' → '+fmt(rec.weight), W/2, 680);

  ctx.font='400 26px system-ui,-apple-system,Segoe UI,Roboto,sans-serif'; ctx.fillStyle='#fff'; ctx.globalAlpha=.9;
  ctx.fillText(String(displayName||''), W/2, 800);
  ctx.globalAlpha=1;

  ctx.font='italic 400 26px Georgia,serif'; ctx.fillStyle='#fff';
  ctx.fillText('Tamara Claveria', W/2, H-90);
  ctx.font='400 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif'; ctx.globalAlpha=.85;
  ctx.fillText('TAFIT · Entrenadora Personal', W/2, H-65);
  ctx.globalAlpha=1;
  ctx.textAlign='left';
  return cv;
}
function shareWrapCenter(ctx,text,cx,y,maxWidth,lineHeight){
  const words=String(text).split(' ');
  let line='', lines=[];
  for(let i=0;i<words.length;i++){
    const test=line+words[i]+' ';
    if(ctx.measureText(test).width>maxWidth && line){ lines.push(line.trim()); line=words[i]+' '; }
    else line=test;
  }
  lines.push(line.trim());
  const startY=y-(lines.length-1)*lineHeight/2;
  lines.forEach((l,i)=>ctx.fillText(l,cx,startY+i*lineHeight));
}
async function shareRecord(idx){

}

/* ==== Informe v2 (07/10/2026) ====
   Diseño nuevo pedido por Tami (aprobado sobre la maqueta del Ciclo 1 de Sofi): portada con
   el logo grande, 3 números, asistencia semana a semana, resumen escrito solo, progreso de
   fuerza, primera vs última vez EN ACORDEÓN por grupo muscular, volumen, grupos, los que más
   subieron, para revisar, constancia en el core, comparación con el ciclo anterior y
   objetivos sugeridos. Nada para escribir a mano. Se ve igual en la app (acordeones
   cerrados) y en el PDF (todo abierto, A4, varias hojas). Sin fotos ni medidas (Tami). */
const INF2_GROUPS=[
  ['Glúteos y piernas',/hip thrust|sentadilla|prensa|femoral|cuadriceps|abduc|aduc|gemelo|step up|caminata|patada|peso muerto|estocada|bulgara|isquio|pistol/],
  ['Espalda',/remo|dorsal|dominada|espinal|pull|jalon|lachine|hiperext|superman/],
  ['Hombros',/hombro|volada|elevacion lateral|militar/],
  ['Pecho y brazos',/press plano|press inclinado|press de pecho|press cerrado|press frances|apertura|biceps|triceps|fondos|flexion|curl(?! femoral)/],
  ['Core',/plancha|pallof|barquito|crunch|sit up|abdom|giro ruso|mountain|v-ups|bicicleta|bird dog|rueda|tijeras|pataditas/],
];
function inf2Norm(n){ return String(n||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim(); }
function inf2Num(x){ const ms=String(x==null?'':x).replace(/,/g,'.').match(/\d+(\.\d+)?/g); if(!ms) return null; return /[\/+]/.test(String(x))?Math.max.apply(null,ms.map(parseFloat)):parseFloat(ms[0]); }
function inf2Group(n){ const k=inf2Norm(n); const g=INF2_GROUPS.find(function(g){ return g[1].test(k); }); return g?g[0]:'Otros'; }
function inf2Kg(x){ return (Math.round(x*10)/10).toString().replace('.',',')+' kg'; }
const INF2_MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function inf2DateLong(iso){ const d=new Date(iso); return d.getDate()+' '+INF2_MESES[d.getMonth()]+' '+d.getFullYear(); }
function inf2DateShort(iso){ const d=new Date(iso); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }
/* series de una sesión para una persona (dúo: por nombre; individual: x.sets) */
function inf2SetsOf(x,memberName){
  if(x.members){ if(!memberName) return null; const me=x.members.find(function(mm){ return mm.name===memberName; }); return me?me.sets:null; }
  return memberName&&x.members?null:(x.sets||null);
}
function computeInforme2(cycle,memberName){
  const logs=logsForCycle(cycle).map(function(o){ return o.e; }).slice().sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
  const sessions=[], perEx={}, names={}, weekVol={}, weekDays={}, groupVol={};
  logs.forEach(function(l){
    let trained=false;
    (l.ex||[]).forEach(function(x){
      const sets=inf2SetsOf(x,memberName); if(!sets||!sets.length) return;
      trained=true;
      const k=inf2Norm(x.n); if(!names[k]) names[k]=x.n;
      const ws=sets.map(function(s){ return inf2Num(s.w); }).filter(function(w){ return w&&w>0&&w<300; });
      if(ws.length){ (perEx[k]=perEx[k]||[]).push({d:l.date,w:Math.max.apply(null,ws)}); }
      let v=0; sets.forEach(function(s){ const w=inf2Num(s.w)||0, r=inf2Num(s.r)||0; if(s.done&&w<300) v+=w*r; });
      weekVol[l.week]=(weekVol[l.week]||0)+v;
      const g=inf2Group(x.n); groupVol[g]=(groupVol[g]||0)+v;
    });
    if(trained){ sessions.push(l); (weekDays[l.week]=weekDays[l.week]||{})[l.dayName]=true; }
  });
  const routineDays=(cycle.routine||[]).map(function(d){ return d.day; });
  const weeksArr=cycle.weeksArr||weeks();
  const weekIdx=Object.keys(weekDays).map(Number).sort(function(a,b){ return a-b; });
  const uniqueDays=weekIdx.reduce(function(a,w){ return a+Object.keys(weekDays[w]).length; },0);
  const planned=weekIdx.length*Math.max(1,routineDays.length);
  const adher=planned?Math.min(100,Math.round(uniqueDays/planned*100)):0;
  const prog=[];
  Object.keys(perEx).forEach(function(k){
    const v=perEx[k]; if(v.length<2) return;
    const a=v[0].w, b=v[v.length-1].w; if(!(a>0)) return;
    prog.push({ n:names[k], a:a, b:b, pct:Math.round((b-a)/a*100), serie:v, g:inf2Group(names[k]) });
  });
  const ups=prog.filter(function(x){ return x.pct>0; }).sort(function(x,y){ return y.pct-x.pct; });
  const downs=prog.filter(function(x){ return x.pct<0; }).sort(function(x,y){ return x.pct-y.pct; });
  const avgUp=prog.length?Math.round(prog.reduce(function(a,x){ return a+x.pct; },0)/prog.length):0;
  const totalVol=Object.keys(weekVol).reduce(function(a,k){ return a+weekVol[k]; },0);
  /* core elegido por la alumna (sesiones con e.core, desde v8-104) */
  const coreSes=logs.filter(function(l){ return l.core&&l.core.done&&l.core.done.length; });
  const coreFmt={}, coreEx={};
  coreSes.forEach(function(l){ coreFmt[l.core.fmt]=(coreFmt[l.core.fmt]||0)+1; (l.core.done||[]).forEach(function(n){ coreEx[n]=(coreEx[n]||0)+1; }); });
  /* cardio guiado (09/10/2026): distancia de cada sesión por ejercicio */
  const cardio={};
  logs.forEach(function(l){ if(l.ses&&l.ses.tipo==='run'&&inf2Num(l.ses.km)>0) (cardio['🏃 Running']=cardio['🏃 Running']||[]).push({d:l.date,w:inf2Num(l.ses.km)}); if(l.ses&&l.ses.tipo==='swim'&&inf2Num(l.ses.m)>0) (cardio['🏊 Natación (km)']=cardio['🏊 Natación (km)']||[]).push({d:l.date,w:inf2Num(l.ses.m)/1000}); });
  logs.forEach(function(l){ (l.ex||[]).forEach(function(x){ let c=x.cardio; if(x.members){ const me=memberName&&x.members.find(function(mm){ return mm.name===memberName; }); c=me&&me.cardio; } const km=c&&inf2Num(c.km); if(km>0) (cardio[x.n]=cardio[x.n]||[]).push({d:l.date,w:km,kcal:inf2Num(c.kcal)||0}); }); });
  const obs=logs.map(function(l){ return (l.obs||'').trim(); }).filter(Boolean);
  return { cardio:cardio, sessions:sessions, uniqueDays:uniqueDays, planned:planned, adher:adher, weekIdx:weekIdx, weekDays:weekDays, weeksArr:weeksArr,
    routineDays:routineDays, prog:prog, ups:ups, downs:downs, avgUp:avgUp, weekVol:weekVol, groupVol:groupVol, totalVol:totalVol,
    coreSes:coreSes, coreFmt:coreFmt, coreEx:coreEx, obs:obs,
    first:sessions.length?sessions[0].date:null, last:sessions.length?sessions[sessions.length-1].date:null };
}
function inf2Spark(serie){
  const w=150,h=62,pad=8, vals=serie.map(function(s){ return s.w; });
  let lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals); if(hi===lo){ lo-=1; hi+=1; }
  const pts=vals.map(function(v,i){ return [pad+i*(w-2*pad)/Math.max(1,vals.length-1), h-pad-(v-lo)/(hi-lo)*(h-2*pad)]; });
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="${pad}" x2="${w-pad}" y1="${h-pad}" y2="${h-pad}" stroke="#E8DFD0"/><polyline points="${pts.map(function(p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ')}" fill="none" stroke="#9B5F26" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(function(p){ return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="#9B5F26" stroke="#fff" stroke-width="1.5"/>`; }).join('')}</svg>`;
}
function inf2WeekBars(d){
  const ks=Object.keys(d.weekVol).map(Number).sort(function(a,b){ return a-b; }); if(!ks.length) return '';
  const mx=Math.max.apply(null,ks.map(function(k){ return d.weekVol[k]; }))||1;
  const W=300,H=150,pad=22, bw=Math.min(44,(W-2*pad)/ks.length-8), gap=ks.length>1?(W-2*pad-bw*ks.length)/(ks.length-1):0;
  let out='';
  ks.forEach(function(k,i){
    const v=d.weekVol[k], bh=Math.max(2,(H-52)*v/mx), x=pad+i*(bw+gap), y=H-24-bh, r=Math.min(4,bh/2);
    out+=`<path d="M${x},${H-24} V${y+r} Q${x},${y} ${x+r},${y} H${x+bw-r} Q${x+bw},${y} ${x+bw},${y+r} V${H-24} Z" fill="#9B5F26"/>`;
    out+=`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="10.5" fill="#241F18" font-weight="700">${(v/1000).toFixed(1).replace('.',',')} t</text>`;
    const lbl=(d.weeksArr[k]&&d.weeksArr[k].t)||('S'+(k+1));
    out+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#8A7866">${esc(lbl)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="${pad-6}" x2="${W-pad+6}" y1="${H-24}" y2="${H-24}" stroke="#E8DFD0"/>${out}</svg>`;
}

  const prev=cIdx>0?computeInforme2(cycles[cIdx-1],rm.name):null;
  const cycleLabel=(cIdx===cycles.length-1)?(cycles.length>1?'Ciclo '+(cIdx+1)+' · actual':'Ciclo actual'):('Ciclo '+(cIdx+1)+' completo');

  m.appendChild(actions);

      const yOff=page===0?0:M;
      ctx.drawImage(canvas,0,start*sc,canvas.width,(end-start)*sc,0,yOff*sc,canvas.width,(end-start)*sc);
      if(page>0){ ctx.fillStyle='#8A7866'; ctx.font=(11*sc)+'px system-ui,sans-serif'; ctx.textAlign='right'; ctx.fillText('TAFIT · Tamara Claveria · '+(page+1),(PW-56)*sc,(PH-14)*sc); }
      if(page>0) doc.addPage([PW,PH]);
      doc.addImage(pc.toDataURL('image/jpeg',0.92),'JPEG',0,0,PW,PH);
      start=end; page++;
      if(page>12) break;
    }
    const fname='Informe_'+String(last.opts.displayName||'alumno').replace(/\s+/g,'_')+'.pdf';
    const blob=doc.output('blob');
    const file=new File([blob],fname,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:'Informe de progreso · '+last.opts.displayName}); }catch(e){ if(!(e&&e.name==='AbortError')) throw e; }
    } else {
      const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); },60000);
    }
    toast('PDF listo ✓','ok');
  }catch(err){ console.warn('PDF:',err); toast('No se pudo generar el PDF','warn'); }
  finally{ host.remove(); }
}

/* 07/10/2026: aviso de peso fuera de lo normal. Caso real: un drop set cargado como
   "102327" (eran 10 / 23 / 27 kg) en un ejercicio que no estaba marcado como drop set.
   Si el número es muy alto (más de 250 kg, o 4 veces lo máximo que levantó antes en ese
   ejercicio), se pregunta antes de dejarlo; si dice que no, la celda queda vacía. No
   aplica a drop sets ni a valores con "/" o "+" (pesos separados a propósito). */
function weightLooksOff(ex,v){
  if(!ex||isDropSet(ex)||/[\/+]/.test(String(v))) return 0;
  const n=firstNum(v); if(!n) return 0;
  const mx=getMaxWeight(ex.n);
  if(n>250||(mx>0&&n>mx*4&&n-mx>20)) return n;
  return 0;
}
let _oddAsking={};
async function confirmOddWeight(ei,si,mi,ex,n){
  const ak=K(ei,si,mi)+'|'+n; if(_oddAsking[ak]) return; _oddAsking[ak]=true;
  const cur=CACHE[K(ei,si,mi)]; if(!cur||firstNum(cur.w)!==n){ delete _oddAsking[ak]; return; } /* ya lo cambió */
  let ok;
  try{ ok=await uiConfirm('¿Seguro que fueron '+String(n).replace('.',',')+' kg en '+ex.n+'?\n\nSi fue un drop set, separá cada peso con / (por ejemplo 10/23/27).'); } finally { delete _oddAsking[ak]; }
  if(ok) return;
  const k=K(ei,si,mi); if(CACHE[k]){ CACHE[k].w=''; delete CACHE[k]._auto; }
  for(let sj=si+1; sj<ex.s; sj++){ const k2=K(ei,sj,mi); if(CACHE[k2]&&CACHE[k2]._auto){ CACHE[k2].w=''; delete CACHE[k2]._auto; const i2=document.querySelector('input[data-chg="set"][data-i="'+ei+'"][data-j="'+sj+'"][data-m="'+mi+'"][data-f="w"]'); if(i2) i2.value=''; } }
  const inp=document.querySelector('input[data-chg="set"][data-i="'+ei+'"][data-j="'+si+'"][data-m="'+mi+'"][data-f="w"]'); if(inp){ inp.value=''; inp.focus(); }
  queueSave();
}
function updSet(ei,si,mi,f,v){ const k=K(ei,si,mi); CACHE[k]=CACHE[k]||{}; CACHE[k][f]=v; CACHE[k]._w=week;
  if(f==='w'&&v){ const exW=routine()[day]&&routine()[day].ex[ei]; const odd=weightLooksOff(exW,v); if(odd) setTimeout(function(){ confirmOddWeight(ei,si,mi,exW,odd); },0); }
  /* Esta celda la tocó la persona a mano — si venía de una copia automática (ver abajo),
     deja de estar marcada como "copiada" para que, si más adelante corrigen la serie de
     origen, SÍ se le pueda volver a copiar el valor nuevo encima. */
  if(f==='w') delete CACHE[k]._auto;
  if(f==='r') delete CACHE[k]._autoR;
  const box=$('rm-'+ei+'-'+mi); if(box) box.innerHTML=rmHTML(ei,mi); queueSave();
  /* 07/10/2026: mismo criterio que el peso, ahora también para las repeticiones — se
     copian a las series siguientes que estén vacías esta semana (o que solo tengan un
     valor que llegó por esta misma copia, marcado _autoR). Nunca pisa reps escritas a mano.
     Esto sí aplica a drop set (las reps no cambian a propósito como los pesos). */
  if(f==='r'&&v){
    const exR=routine()[day]&&routine()[day].ex[ei];
    if(exR){
      for(let sj=si+1; sj<exR.s; sj++){
        const k2=K(ei,sj,mi); const existing=CACHE[k2];
        const hasOwn=existing&&wOf(existing)===+week&&existing.r&&!existing._autoR;
        if(hasOwn) continue;
        CACHE[k2]=(existing&&wOf(existing)===+week)?existing:{}; CACHE[k2].r=v; CACHE[k2]._w=week; CACHE[k2]._autoR=true;
        const inp=document.querySelector('input[data-chg="set"][data-i="'+ei+'"][data-j="'+sj+'"][data-m="'+mi+'"][data-f="r"]');
        if(inp) inp.value=v;
      }
    }
  }
  /* Copiar el mismo peso a las series siguientes que todavía estén vacías esta semana —
     así si levantaste lo mismo en las 3 series, lo escribís una sola vez y se completa
     solo. Nunca pisa una serie que ya tenga un valor escrito A MANO (si después la tocás
     vos, ese valor manda); pero si una serie solo tiene un valor que llegó por esta misma
     copia automática (marcado _auto), sí se actualiza si corregís la serie de origen — por
     eso _auto se guarda y se limpia por separado de "tiene valor cargado". No aplica a
     "drop set" (pesos distintos a propósito en cada serie). */
  if(f==='w'&&v){
    const ex=routine()[day]&&routine()[day].ex[ei];
    if(ex&&!isDropSet(ex)){
      for(let sj=si+1; sj<ex.s; sj++){
        const k2=K(ei,sj,mi); const existing=CACHE[k2];
        const hasOwn=existing&&wOf(existing)===+week&&existing.w&&!existing._auto;
        if(hasOwn) continue;
        CACHE[k2]=existing||{}; CACHE[k2].w=v; CACHE[k2]._w=week; CACHE[k2]._auto=true;
        const inp=document.querySelector('input[data-chg="set"][data-i="'+ei+'"][data-j="'+sj+'"][data-m="'+mi+'"][data-f="w"]');
        if(inp) inp.value=v;
      }
    }
  }
  /* Celebración de nuevo récord — ya existía el cartel de 5 segundos; ahora además
     queda GUARDADO en el alumno (st.records) para poder verlo después en "🏆 Mis
     récords" y compartirlo como tarjeta cuando quiera, no solo en el momento. */
  if(f==='w'&&v){ const exName=routine()[day].ex[ei]?routine()[day].ex[ei].n:''; const maxW=getMaxWeight(exName); const cur=firstNum(v); if(cur&&cur>0&&maxW>0&&cur>maxW){ showRecord(exName,maxW,cur); saveNewRecord(exName,maxW,cur,mi); } }
}
/* Precarga en las series de hoy los pesos de la última vez que se registró este ejercicio
   (botón "↩ Usar estos pesos", al lado de "📈 Última vez"). Misma protección que la copia
   automática entre series: nunca pisa una serie que ya tenga un valor cargado A MANO esta
   semana — si después la corrigen, esa corrección manda. No aplica a "drop set". */
function fillLastWeights(ei,mi){
  const ex=routine()[day]&&routine()[day].ex[ei]; if(!ex||isDropSet(ex)) return;
  const last=lastFor(ex.n); if(!last||!last.sets||!last.sets.length) return;
  let filled=0;
  for(let si=0; si<ex.s; si++){
    const srcSet=last.sets[si]; if(!srcSet||!srcSet.w) continue;
    const k=K(ei,si,mi); const existing=CACHE[k];
    const hasOwn=existing&&wOf(existing)===+week&&existing.w&&!existing._auto;
    if(hasOwn) continue;
    CACHE[k]=existing||{}; CACHE[k].w=srcSet.w; CACHE[k]._w=week; CACHE[k]._auto=true;
    const inp=document.querySelector('input[data-chg="set"][data-i="'+ei+'"][data-j="'+si+'"][data-m="'+mi+'"][data-f="w"]');
    if(inp) inp.value=srcSet.w;
    filled++;
  }
  if(filled){ queueSave(); toast('✓ Pesos de la última vez cargados','ok'); }
  else toast('Ya tenías pesos cargados en todas las series','warn');
}
function saveNewRecord(exName,oldW,newW,mi){
  const st=DB.students[active]; if(!st) return;
  if(!st.records) st.records=[];
  const mm=membersOf(); const memberName=(isDuo()&&mm[mi])?mm[mi]:null;
  /* evita duplicar el mismo récord si updSet dispara varias veces seguidas (ej: el
     usuario sigue tipeando dígitos del mismo número) — nos quedamos con el más alto
     del mismo ejercicio/integrante en los últimos 2 minutos. */
  const now=Date.now();
  const dup=st.records.find(r=>r.ex===exName&&r.memberName==memberName&&(now-Date.parse(r.date))<120000);
  if(dup){ if(newW>dup.weight){ dup.weight=newW; dup.date=new Date().toISOString(); } }
  else { st.records.unshift({ex:exName,memberName,weight:newW,prevWeight:oldW,date:new Date().toISOString()}); }
  if(st.records.length>40) st.records=st.records.slice(0,40);
  saveDB();
}
function showRecord(name,old,now){ var existing=document.querySelector('.record-banner'); if(existing) existing.remove(); var div=document.createElement('div'); div.className='record-banner'; div.textContent='🏆 ¡Nuevo récord en '+name+'! '+old+' kg → '+now+' kg'; var main=$('main'); if(main) main.insertBefore(div,main.firstChild); setTimeout(function(){if(div.parentNode) div.remove();},5000); }
function updObs(v){ CACHE[OBSK()]=v; queueSave(); }
function toggleSet(ei,si,mi,el){ const k=K(ei,si,mi); CACHE[k]=CACHE[k]||{}; CACHE[k].done=!CACHE[k].done; CACHE[k]._w=week; el.classList.toggle('on',CACHE[k].done);
  /* 07/10/2026 (19:50): Tami pidió volver atrás la tilde automática de las series
     siguientes — cada serie se tilda SOLO cuando la toca el alumno, así se ve clarito cuál
     hizo y cuál le falta. (El peso y las reps sí se siguen copiando a las series vacías.) */
  progress(); queueSave(); }
function progress(){ const r=routine(); if(isSesDay(r[day])) return; let total=0,done=0; const mi=isDuo()?member:0; let exDone=0,realExCount=0; const _hid=abPresetIdx(r[day]); r[day].ex.forEach((ex,ei)=>{ if(isBlockRow(ex)||_hid.has(ei)) return; realExCount++; if(cardioOf(ex)){ total++; if(cardioVal(ei,mi).done){ done++; exDone++; } return; } let allDone=true; for(let si=0;si<ex.s;si++){ total++; const _rp=(CACHE[K(ei,si,mi)]||{}); if(wOf(_rp)===+week&&_rp.done) done++; else allDone=false; } if(allDone&&ex.s>0) exDone++; }); const pct=total?Math.round(done/total*100):0; if($('prog')) $('prog').style.width=pct+'%'; if($('proglbl')) $('proglbl').textContent=`${done}/${total} series · ${exDone}/${realExCount} ejercicios · ${pct}%`; if($('progbar2')) $('progbar2').textContent=`Vas ${exDone} de ${realExCount} ejercicios · ${pct}% completado`; const b=$('closebtn'); if(b){ b.classList.toggle('ready',pct===100); b.textContent=pct===100?'✓ Sesión completa · guardar en transcripta':'Cerrar sesión y guardar en transcripta'; } }

function restSec(s){ if(!s) return 0; const str=String(s); if(str.includes(':')){ const p=str.split(':'); return (parseInt(p[0])||0)*60+(parseInt(p[1])||0); } const n=firstNum(str); return n?Math.round(n):0; }
/* Vibración + beep (el contexto de audio se crea en el tap para que iPhone lo permita) */
let _ac=null;
function audioWarm(){ try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; if(!_ac) _ac=new AC(); if(_ac.state==='suspended') _ac.resume(); }catch(e){} }
function buzz(long){ try{ if(navigator.vibrate) navigator.vibrate(long?[250,120,250,120,400]:[120]); }catch(e){}
  try{ if(!_ac) return; const n=long?3:1; for(let i=0;i<n;i++){ const o=_ac.createOscillator(),g=_ac.createGain(); o.connect(g); g.connect(_ac.destination); o.frequency.value=long?880:660; const t0=_ac.currentTime+i*0.28; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.35,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.22); o.start(t0); o.stop(t0+0.25); } }catch(e){} }
function startRest(sec){ stopRest(); if(!sec) return; audioWarm(); restLeft=sec; $('rest').classList.add('show'); paintRest(); restInt=setInterval(()=>{ restLeft--; if(restLeft<=0){ stopRest(); buzz(true); toast('¡Descanso terminado! 💪','ok'); } else paintRest(); },1000); }
function paintRest(){ const mm=Math.floor(restLeft/60), ss=restLeft%60; $('restnum').textContent = mm? (mm+':'+String(ss).padStart(2,'0')) : (ss+' s'); }
function stopRest(){ if(restInt){ clearInterval(restInt); restInt=null; } $('rest').classList.remove('show'); }

function firstNum(s){ if(s==null) return null; const m=String(s).replace(',','.').match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):null; }
function bestSet(ei,mi){ const ex=routine()[day].ex[ei]; let best=null; for(let si=0;si<ex.s;si++){ const raw=CACHE[K(ei,si,mi)]||{}; const v=(wOf(raw)===+week)?raw:{}; const w=firstNum(v.w),r=firstNum(v.r); if(w==null||r==null||w<=0||r<=0) continue; const e=w*(1+r/30); if(!best||e>best.e) best={w,r,e}; } return best; }
function rmHTML(ei,mi){ const b=bestSet(ei,mi); if(!b) return `<summary>RM estimados (8RM→1RM) <span class="best">cargá peso y reps</span></summary><div class="rmempty">Cuando cargues peso y reps de al menos una serie, calculo los RM con la fórmula de Epley.</div>`; let grid=''; for(let n=8;n>=1;n--){ grid+=`<div><b>${fmt(b.e/(1+n/30))}</b><span>${n}RM</span></div>`; } return `<summary>RM estimados (8RM→1RM) <span class="best">mejor: ${fmt(b.w)}×${b.r}</span></summary><div class="rmgrid">${grid}</div>`; }
function fmt(x){ return (Math.round(x*2)/2).toString().replace('.',',')+' kg'; }

async function closeSession(){
  const r=routine(), members=membersOf(), exs=[];
  r[day].ex.forEach((ex,ei)=>{
    if(isBlockRow(ex)) return;
    const mem=[];
    if(cardioOf(ex)){ /* cardio guiado: lo que marcó la máquina */
      members.forEach((mn,mi)=>{ const v=cardioVal(ei,mi); if(v.km||v.kcal||v.min||v.done) mem.push({name:mn,sets:[{s:1,w:'',r:'',rir:'',done:!!v.done}],cardio:{km:v.km||'',kcal:v.kcal||'',min:v.min||''}}); });
      if(mem.length){ if(members.length>1) exs.push({n:ex.n,members:mem}); else exs.push({n:ex.n,sets:mem[0].sets,cardio:mem[0].cardio}); }
      return; }
    members.forEach((mn,mi)=>{ const sets=[]; for(let si=0;si<ex.s;si++){ const v=CACHE[K(ei,si,mi)]||{}; if(v.w||v.r||v.rir||v.done) sets.push({s:si+1,w:v.w||'',r:v.r||'',rir:v.rir||'',done:!!v.done}); } if(sets.length) mem.push({name:mn,sets}); });
    if(mem.length){ if(members.length>1) exs.push({n:ex.n,members:mem}); else exs.push({n:ex.n,sets:mem[0].sets}); }
  });
  const obs=(CACHE[OBSK()]||'').trim();
  const h=health(); let hh=null;
  if(h&&h.enabled){ const pre=CACHE['hpre|'+day]||'', post=CACHE['hpost|'+day]||'', alarms=CACHE['halarm|'+day]||[]; if(pre||post||alarms.length) hh={pre,post,alarms}; }
  /* 07/10/2026: core elegido por el alumno — se guarda aparte (e.core) para no mezclarlo
     con e.ex, que usan los récords/estadísticas. */
  let core=null;
  if(hasCoreDay(r[day])){ const ch=DB.students[active].abChoice, dn=coreDoneList(); if(coreChoiceValid(ch)&&dn.length){ core={fmt:ch.fmt, ex:ch.ex.map(id=>{ const it=coreItem(id); return it?it.n:id; }), done:dn.map(id=>{ const it=coreItem(id); return it?it.n:id; })}; } }
  let ses=null;
  if(isSesDay(r[day])){ const t=sesDayTpl(r[day]); const v=sesVal(); if(t&&(v.km||v.min||v.m||v.fc||t.tipo==='mob')){ ses={tipo:t.tipo, n:(v.plan&&(v.test||v.plan==='Correr libre'))?v.plan:t.n, km:v.km||'', min:v.min||'', fc:v.fc||'', m:v.m||''}; if(v.route) ses.route=v.route; ['sec','splits','rest','zn','plan','rpe','feel','at','test'].forEach(function(f){ if(v[f]) ses[f]=v[f]; }); if(t.prog&&!v.test) ses.prog=t.id; if(t.tipo==='swim'&&!ses.m){ const done=(t.ser||[]).reduce(function(a,x,i){ return a+(v['s'+i]?x.rep*x.m:0); },0); if(done) ses.m=String(done); } } }
  if(!exs.length && !obs && !hh && !core && !ses){ toast("No hay nada cargado en esta sesión todavía",'warn'); return; }
  /* 07/10/2026: aviso de sesión repetida — había días cerrados dos veces seguidas (mismo
     día de rutina, misma semana, minutos de diferencia), que duplicaban la Transcripta. */
  { const dup=LOGS.find(function(l){ return l.dayName===r[day].day&&+l.week===+week&&(Date.now()-Date.parse(l.date))<6*3600*1000; });
    if(dup){ const mins=Math.max(1,Math.round((Date.now()-Date.parse(dup.date))/60000)); const t=mins<60?(mins+' minuto'+(mins===1?'':'s')):(Math.round(mins/60)+' hora'+(Math.round(mins/60)===1?'':'s'));
      if(!await uiConfirm('Ya cerraste '+r[day].day+' de esta semana hace '+t+'.\n\n¿Guardar otra sesión igual en la Transcripta?')) return; } }
  LOGS.unshift({ date:new Date().toISOString(), dayName:r[day].day, dayIdx:day, week, weekName:weeks()[week].t+' '+weeks()[week].n, ex:exs, obs, health:hh, core, ses });
  await saveLogs();
  await autoBackup('sesion');
  /* Avisá al profe (aviso interno, no push): si quien cierra es el alumno, no la profe */
  if(!trainer){ await pushNotif({ id:active, name:DB.students[active].name, date:new Date().toISOString(), dayName:r[day].day, sum:sesNotifTxt(ses) }); }
  /* Limpiar tildes Y pesos del día cerrado para que no aparezcan en semanas/días siguientes */
  r[day].ex.forEach(function(ex,ei){
    for(var mi2=0;mi2<members.length;mi2++){
      for(var si=0;si<ex.s;si++){
        delete CACHE[K(ei,si,mi2)];
      }
    }
  });
  Object.keys(CACHE).forEach(function(k){ if(k.indexOf('cv|'+day+'|')===0) delete CACHE[k]; });
  Object.keys(CACHE).forEach(function(k){ if(k.indexOf('ses|'+day+'|')===0) delete CACHE[k]; });
  delete CACHE[OBSK()];
  delete CACHE[coreSessionKey()];
  await saveData();
  toast("✓ Sesión guardada en la transcripta",'ok');
  renderApp();
}

function objLabel(ex){ const m=membersOf(); if(m.length>1){ const a=(ex.w&&ex.w!=='A definir')?ex.w:'—', b=(ex.w2&&ex.w2!=='A definir')?ex.w2:'—'; return `${esc(m[0])}: ${esc(a)}<br>${esc(m[1])}: ${esc(b)}`; } return esc(ex.w); }
function setsLine(sets){ return sets.map(s=>`S${s.s}: ${s.w?esc(s.w)+'kg':'—'} × ${s.r?esc(s.r):'—'}${(s.rir!=null&&s.rir!=='')?' · RIR '+esc(s.rir):''}`).join(' &nbsp;|&nbsp; '); }
function logEntryHTML(e,i){

    const cvL=function(c){ const p=[]; if(c.km) p.push(String(c.km).replace('.',',')+' km'); if(c.kcal) p.push(c.kcal+' kcal'); if(c.min) p.push(c.min+' min'); return '🫀 '+(p.join(' · ')||'hecho'); };
    if(x.members){ const blocks=x.members.map(mm=>`<div class="lsets"><b>${esc(mm.name)}:</b> ${mm.cardio?esc(cvL(mm.cardio)):setsLine(mm.sets)}</div>`).join(''); return `<div class="log-ex"><div class="len">${esc(x.n)}</div>${blocks}</div>`; }

  }).join('');

  const coreH=e.core?`<div class="log-ex"><div class="len">🔥 Core · ${esc(coreFmtL)}</div><div class="lsets">${(e.core.ex||[]).map(n=>((e.core.done||[]).indexOf(n)>=0?'✓ ':'— ')+esc(n)).join(' &nbsp;|&nbsp; ')}</div></div>`:'';
  let hh='';
  if(e.health){ const fl=(e.health.alarms&&e.health.alarms.length)||e.health.pre==='warn'||e.health.post==='warn'; hh=`<div class="log-health ${fl?'flag':'ok'}">⚕ Pierna · antes: ${esc(e.health.pre||'—')} · después: ${esc(e.health.post||'—')}${(e.health.alarms&&e.health.alarms.length)?' · alarmas: '+esc(e.health.alarms.join(', ')):''}</div>`; }
  const del=trainer?`<div class="log-del"><button class="log-cmt" data-act="logComment" data-i="${i}">💬 Comentar</button><button data-act="delLog" data-i="${i}">eliminar</button></div>`:'';
  return `<details class="log-entry"><summary><span class="le-day">${esc(e.dayName)}<small>${fmtDate(e.date)}</small></span><span class="le-meta">${esc(e.weekName||'')}${e.obs?'<br>📝 obs':''}${(e.health&&((e.health.alarms&&e.health.alarms.length)||e.health.pre==='warn'||e.health.post==='warn'))?'<br>⚕ revisar':''}</span></summary><div class="log-body">${sesH}${coreH}${exh}${obs}${hh}${del}</div></details>`;

function renderTrans(){
  const m=$('main'); m.innerHTML='';
  const cycles=studentCycles();
  const multi=cycles.length>1;
  const lastIdx=cycles.length-1;
  const hero=document.createElement('div'); hero.className='rep-hero';
  hero.innerHTML=`<div class="rep-hero-eyebrow">📖 TRANSCRIPTA</div>
    <div class="rep-hero-title">${esc(DB.students[active].name)}</div>
    <div class="rep-hero-quote">Rutina y registro de sesiones${multi?` · ${cycles.length} ciclos`:''}</div>`;
  m.appendChild(hero);
  const calToggle=document.createElement('button'); calToggle.className='asis-todaybtn'; calToggle.dataset.act='toggleTransCal';
  calToggle.style.cssText='display:block;margin:0 auto 12px;border:none;background:var(--light);color:var(--steel);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer';
  calToggle.textContent=transCalMode?'📋 Ver como lista':'📅 Ver como calendario';
  m.appendChild(calToggle);
  if(transCalMode){ renderTransCalendar(m); return; }

  /* El ciclo actual va SIEMPRE arriba y abierto. Los ciclos cerrados (Transcriptas viejas)
     van debajo, plegados por defecto — así no hay que scrollear todo un ciclo viejo (a
     veces de meses) para llegar a lo de hoy. La numeración "Transcripta N" respeta el
     orden cronológico real (1 = la más vieja) aunque visualmente se muestren al revés. */
  cycles.map(function(cycle,ci){ return {cycle:cycle,ci:ci}; }).reverse().forEach(function(o){
    const cycle=o.cycle, ci=o.ci, isCurrent=(ci===lastIdx);
    const r=cycle.routine||[], W=cycle.weeksArr||DEFAULT_WEEKS;

    let inner='';
    r.forEach(d=>{ if(isSesDay(d)){ inner+=sesTransDayHTML(d); return; } inner+=`<details class="tcard tacc"><summary><h2>${esc(d.day)}</h2><span class="tchev">▾</span></summary><div class="tacc-body">`+d.ex.map(ex=>`<div class="trow"><div class="tn">${esc(ex.n)}<small>${ex.alt?'alt: '+esc(ex.alt):''}${ex.rest?(ex.alt?' · ':'')+'⏱ '+esc(ex.rest):''}</small></div><div class="tv">${ex.s}×${esc(ex.r)}<br>${objLabel(ex)}</div></div>`).join('')+`</div></details>`; });

    inner+=`<details class="tcard tacc"><summary><h2>Progresión (${W.length} semanas)</h2><span class="tchev">▾</span></summary><div class="tacc-body prog-list">${W.map(w=>`<p><b>${esc(w.t)} · ${esc(w.n)}</b> — ${esc(w.d)}</p>`).join('')}</div></details>`;

    const cLogs=logsForCycle(cycle);
    let body;
    if(!cLogs.length) body=`<div class="empty">Todavía no hay sesiones registradas${multi?' en este ciclo':''}.<br>Cuando cierres una sesión en la pestaña App, aparece acá automáticamente.</div>`;
    else body=cLogs.map(function(o2){ return logEntryHTML(o2.e,o2.i); }).join('');
    inner+=`<div class="tcard"><h2>Sesiones completadas (${cLogs.length})</h2>${body}</div>`;

    if(!multi){
      /* Un solo ciclo (caso normal, todavía no se usó "Iniciar nuevo ciclo"): se ve
         exactamente igual que siempre, sin encabezado ni nada plegado de más. */
      m.insertAdjacentHTML('beforeend', inner);
      return;
    }

    const rangeTxt=(cycle.start?fmtShort(cycle.start):'inicio')+' — '+(cycle.end?fmtShort(cycle.end):'hoy');
    const lbl=(isCurrent?'📍 Transcripta '+(ci+1)+' · Rutina actual':'📁 Transcripta '+(ci+1)+' · Rutina');
    const wrap=document.createElement('details'); wrap.className='tcycle'; wrap.open=isCurrent;
    wrap.innerHTML=`<summary class="tcycle-sum"><div><b>${lbl}</b><small>${esc(rangeTxt)}</small></div><span class="tchev">▾</span></summary><div class="tcycle-body">${inner}</div>`;
    m.appendChild(wrap);
  });
}
function toggleTransCal(){ transCalMode=!transCalMode; const n=new Date(); transCalY=n.getFullYear(); transCalM=n.getMonth(); renderTrans(); }

/* Calendario mensual de UN alumno: no pide nada cargado a mano — marca sola los días con
   sesión cerrada (viene de LOGS, lo mismo que llena Transcripta) y, con contorno, los días
   de la semana en que esa rutina está programada (viene de "Día de la semana" en Editar).
   Si un día tiene las dos cosas, gana el verde de "sesión hecha". */
function renderTransCalendar(m){
  const st=DB.students[active];
  const schedDows=new Set((st.routine||[]).map(d=>d.wd).filter(Boolean));
  const logsByDate={};
  LOGS.forEach(function(l,i){
    const d=new Date(l.date); if(isNaN(d)) return;
    const ds=dstr(d.getFullYear(),d.getMonth(),d.getDate());
    (logsByDate[ds]=logsByDate[ds]||[]).push({log:l,i:i});
  });
  const nav=document.createElement('div'); nav.className='asis-nav';
  nav.innerHTML=`<button data-act="transCalPrev">◀</button><b>${MESES[transCalM]} ${transCalY}</b><button data-act="transCalNext">▶</button>`;
  m.appendChild(nav);
  const doneCount=Object.keys(logsByDate).filter(function(ds){ return ds.slice(0,7)===(transCalY+'-'+pad2(transCalM+1)); }).length;
  const sum=document.createElement('div'); sum.className='asis-summary';
  sum.innerHTML=`<span class="ok">✓ ${doneCount} día${doneCount===1?'':'s'} entrenado${doneCount===1?'':'s'}</span>${schedDows.size?`<span style="color:var(--steel)">◻ programado: ${Array.from(schedDows).join(', ')}</span>`:''}`;
  m.appendChild(sum);
  const grid=document.createElement('div'); grid.className='asis-grid';
  ['L','M','X','J','V','S','D'].forEach(function(w){ const h=document.createElement('div'); h.className='asis-dow'; h.textContent=w; grid.appendChild(h); });
  const first=new Date(transCalY,transCalM,1);
  const startOffset=(first.getDay()+6)%7;
  const daysInMonth=new Date(transCalY,transCalM+1,0).getDate();
  for(let i=0;i<startOffset;i++){ grid.appendChild(document.createElement('div')); }
  const todayStr=dstr(_asisNow.getFullYear(),_asisNow.getMonth(),_asisNow.getDate());
  for(let d=1; d<=daysInMonth; d++){
    const ds=dstr(transCalY,transCalM,d);
    const dow=WD_NAMES[new Date(transCalY,transCalM,d).getDay()];
    const did=logsByDate[ds];
